<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>ZY Academy | أكاديمية إدارة التمريض</title>
<style>
:root{--bg:#f7f4ff;--sf:#fff;--sr:#ece8ff;--tx:#25234a;--su:#6a6890;--ln:#e0daf5;--ac:#5b4bc4;--on:#fff;--gd:#b8650f;--ok:#1b9e5a;--bad:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14122b;--sf:#1d1a3d;--sr:#262250;--tx:#f1eeff;--su:#aaa6d6;--ln:#35306a;--ac:#9d8cff;--on:#1b1740;--gd:#ffb86b}}
:root[data-theme=dark]{--bg:#14122b;--sf:#1d1a3d;--sr:#262250;--tx:#f1eeff;--su:#aaa6d6;--ln:#35306a;--ac:#9d8cff;--on:#1b1740;--gd:#ffb86b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;padding-bottom:78px;max-width:760px;margin:auto}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;letter-spacing:1px}.logo small{display:block;font-size:11px;color:var(--su);font-weight:500;letter-spacing:0}
.hb{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.ib,.chip{min-height:44px;min-width:44px;border:1px solid var(--ln);background:var(--sr);border-radius:99px;padding:0 12px;font-size:14px;font-weight:600}
.xp{background:var(--gd);color:#1b1740;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
main{padding:14px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:25px;line-height:1.35;margin:4px 0 8px}h2{font-size:20px;margin:0 0 8px}h3{font-size:17px;margin:0 0 6px}em{color:var(--ac);font-style:normal}.su{color:var(--su);font-size:14px}
.cta{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--ac);color:var(--on);font-weight:700;margin-top:10px}
.cta.alt{background:var(--sr);color:var(--tx);border:1px solid var(--ln)}
.ch{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px}
.ch .n{flex:none;width:46px;height:46px;border-radius:14px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:800}
.ch.lock{opacity:.6}.ch.lock .n{background:var(--sr);color:var(--su)}.ch b{display:block}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.para{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.para>div{white-space:pre-line;line-height:2}
.en{direction:ltr;text-align:left;color:var(--su);font-size:15px;line-height:1.8;margin:0 0 14px;white-space:pre-line}
.vid{background:var(--sr);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:14px 0}.vid iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}.vid a{color:var(--ac);display:inline-block;margin-top:6px}.vl{font-weight:700;color:var(--gd);margin-bottom:8px}
dt{font-weight:700;direction:ltr;text-align:start}dd{margin:0 0 10px;color:var(--su)}
.q{border-top:1px solid var(--ln);padding-top:14px;margin-top:14px}.q:first-child{border:0;margin:0;padding:0}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:start;min-height:52px;background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0}
.op i{font-style:normal;font-weight:700;color:var(--ac);width:22px;flex:none}.op.ok{border-color:var(--ok);background:rgba(27,158,90,.18)}.op.no{border-color:var(--bad);background:rgba(217,83,79,.18)}
.why{background:var(--sr);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--su);font-size:12px;font-weight:600}nav button.on{color:var(--ac)}
select,textarea{width:100%;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:10px;font:inherit;margin-bottom:10px}select{min-height:48px}textarea{min-height:130px;direction:ltr;font-size:13px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%;text-align:center}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.card,.ch,.q,.para,.vid{animation:up .5s ease both}.ch{transition:transform .2s}.ch:active{transform:scale(.98)}.op.ok{animation:pop .45s}.op.no{animation:shake .4s}.why{animation:up .4s both}.bar i{transition:width .6s}@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.why{line-height:1.8}.cta.alt{margin-inline-start:8px}

/* Achievement cabinet + original textbook library */
.badge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.badge-item{border:1px solid var(--ln);border-radius:16px;padding:12px 6px;text-align:center;background:var(--sf);min-width:0}
.badge-icon{font-size:32px;display:block;filter:grayscale(1);opacity:.28;transition:.3s}
.badge-item.unlocked .badge-icon{filter:none;opacity:1;animation:pop .5s}
.badge-item.locked .badge-icon{filter:grayscale(1);opacity:.18}
.badge-item b{display:block;font-size:12px;line-height:1.4;margin-top:5px}
.badge-item small{font-size:11px;color:var(--su)}
.book-frame{width:100%;height:min(72vh,780px);border:1px solid var(--ln);border-radius:12px;background:white}
.achievement-pop{border:1px solid var(--gd);background:var(--sr);border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.locked-exam-note{padding:12px;border:1px dashed var(--gd);border-radius:12px;color:var(--su);margin:10px 0}.grand-badge{border:2px solid #e3b341;background:linear-gradient(135deg,#3b2c65,#17142d);padding:18px;border-radius:18px;text-align:center}.grand-badge .medal{font-size:56px;filter:drop-shadow(0 0 8px #f8cf65)}
</style>

<script>
const BOOK_ID='1Eq10GYtyQOYpakydnWwTmgb661wR-vx9';
const BOOK_PREVIEW_URL=`https://drive.google.com/file/d/${BOOK_ID}/preview`;
const BOOK_OPEN_URL=`https://drive.google.com/file/d/${BOOK_ID}/view?usp=sharing`;
const BOOK_DOWNLOAD_URL=`https://drive.google.com/uc?export=download&id=${BOOK_ID}`;
const BASE=[{"id":1,"ar":"مقدمة في القيادة وعملية الإدارة","en":"Introduction to Leadership & Management","pages":"7–18","summaryAr":"تعرّف على أساسيات الإدارة، والفرق بين الإدارة العليا والتنفيذية، ومستويات الإدارة الثلاثة ودور رئيسة التمريض.","summaryEn":"Explore administration, management, the three management levels, and the role of the head nurse.","textAr":"الإدارة (Administration): هي العملية المعنية بتحديد الأهداف، والأهداف العامة، والسياسات، والخطط التي تعمل المنظومة وإدارتها من خلالها. تعتبر الإدارة أكثر شمولاً وتشمل أنشطة وضع الأهداف والفلسفة وصياغة السياسات، وتتم في المستوى الأعلى للمنظمة.\n\nالإدارة التنفيذية (Management): هي عملية اجتماعية وتقنية تستخدم الموارد والمنشآت وتؤثر على السلوك البشري لتحقيق أهداف المنظمة. توفر الإدارة وسائل ترجمة الفلسفة الإدارية والخطط إلى واقع ملموس.\n\nإدارة التمريض (Nursing Management): هي عملية العمل من خلال طاقم التمريض لتقديم الرعاية والعلاج والراحة للعملاء والمرضى.\n\nمستويات الإدارة (Management Levels):\n1. الإدارة العليا: يتخذون القرارات الكبرى التي تؤثر على حاضر ومستقبل المنظمة، مثل مدير خدمات التمريض.\n2. الإدارة الوسطى: مسؤولون عن مديري الخط الأول وحلقة الوصل مع الإدارة العليا، مثل مشرفات التمريض.\n3. إدارة الخط الأول: المسؤولية الأساسية هي إنتاج الرعاية التمريضية المطلوبة، مثل رئيسات التمريض (Head Nurses).","textEn":"Administration determines organizational objectives, philosophy, policies, and plans. It operates at the highest organizational level.\n\nManagement is a social and technical process that uses resources and facilities and influences human behavior to achieve organizational goals. It translates administrative philosophy and plans into practice.\n\nNursing management means working through nursing staff to provide care, cure, and comfort to clients and patients.\n\nManagement levels:\n1. Top-level managers make major decisions affecting the present and future of the organization, such as the Director of Nursing.\n2. Middle-level managers supervise first-line managers and connect them with top management, such as nurse supervisors.\n3. First-line managers focus on producing the required nursing care, such as head nurses.","terms":[["Administration","تحديد الأهداف والسياسات والخطط في أعلى هرم المنظمة.","Determining objectives, policies, and plans at the highest organizational level."],["Management","ترجمة الفلسفة الإدارية والخطط إلى واقع عملي.","Translating administrative philosophy and plans into practice."],["Head Nurse","مدير خط أول يربط الإدارة الوسطى بممرضات الرعاية.","A first-line manager linking middle management and staff nurses."]],"cover":"THE FOUNDATIONS","questions":[{"ar":"رئيسة تمريض في وحدة باطنة تمثل أي مستوى إداري؟","en":"A Head Nurse in a medical unit represents which management level?","optionsAr":["الإدارة العليا","الإدارة الوسطى","إدارة الخط الأول","الإدارة الاستراتيجية"],"optionsEn":["Top level","Middle level","First-line management","Strategic management"],"correct":2,"whyAr":"رئيسة التمريض مدير خط أول، وهي حلقة الوصل المباشرة مع طاقم التمريض.","whyEn":"A head nurse is a first-line manager who works directly with staff nurses."},{"ar":"أي مهمة تعتبر مسؤولية مباشرة للإدارة العليا؟","en":"Which task is a direct responsibility of top administration?","optionsAr":["وضع الرؤية والخطط طويلة الأجل (5–10 سنوات)","إعداد جدول الورديات اليومي","توزيع المهام الروتينية","الإشراف على صرف الأدوية"],"optionsEn":["Establishing long-term vision and 5–10 year plans","Preparing daily shift schedules","Distributing routine tasks","Supervising daily medication dispensing"],"correct":0,"whyAr":"الإدارة العليا مسؤولة عن الرؤية الاستراتيجية والسياسات والخطط طويلة الأجل.","whyEn":"Top administration establishes strategic vision, policies, and long-term plans."},{"ar":"ما الوصف الدقيق لإدارة التمريض؟","en":"What is the accurate description of nursing management?","optionsAr":["العمل من خلال طاقم التمريض لتقديم الرعاية والعلاج والراحة","تحديد احتياجات الأجهزة بالتنسيق مع الأقسام","تنسيق العمل بين التمريض والأقسام متعددة التخصصات","وضع الموازنة الكبرى للمستشفى"],"optionsEn":["Working through nursing staff to provide care, cure, and comfort","Purchasing equipment needs in coordination with departments","Coordinating nursing work with multidisciplinary departments","Creating the major hospital budget"],"correct":0,"whyAr":"إدارة التمريض تعمل من خلال الطاقم لتوفير الرعاية والعلاج والراحة.","whyEn":"Nursing management works through staff to provide care, cure, and comfort."},{"ar":"من يشرف على مديري الخط الأول ويربطهم بالإدارة العليا؟","en":"Who supervises first-line managers and links them to top management?","optionsAr":["الإدارة الوسطى (المشرفون)","رئيسة تمريض الوحدة","مدير خدمات التمريض","مسؤول الجودة وسلامة المرضى"],"optionsEn":["Middle-level managers","The unit head nurse","Director of nursing services","Quality and patient-safety officer"],"correct":0,"whyAr":"المشرفون يمثلون حلقة الوصل بين الإدارة العليا والخط الأول.","whyEn":"Middle managers connect top management with first-line management."},{"ar":"أي مستوى يتخذ قرارات تؤثر على حاضر المنظمة ومستقبلها؟","en":"Which level makes major decisions affecting the organization’s present and future?","optionsAr":["الإدارة العليا","الإدارة الوسطى","الإدارة التنفيذية","مديرو الخط الأول"],"optionsEn":["Top-level management","Middle management","Operational management","First-line managers"],"correct":0,"whyAr":"الإدارة العليا تتخذ القرارات الكبرى للمنظمة.","whyEn":"Top-level managers make major organizational decisions."},{"ar":"ما التركيز الأساسي لمدير الخط الأول؟","en":"What is the primary focus of a first-line manager?","optionsAr":["إنتاج الرعاية التمريضية وإدارة الأنظمة والمواد","وضع استراتيجيات الدولة","تعديل القوانين الوزارية","عقد الاتفاقيات الدولية"],"optionsEn":["Producing nursing care and regulating systems","National health strategies","Modifying ministerial laws","International agreements"],"correct":0,"whyAr":"المسؤولية الأساسية هي إنتاج الرعاية التمريضية المطلوبة.","whyEn":"The primary responsibility is producing the desired nursing care."},{"ar":"هل لجوء ممرضة لرئيسة التعقيم بشأن ضغط عمل الجناح يتماشى مع خط السلطة؟","en":"Does complaining to central sterilization about ward stress follow the chain of command?","optionsAr":["لا، يجب اتباع التسلسل الإداري","نعم، تمامًا","التسلسل لا يهم","يجب اللجوء لوزير الصحة"],"optionsEn":["No, follow the chain of command","Yes, completely","The chain does not matter","Go directly to the minister"],"correct":0,"whyAr":"اتباع سلسلة القيادة يساعد على حل المشكلات بفعالية.","whyEn":"Following the chain of command supports effective problem resolution."},{"ar":"ما الفرق الجوهري بين Administration وManagement؟","en":"What is the core functional difference between administration and management?","optionsAr":["الأولى تحديدية والثانية تنفيذية","كلاهما الشيء نفسه","Management تضع الأهداف الكبرى فقط","Administration تعطي الحقن"],"optionsEn":["Administration is determinative; management is executive","They are identical","Management only sets major goals","Administration gives injections"],"correct":0,"whyAr":"الإدارة العليا تحدد الأهداف والسياسات، والتنفيذية تطبق الخطط.","whyEn":"Administration determines policies and goals; management implements them."},{"ar":"أين يشيع استخدام مصطلح Administration؟","en":"Which organizations commonly use the term administration?","optionsAr":["الحكومية والعسكرية والتعليمية والدينية","الشركات التجارية فقط","مطاعم الوجبات السريعة","متاجر التجزئة الصغيرة"],"optionsEn":["Government, military, educational, and religious organizations","Commercial businesses only","Fast food shops","Small retail stores"],"correct":0,"whyAr":"المصطلح شائع في المؤسسات الحكومية والعسكرية والتعليمية والدينية.","whyEn":"The term is common in government, military, educational, and religious organizations."},{"ar":"بماذا تتأثر قرارات المديرين؟","en":"What influences managers’ decisions?","optionsAr":["قيمهم وآراؤهم ومعتقداتهم","الطقس فقط","ألوان الجدران","طول الممرضات"],"optionsEn":["Their values, opinions, and beliefs","Daily weather only","Wall colors","Nurse height"],"correct":0,"whyAr":"قيم المدير وآراؤه ومعتقداته تؤثر في قراراته.","whyEn":"Managers’ values, opinions, and beliefs influence their decisions."},{"ar":"ما الوظائف الأساسية المرتبطة بالإدارة العليا؟","en":"Which functions are primarily associated with administration?","optionsAr":["التخطيط والتنظيم","التحفيز والسيطرة فقط","إعطاء الحقن الشرجية","حساب أجور النظافة"],"optionsEn":["Planning and organizing","Motivating and controlling only","Giving enemas","Calculating cleaning wages"],"correct":0,"whyAr":"التخطيط والتنظيم من الوظائف الأساسية للإدارة العليا.","whyEn":"Planning and organizing are core administrative functions."},{"ar":"ما المستوى الإداري لمدير خدمات التمريض؟","en":"What level does the Director of Nursing hold?","optionsAr":["الإدارة العليا","إدارة الخط الأول","الإدارة الوسطى","مستوى الطلاب"],"optionsEn":["Top-level management","First-level management","Middle management","Student level"],"correct":0,"whyAr":"مدير خدمات التمريض من الإدارة العليا.","whyEn":"The Director of Nursing is a top-level manager."},{"ar":"ما المستوى الإداري لمشرفي التمريض؟","en":"Which management level do nurse supervisors represent?","optionsAr":["الإدارة الوسطى","الإدارة العليا","الخط الأول","الإدارة التنفيذية"],"optionsEn":["Middle-level management","Top level","First line","Operational management"],"correct":0,"whyAr":"مشرفو التمريض يمثلون الإدارة الوسطى.","whyEn":"Nurse supervisors are middle-level managers."},{"ar":"لماذا تعتبر إدارة التمريض فنًا وعلمًا؟","en":"Why is nursing management both an art and a science?","optionsAr":["تجمع مهارات إنسانية وتقنية وعلمية","تعتمد على الرسم","لا تحتاج دراسة","ترف إداري"],"optionsEn":["It combines human, technical, and scientific skills","It relies on drawing","No academic study is needed","It is an administrative luxury"],"correct":0,"whyAr":"تجمع المعرفة العلمية المنهجية والمهارات الإنسانية والقيادية.","whyEn":"It combines systematic scientific knowledge with human and leadership skills."},{"ar":"ما أثر إدارة التمريض الفعالة على جودة الرعاية؟","en":"What is the impact of effective nursing management on care quality?","optionsAr":["رعاية عالية الجودة وآمنة وفعالة","زيادة تكاليف العلاج","إرهاق العاملين","إغلاق الأقسام"],"optionsEn":["High-quality, safe, and effective patient care","Higher treatment costs","Exhausting staff","Closing wards"],"correct":0,"whyAr":"الإدارة الفعالة تدعم جودة الرعاية وسلامتها وكفاءة التشغيل.","whyEn":"Effective management supports care quality, patient safety, and operational efficiency."}]},{"id":2,"ar":"التخطيط وأدواته","en":"Planning & Planning Tools","pages":"19–33","summaryAr":"من الفكرة إلى التنفيذ: أنواع الخطط، وخصائص التخطيط الفعّال، وصياغة أهداف SMART قابلة للتحقيق.","summaryEn":"From ideas to action: plan types, effective planning, and achievable SMART objectives.","textAr":"التخطيط (Planning): هو عملية تقرير ما يجب أن يتم مقدمًا، وكيف، ومتى، وأين، وبواسطة من يتم إنجازه. وهو وظيفة إدارية أساسية تحدد أهداف المنظمة وتطور الطرق المختلفة لتحقيقها.\n\nأنواع الخطط:\n1. الخطط الاستراتيجية (Strategic Plan): خطط طويلة الأجل (5–10 سنوات) تشمل الأهداف العامة للمنظمة مع مراعاة العوامل البيئية الخارجية.\n2. الخطط التكتيكية (Tactical Plan): تهتم بتنفيذ الخطة الاستراتيجية وتستغرق عادة 1–3 سنوات.\n3. الخطط التشغيلية (Operational Plan): خطط يومية تستهدف الاستخدام الكفء للموارد المتاحة لتحقيق أهداف الوحدة.\n\nأهداف SMART: يجب أن يكون الهدف محددًا (Specific)، قابلًا للقياس (Measurable)، قابلًا للتحقيق (Attainable)، ذا صلة (Relevant)، ومحددًا بزمن (Time-based).","textEn":"Planning means deciding in advance what must be done, how, when, where, and by whom. It is a core management function that determines organizational objectives and develops ways to achieve them.\n\nTypes of plans:\n1. Strategic plans: long-term plans (5–10 years) covering overall organizational goals and external environmental factors.\n2. Tactical plans: plans implementing strategy, usually over 1–3 years.\n3. Operational plans: daily plans for efficient use of available resources to achieve unit objectives.\n\nSMART objectives are Specific, Measurable, Attainable, Relevant, and Time-based.","terms":[["Strategic Plan","خطة طويلة الأجل تغطي الأهداف العامة للمنظمة (5–10 سنوات).","A long-term plan covering overall organizational goals (5–10 years)."],["SMART Objectives","أهداف محددة، قابلة للقياس والتحقيق، ذات صلة ومحددة بزمن.","Specific, Measurable, Attainable, Relevant, and Time-based objectives."]],"cover":"PLAN WITH PURPOSE","questions":[{"ar":"ماذا يعني حرف M في أهداف SMART؟","en":"What does M stand for in SMART objectives?","optionsAr":["مناسب للموارد المتاحة","قابل للقياس","محدد زمنيًا","قابل للتحقيق"],"optionsEn":["Appropriate to available resources","Measurable","Time-bound","Achievable"],"correct":1,"whyAr":"M تعني Measurable: قابل للقياس.","whyEn":"M stands for Measurable."},{"ar":"ما الخطة التي تمتد 1–3 سنوات لتنفيذ الاستراتيجية؟","en":"Which plan spans 1–3 years to implement strategy?","optionsAr":["التشغيلية","التكتيكية","الطارئة","اليومية"],"optionsEn":["Operational","Tactical","Emergency","Daily"],"correct":1,"whyAr":"الخطط التكتيكية تخص الإدارة الوسطى وتنفيذ الاستراتيجية.","whyEn":"Tactical plans guide middle management in implementing strategy over 1–3 years."},{"ar":"ما المدى الزمني النموذجي للخطة الاستراتيجية؟","en":"What is the typical time frame for a strategic plan?","optionsAr":["5–10 سنوات","أسبوع","شهر","24 ساعة"],"optionsEn":["5–10 years","One week","One month","24 hours"],"correct":0,"whyAr":"الخطط الاستراتيجية طويلة الأجل، عادة 5–10 سنوات.","whyEn":"Strategic plans are long term, typically 5–10 years."},{"ar":"من يضع الخطط التشغيلية في المستشفى؟","en":"Who creates operational plans in a hospital?","optionsAr":["مديرو الخط الأول ورئيسات التمريض","مديرو الإدارة الوسطى","مديرو الوحدات والأقسام","مدير خدمات التمريض"],"optionsEn":["First-line managers and head nurses","Middle-level managers","Unit and department managers","Director of nursing services"],"correct":0,"whyAr":"الخطط التشغيلية توجّه الاستخدام اليومي للموارد على مستوى الوحدة.","whyEn":"Operational plans guide daily resource use at the unit level."},{"ar":"الفشل في التخطيط هو تخطيط للفشل: تعكس أهمية ماذا؟","en":"“Failure to plan is planning for failure” emphasizes what?","optionsAr":["التخطيط","التنظيم","الرقابة","التوجيه"],"optionsEn":["Planning","Organizing","Controlling","Directing"],"correct":0,"whyAr":"التخطيط خطوة أساسية لتحقيق النجاح.","whyEn":"Planning is a fundamental step toward success."},{"ar":"ما إحدى خصائص الخطة الفعالة؟","en":"Which is a characteristic of an effective plan?","optionsAr":["الاستقرار مع مرونة مواجهة الطوارئ","غياب الأولويات المحددة","عدم توافق الخطة مع الموارد المتاحة","عدم تحديد المسؤوليات بوضوح"],"optionsEn":["Stability with flexibility for emergencies","Lack of defined priorities","A plan that does not match available resources","Unclear assignment of responsibilities"],"correct":0,"whyAr":"الخطة الفعالة مستقرة وقابلة للتكيف مع الطوارئ.","whyEn":"Effective plans are stable yet flexible enough for emergencies."},{"ar":"ما أول خطوة في عملية التخطيط؟","en":"What is the first step in planning?","optionsAr":["تشخيص المشكلة وتحديد الأهداف","التنفيذ دون تفكير","الاستقالة","إغلاق القسم"],"optionsEn":["Diagnosing the problem and setting objectives","Executing without thinking","Resigning","Closing the unit"],"correct":0,"whyAr":"تبدأ عملية التخطيط بتحديد الاحتياجات والأهداف.","whyEn":"Planning begins by identifying needs and setting objectives."},{"ar":"ما الفرق بين السياسة والإجراء؟","en":"What is the difference between a policy and a procedure?","optionsAr":["السياسة توجيه عام والإجراء خطوات متسلسلة","كلاهما واحد","الإجراء خطة عشر سنوات","السياسة للجدد فقط"],"optionsEn":["Policy is general guidance; procedure gives sequential steps","They are identical","Procedure is a ten-year plan","Policy is only for new staff"],"correct":0,"whyAr":"السياسات توجه القرارات والإجراءات تحدد خطوات الأداء.","whyEn":"Policies guide decisions; procedures detail chronological actions."},{"ar":"لماذا يعتبر التخطيط فعالًا من حيث التكلفة؟","en":"Why is planning cost-effective?","optionsAr":["يمنع هدر الموارد ويوجه الجهود","مجاني تمامًا","يلغي الرواتب","تقليل ساعات التمريض المطلوبة دون الرجوع إلى عبء العمل"],"optionsEn":["It prevents waste and focuses effort","It is completely free","It eliminates salaries","It prevents electricity use"],"correct":0,"whyAr":"التخطيط الجيد يحسن استخدام الموارد البشرية والمالية.","whyEn":"Good planning optimizes human and financial resources."},{"ar":"ماذا تعني الرؤية Vision؟","en":"What does organizational vision mean?","optionsAr":["صورة ذهنية لمستقبل المنظمة","قائمة أسعار الأدوية","تقرير حضور","جدول وجبات"],"optionsEn":["A mental image of the organization’s future","Drug price list","Attendance report","Meal schedule"],"correct":0,"whyAr":"الرؤية تصف الحالة المستقبلية المرغوبة للمنظمة.","whyEn":"Vision describes the desired future state of the organization."},{"ar":"ما تعريف رسالة المنظمة Mission؟","en":"What is an organizational mission?","optionsAr":["بيان يوضح سبب الوجود والهدف الأساسي","خطة يوم واحد","اسم المدير","رقم المستشفى"],"optionsEn":["A statement of why the organization exists and its core aim","A one-day plan","The CEO’s name","Hospital phone number"],"correct":0,"whyAr":"الرسالة توضح سبب وجود المنظمة وهدفها الأساسي.","whyEn":"Mission explains the organization’s purpose and core aim."},{"ar":"ماذا يعني أن الهدف قابل للتحقيق Attainable؟","en":"What does an attainable objective mean?","optionsAr":["واقعي وممكن بالموارد المتاحة","خيالي","يستغرق مئة سنة","مجاني"],"optionsEn":["Realistic and possible with available resources","Imaginary","Takes 100 years","Free"],"correct":0,"whyAr":"الهدف القابل للتحقيق يناسب القدرات والموارد المتاحة.","whyEn":"An attainable goal fits available capabilities and resources."},{"ar":"ما دور سياسات شؤون العاملين؟","en":"What is the role of personnel policies?","optionsAr":["تنظيم الإجازات والترقيات وساعات العمل","تسعير الجراحات","شراء المعدات الثقيلة","تصميم المباني"],"optionsEn":["Regulating leave, promotions, and working hours","Pricing surgeries","Buying heavy equipment","Designing buildings"],"correct":0,"whyAr":"سياسات الأفراد تنظم شؤون العاملين وظروف العمل.","whyEn":"Personnel policies regulate employee affairs and working conditions."},{"ar":"لماذا يفضل وجود دليل سياسات مكتوب؟","en":"Why have a written policy manual?","optionsAr":["توحيد المرجع وتسهيل التدريب وتجنب سوء الفهم","إخفاؤه في الأدراج","زيادة وزن المكتب","ليقرأه المدير فقط"],"optionsEn":["Consistent reference, easier training, and fewer misunderstandings","To hide it","To add weight to the desk","For the manager only"],"correct":0,"whyAr":"السياسات المكتوبة تسهل المراجعة والتدريب وتمنح الموظفين شعورًا بالأمان.","whyEn":"Written policies support consistent review, training, and staff security."},{"ar":"ما أثر غياب خطة تمريض واضحة للوحدة؟","en":"What happens without a clear nursing work plan?","optionsAr":["التخبط والهدر وزيادة الأخطاء والتوتر","انخفاض الأخطاء الناتج عن التنسيق","تحسن التنسيق بين أعضاء الفريق","وضوح الأدوار والمسؤوليات"],"optionsEn":["Chaos, waste, increased errors, and staff stress","Fewer errors resulting from coordination","Improved coordination among team members","Clearer roles and responsibilities"],"correct":0,"whyAr":"غياب التخطيط يؤدي إلى هدر الموارد والأخطاء وتوتر العاملين.","whyEn":"Lack of planning leads to resource waste, errors, and staff stress."}]},{"id":3,"ar":"حل المشكلات","en":"Problem Solving","pages":"34–46","summaryAr":"من تعريف المشكلة إلى أنواعها وطرق حلها، ثم خطوات عملية حل المشكلات السبع وأساليبها.","summaryEn":"From defining a problem to its types and methods, then the seven problem-solving steps and techniques.","textAr":"مقدمة: يواجه مديرو التمريض تحديات تتراوح بين شؤون رعاية المرضى والحفاظ على رضا الطاقم. وتساعد مهارات التفكير الناقد (Critical Thinking) الممرضين على اتخاذ قرارات مبنية على الحقائق والبيانات والأدلة لتحديد أفضل حل. والقادة الفعّالون يرون المشكلات فرصًا لا عقبات.\n\nالمشكلة (Problem): هي الفرق بين ما هو قائم وما يمكن أو يجب أن يكون، أو هي شيء يسبب صعوبة ويصعب التعامل معه.\nحل المشكلات (Problem Solving): مسؤولية المدير في تحديد طبيعة المشكلة ومدى اتساعها، واختيار الأسلوب المناسب للتعامل معها، وتوجيه المرؤوسين لاستخدامه.\n\nأنواع المشكلات الإدارية (Types of Managerial Problems):\n1. مشكلات جيدة التحديد (Structured): مألوفة وواضحة الهدف ومعلوماتها كاملة، وتحتاج قرارًا مبرمجًا (Programmed Decision) متكررًا يُعالج بأسلوب روتيني.\n2. مشكلات سيئة التحديد (Poorly Structured): جديدة أو غير معتادة ومعلوماتها غامضة أو ناقصة، وتحتاج قرارًا غير مبرمج (Non-Programmed Decision) فريدًا بحل مفصّل لها.\n3. المشكلات الطارئة (Crises): أحداث غير متوقعة شديدة التعطيل تتطلب إجراءً فوريًا، مثل الكوارث الطبيعية والحوادث الكبرى والخسائر المالية المفاجئة. وإدارتها تحتاج قرارًا سريعًا وتواصلًا وتوزيعًا للموارد.\n\nطرق حل المشكلات (Problem Solving Methods):\n1. التجربة والخطأ (Trial and Error): تطبيق حل بعد آخر حتى تُحل المشكلة أو يظهر تحسّن.\n2. التجريب العلمي (Scientific Experimentation): دراسة عناصر مختارة من الموقف تحت ظروف مضبوطة بإحكام.\n3. الحل المبتكر (Novel Solution): يبتكر مدير التمريض حلولًا ليس لها نموذج سابق مسجّل في الذاكرة.\n\nخطوات عملية حل المشكلات (Problem Solving Process):\n1. تحديد المشكلة والهدف (Define Problem & Objective) بجمع بيانات دقيقة ومعلومات صحيحة.\n2. تحديد الأسباب المحتملة (Identify Likely Causes).\n3. تحديد الأسباب الرئيسية والجذرية (Identify Major & Root Causes).\n4. تطوير الحلول والاتفاق على خطة عمل (Develop Solutions / Agree Action Plans) مع تحديد كيفية قياس النتائج.\n5. تنفيذ خطة العمل (Implement Action Plan) مع التنسيق والتواصل الجيد لكسب التزام الجميع.\n6. تحديد فعالية الخطة (Determine Effectiveness) بقياس فاعليتها وكفاءتها.\n7. توحيد النتائج وتطبيقها في كل المجالات المعنية (Standardize Results) وتعميمها كدليل إرشادي.\n\nأساليب حل المشكلات (Techniques): 1. العصف الذهني (Brainstorming). 2. السبب والنتيجة (Cause and Effect). 3. أوراق الفحص (Check Sheets). 4. تحليل باريتو (Pareto Analysis). 5. مخطط تدفق العملية (Process Flow Chart).","textEn":"Introduction: Nurse managers face challenges from patient care matters to staff satisfaction. Critical thinking helps nurses make informed decisions based on facts, data, and evidence to find the best solution. Effective leaders see problems as opportunities rather than obstacles.\n\nA problem is the difference between what is and what might or should be, or something that causes difficulty.\nProblem solving is the manager's responsibility to identify the nature and extent of the problem, decide the method for dealing with it, and direct subordinates in using that method.\n\nTypes of managerial problems:\n1. Well-structured: familiar, clear goal, complete information; needs a programmed decision, a repetitive decision handled by a routine approach.\n2. Poorly structured: new or unusual, with ambiguous or incomplete information; needs a non-programmed decision, a unique custom-made solution.\n3. Crises: unexpected, highly disruptive events needing immediate action, such as natural disasters, major accidents, or sudden financial losses. They call for quick decisions, communication, and resource allocation.\n\nProblem-solving methods:\n1. Trial and error: applying one solution after another until the problem is solved or improves.\n2. Scientific experimentation: studying selected elements of the situation under highly controlled conditions.\n3. Novel solution: the nurse manager invents solutions that have no previously recorded prototype.\n\nThe problem-solving process:\n1. Define the problem and objective using accurate data.\n2. Identify likely causes.\n3. Identify major and root causes.\n4. Develop solutions and agree on action plans, including how results will be measured.\n5. Implement the action plan, coordinating and communicating to gain commitment.\n6. Determine effectiveness by measuring efficiency and results.\n7. Standardize results and implement them in all relevant areas as a guideline.\n\nTechniques: 1. Brainstorming. 2. Cause and effect. 3. Check sheets. 4. Pareto analysis. 5. Process flow chart.","terms":[["Problem","الفرق بين ما هو قائم وما يجب أن يكون.","The difference between what is and what should be."],["Programmed Decision","قرار متكرر يُعالج بأسلوب روتيني لمشكلة جيدة التحديد.","A repetitive decision handled by a routine approach."],["Non-Programmed Decision","قرار فريد يحتاج حلًا مفصّلًا لمشكلة سيئة التحديد.","A unique decision requiring a custom-made solution."],["Crisis","حدث غير متوقع شديد التعطيل يتطلب إجراءً فوريًا.","An unexpected, highly disruptive event requiring immediate action."],["Root Cause","السبب الكامن وراء وجود المشكلة.","The underlying reason why the problem exists."]],"cover":"SOLVE WITH CLARITY","questions":[{"ar":"ما تعريف المشكلة (Problem) في الكتاب؟","en":"How does the book define a problem?","optionsAr":["الفرق بين ما هو قائم وما يجب أن يكون","خطة طويلة الأجل","قرار روتيني متكرر","هدف عام للمنظمة"],"optionsEn":["The difference between what is and what should be","A long-term plan","A repeated routine decision","A general organizational goal"],"correct":0,"whyAr":"المشكلة هي الفرق بين الوضع القائم وما يمكن أو يجب أن يكون.","whyEn":"A problem is the difference between what is and what might or should be."},{"ar":"أي مشكلة تحتاج إلى قرار مبرمج (Programmed Decision)؟","en":"Which problem needs a programmed decision?","optionsAr":["مشكلة جديدة ومعلوماتها غامضة","مشكلة مألوفة وواضحة ومعلوماتها كاملة","تعارض متكرر في توزيع الموارد","مشكلة تتطلب بيانات إضافية قبل تحديد البدائل"],"optionsEn":["A new problem with ambiguous information","A familiar, clear problem with complete information","A recurring conflict in resource allocation","A problem requiring more data before alternatives can be defined"],"correct":1,"whyAr":"المشكلات جيدة التحديد تحتاج قرارًا مبرمجًا متكررًا يُعالج بأسلوب روتيني.","whyEn":"Well-structured problems need a repetitive programmed decision handled by a routine approach."},{"ar":"المشكلة الجديدة أو غير المعتادة ومعلوماتها ناقصة تُسمى…","en":"A new or unusual problem with incomplete information is called…","optionsAr":["مشكلة جيدة التحديد","مشكلة طارئة فقط","مشكلة سيئة التحديد (Poorly Structured)","مشكلة روتينية"],"optionsEn":["A well-structured problem","Only a crisis problem","A poorly structured problem","A routine problem"],"correct":2,"whyAr":"المشكلات سيئة التحديد جديدة أو غير معتادة ومعلوماتها غامضة أو ناقصة.","whyEn":"Poorly structured problems are new or unusual, with ambiguous or incomplete information."},{"ar":"القرار غير المبرمج (Non-Programmed Decision) هو…","en":"A non-programmed decision is…","optionsAr":["قرار متكرر بأسلوب روتيني","قرار يعتمد على إجراء روتيني معتمد","قرار يُتخذ دون مقارنة البدائل المتاحة","قرار فريد يتطلب حلًا مفصّلًا خصيصًا"],"optionsEn":["A repetitive routine decision","A decision based on an established routine procedure","A decision made without comparing available alternatives","A unique decision requiring a custom-made solution"],"correct":3,"whyAr":"القرار غير المبرمج فريد ويحتاج حلًا مفصّلًا حسب الموقف.","whyEn":"A non-programmed decision is unique and requires a custom-made solution."},{"ar":"أي مثال يُعد مشكلة طارئة (Crisis Problem)؟","en":"Which is an example of a crisis problem?","optionsAr":["كارثة طبيعية أو حادث كبير أو خسارة مالية مفاجئة","تأخر متكرر في تسليم التقارير اليومية","تعديل روتيني لتوزيع المهام في الوردية","نقص متكرر في مستلزمات الوحدة"],"optionsEn":["A natural disaster, major accident, or sudden financial loss","Repeated delays in submitting daily reports","A routine adjustment to shift task assignments","Recurring shortages of unit supplies"],"correct":0,"whyAr":"الأزمات أحداث غير متوقعة شديدة التعطيل تتطلب إجراءً فوريًا.","whyEn":"Crises are unexpected, highly disruptive events requiring immediate action."},{"ar":"ماذا تتضمن إدارة الأزمات الفعّالة؟","en":"What does effective crisis management involve?","optionsAr":["تأجيل القرار حتى اكتمال المعلومات","قرارًا سريعًا وتواصلًا وتوزيعًا للموارد","تأجيل توزيع الأدوار حتى تتضح جميع تفاصيل الأزمة","انتظار الخطة السنوية"],"optionsEn":["Delaying the decision until information is complete","Quick decision-making, communication, and resource allocation","Ignoring the staff","Waiting for the annual plan"],"correct":1,"whyAr":"الكتاب يذكر القرار السريع والتواصل وتوزيع الموارد.","whyEn":"The book lists quick decision-making, communication, and resource allocation."},{"ar":"تطبيق حل بعد آخر حتى تُحل المشكلة أو تتحسن هو…","en":"Applying one solution after another until the problem is solved or improves is…","optionsAr":["التجريب العلمي","التجربة والخطأ (Trial and Error)","الحل المبتكر","تحليل باريتو"],"optionsEn":["Scientific experimentation","Trial and error","Novel solution","Pareto analysis"],"correct":1,"whyAr":"هذا هو أسلوب التجربة والخطأ.","whyEn":"This describes the trial-and-error method."},{"ar":"دراسة عناصر مختارة من الموقف تحت ظروف مضبوطة بإحكام تُسمى…","en":"Studying selected elements of a situation under highly controlled conditions is…","optionsAr":["التجربة والخطأ","جمع البيانات وتحليل الأسباب","التجريب العلمي (Scientific Experimentation)","الحل المبتكر"],"optionsEn":["Trial and error","Collecting data and analyzing causes","Scientific experimentation","Novel solution"],"correct":2,"whyAr":"التجريب العلمي يدرس عناصر مختارة تحت ظروف مضبوطة.","whyEn":"Scientific experimentation studies selected elements under controlled conditions."},{"ar":"في الحل المبتكر (Novel Solution) يبتكر المدير حلولًا…","en":"In a novel solution the manager invents solutions…","optionsAr":["لها نموذج مسجل سابقًا","مأخوذة من السياسات الجاهزة","ليس لها نموذج سابق مسجل في الذاكرة","تعتمد على التجربة والخطأ فقط"],"optionsEn":["That have a recorded prototype","Taken from ready policies","With no previous recorded prototype in memory","Based on trial and error only"],"correct":2,"whyAr":"الحل المبتكر هو حل ليس له نموذج سابق مسجل.","whyEn":"A novel solution has no prototype previous recorded memory."},{"ar":"ما الخطوة الأولى في عملية حل المشكلات؟","en":"What is the first step in the problem-solving process?","optionsAr":["تنفيذ خطة العمل","قياس الفعالية","توحيد النتائج","تحديد المشكلة والهدف (Define Problem & Objective)"],"optionsEn":["Implement the action plan","Measure effectiveness","Standardize results","Define the problem and objective"],"correct":3,"whyAr":"تبدأ العملية بفهم واضح للمشكلة وتحديدها بدقة بجمع بيانات صحيحة.","whyEn":"The process starts with a clear, precise definition of the problem using accurate data."},{"ar":"الخطوة التي تبحث في الأسباب الكامنة وراء وجود المشكلة هي…","en":"The step that investigates the underlying reasons why the problem exists is…","optionsAr":["تحديد الأسباب الرئيسية والجذرية (Root Causes)","تنفيذ الخطة","توحيد النتائج","تحديد الهدف"],"optionsEn":["Identify major and root causes","Implement the plan","Standardize results","Define the objective"],"correct":0,"whyAr":"الخطوة الثالثة تبحث في الأسباب الجذرية للمشكلة.","whyEn":"Step 3 investigates the root causes of the problem."},{"ar":"ماذا تتضمن خطوة تطوير الحلول والاتفاق على خطة العمل؟","en":"What does developing solutions and agreeing on an action plan include?","optionsAr":["تعميم النتائج على كل الأقسام","تحديد كيفية قياس نتائج الحل","تحديد الأسباب المحتملة فقط","اختيار أول بديل قبل مقارنة التكلفة والموارد المطلوبة"],"optionsEn":["Spreading results to all departments","Determining how the solution will be measured","Only listing likely causes","Ignoring solution alternatives"],"correct":1,"whyAr":"الخطة المطورة يجب أن تحدد كيف سيُقاس الحل ومتابعة تنفيذها.","whyEn":"The plan should determine how the solution will be measured and monitored."},{"ar":"مدير تمريض نفّذ الحل المختار. ما الذي يحتاجه القائد في هذه الخطوة؟","en":"A nurse manager is implementing the chosen solution. What should the leader do?","optionsAr":["العمل منفردًا دون إبلاغ أحد","تأجيل التنفيذ للعام القادم","التنسيق والتواصل الجيد مع كل المعنيين لكسب التزامهم","حذف خطوة القياس"],"optionsEn":["Work alone without telling anyone","Postpone implementation until next year","Coordinate and communicate well with everyone involved to gain commitment","Remove the measurement step"],"correct":2,"whyAr":"عند التنفيذ ينسّق القائد الأنشطة ويتواصل مع الجميع لكسب التزامهم.","whyEn":"During implementation the leader coordinates activities and communicates to gain commitment."},{"ar":"ما الخطوة الأخيرة في عملية حل المشكلات؟","en":"What is the last step in the problem-solving process?","optionsAr":["توحيد النتائج وتطبيقها في كل المجالات المعنية (Standardize Results)","اختيار الحل الأنسب وتنفيذه","متابعة النتائج بعد تطبيق الحل","جمع البيانات وتحليل الأسباب"],"optionsEn":["Standardize results and implement in all relevant areas","Selecting and implementing the most appropriate solution","Monitoring results after implementing the solution","Collecting data and analyzing causes"],"correct":0,"whyAr":"النتائج تُوحَّد وتُعمَّم على كل الأقسام كدليل إرشادي.","whyEn":"Results are standardized and communicated to all departments as a guideline."},{"ar":"أي مما يلي ليس من أساليب حل المشكلات المذكورة في الكتاب؟","en":"Which is NOT a problem-solving technique listed in the book?","optionsAr":["العصف الذهني (Brainstorming)","تحليل باريتو (Pareto Analysis)","أوراق الفحص (Check Sheets)","تحليل SWOT"],"optionsEn":["Brainstorming","Pareto analysis","Check sheets","SWOT analysis"],"correct":3,"whyAr":"الأساليب المذكورة: العصف الذهني، السبب والنتيجة، أوراق الفحص، تحليل باريتو، مخطط تدفق العملية.","whyEn":"Listed: brainstorming, cause and effect, check sheets, Pareto analysis, and process flow chart."}]},{"id":4,"ar":"صنع القرار","en":"Decision Making","pages":"47–55","summaryAr":"تعريف القرار، وخطواته الثماني، والعوامل المؤثرة فيه، وأنماط صنع القرار الأربعة.","summaryEn":"What a decision is, its eight steps, the factors that influence it, and the four decision-making styles.","textAr":"صنع القرار (Decision Making) في التمريض عملية معقدة تشمل الحصول على بيانات ذاتية وموضوعية عن موقف المريض وتقييمها لتنفيذ إجراءات تحقق نتيجة مرغوبة. وتعتمد على معرفة الممرض وخبرته وقدرته على التعامل مع المواقف سريعة التغير.\n\nالقرار (Decision): اختيار من بديلين أو أكثر. المشكلة (Problem): فرق بين الوضع القائم والمرغوب. عملية صنع القرار (Decision Making Process): ثماني خطوات تشمل تحديد المشكلة واختيار البديل وتقييم فعالية القرار. وصنع القرار جزء من حل المشكلات، وهو الفعل العقلي الحاسم.\n\nالغرض من صنع القرار: تحديد مسار العمل (Course of Action). يتخذ الممرضون قرارات شخصية وسريرية وتنظيمية، في ظروف اليقين وعدم اليقين والمخاطرة. والوعي بمكونات القرار وعمليته واستراتيجياته يزيد فعالية القيادة والإدارة في التمريض.\n\nخطوات عملية صنع القرار الثماني:\n1. تحديد المشكلة (Identifying a problem).\n2. تحديد معايير القرار (Identifying decision criteria).\n3. إعطاء أوزان للمعايير (Allocating weights to the criteria).\n4. تطوير البدائل (Developing alternatives).\n5. تحليل البدائل (Analyzing alternatives).\n6. اختيار بديل (Selecting an alternative).\n7. تنفيذ البديل (Implementing alternative).\n8. تقييم فعالية القرار (Evaluating decision effectiveness).\n\nالعوامل المؤثرة في صنع القرار: يتأثر إدراك المشكلة بعوامل خارجية وداخلية. الخارجية: الظروف البيئية والوقت. الداخلية: الحالة الجسدية والانفعالية لمتخذ القرار، وخصائصه الشخصية، وخلفيته الثقافية والاجتماعية والفلسفية، وخبراته السابقة، واهتماماته ومعرفته واتجاهاته. كما أن عوامل الشخصية مثل تقدير الذات والثقة بالنفس تؤثر في الاستعداد للمخاطرة.\n\nأنماط صنع القرار (Decision Making Styles):\n- النمط التوجيهي (Directive): لا يتحمل الغموض، عقلاني وكفء ومنطقي، سريع القرار ويركز على المدى القصير، بمعلومات وبدائل قليلة.\n- النمط التحليلي (Analytical): تحمّله للغموض أكبر، يريد معلومات أكثر وبدائل أكثر، حذر ويتكيف مع المواقف الفريدة.\n- النمط المفاهيمي (Conceptual): نظرته واسعة، ينظر إلى بدائل كثيرة، يركز على المدى الطويل ويجيد الحلول الإبداعية.\n- النمط السلوكي (Behavioral): يعمل جيدًا مع الآخرين، يهتم بإنجاز المرؤوسين وينفتح على اقتراحاتهم، يستخدم الاجتماعات ويتجنب الصراع، ويهمه قبول الآخرين له.","textEn":"Decision making in nursing is a complex process: obtaining subjective and objective data about a patient situation and evaluating it to implement actions that achieve a desired outcome. It depends on the nurse's knowledge, experience, and ability to cope with rapidly changing situations.\n\nA decision is a choice from two or more alternatives. A problem is a discrepancy between an existing and a desired state. The decision making process is a set of eight steps, including identifying a problem, selecting an alternative, and evaluating the decision's effectiveness. Decision making is one subset of problem solving and is the critical mental action taken.\n\nThe purpose of decision making is to identify a course of action. Nurses make personal, clinical, and organizational decisions under conditions of certainty, uncertainty, and risk. Awareness of the components, process, and strategies of decision making contributes to effective nursing leadership and management.\n\nThe eight steps:\n1. Identifying a problem.\n2. Identifying decision criteria.\n3. Allocating weights to the criteria.\n4. Developing alternatives.\n5. Analyzing alternatives.\n6. Selecting an alternative.\n7. Implementing the alternative.\n8. Evaluating decision effectiveness.\n\nFactors affecting decision making: perception of the problem is influenced by external and internal factors. External: environmental conditions and time. Internal: the decision maker's physical and emotional state, personal characteristics, cultural, social, and philosophical background, past experiences, interests, knowledge, and attitudes. Personality factors such as self-esteem and self-confidence affect willingness to take risks.\n\nDecision making styles:\n- Directive: no tolerance for ambiguity; rational, efficient, and logical; decides fast with a short-run focus, using minimal information and few alternatives.\n- Analytical: greater tolerance for ambiguity; wants more information and considers more alternatives; careful and adaptable to unique situations.\n- Conceptual: broad outlook; looks at many alternatives; long-run focus; good at creative solutions.\n- Behavioral: works well with others; concerned about subordinates' achievement and receptive to suggestions; uses meetings and avoids conflict; acceptance by others matters.","terms":[["Decision","اختيار من بديلين أو أكثر.","A choice from two or more alternatives."],["Decision Making Process","ثماني خطوات من تحديد المشكلة إلى تقييم فعالية القرار.","Eight steps from identifying the problem to evaluating effectiveness."],["Directive Style","سريع، منطقي، لا يتحمل الغموض، ويركز على المدى القصير.","Fast and logical, low tolerance for ambiguity, short-run focus."],["Analytical Style","يريد معلومات وبدائل أكثر ويتحمل الغموض أكثر.","Wants more information and alternatives; more tolerance for ambiguity."],["Conceptual Style","نظرة واسعة وحلول إبداعية على المدى الطويل.","Broad outlook, creative solutions, long-run focus."],["Behavioral Style","يعمل مع الآخرين ويتجنب الصراع ويهمه القبول.","Works with others, avoids conflict, values acceptance."]],"cover":"DECIDE WITH CONFIDENCE","questions":[{"ar":"ما القرار (Decision) حسب الكتاب؟","en":"What is a decision according to the book?","optionsAr":["خطة طويلة الأجل","هدف عام للمنظمة","اختيار من بديلين أو أكثر","سياسة مكتوبة"],"optionsEn":["A long-term plan","A general organizational goal","A choice from two or more alternatives","A written policy"],"correct":2,"whyAr":"القرار هو اختيار من بين بديلين أو أكثر.","whyEn":"A decision is a choice from two or more alternatives."},{"ar":"ما علاقة صنع القرار بحل المشكلات؟","en":"How is decision making related to problem solving?","optionsAr":["جزء من حل المشكلات","بديل عنه تمامًا","حل المشكلة بعد تنفيذ القرار دون تحليل أسبابه","خطوة تأتي قبل تحديد المشكلة دائمًا"],"optionsEn":["It is one subset of problem solving","A complete replacement for it","They are unrelated","Always a step before identifying the problem"],"correct":0,"whyAr":"الكتاب يصف صنع القرار بأنه مكوّن حيوي وجزء من حل المشكلات.","whyEn":"The book describes decision making as a vital component and one subset of problem solving."},{"ar":"كم خطوة في عملية صنع القرار (Decision Making Process)؟","en":"How many steps are in the decision making process?","optionsAr":["ست خطوات","ثماني خطوات","سبع خطوات","خمس خطوات"],"optionsEn":["Six steps","Eight steps","Seven steps","Five steps"],"correct":1,"whyAr":"العملية ثماني خطوات تبدأ بتحديد المشكلة وتنتهي بتقييم فعالية القرار.","whyEn":"It has eight steps, from identifying the problem to evaluating the decision's effectiveness."},{"ar":"ما الخطوة الأولى في عملية صنع القرار؟","en":"What is Step 1 of the decision making process?","optionsAr":["تحليل البدائل","اختيار بديل","تنفيذ البديل","تحديد المشكلة (Identifying a problem)"],"optionsEn":["Analyzing alternatives","Selecting an alternative","Implementing the alternative","Identifying a problem"],"correct":3,"whyAr":"الخطوة الأولى هي تحديد المشكلة.","whyEn":"Step 1 is identifying a problem."},{"ar":"ما الخطوة الثانية؟","en":"What is Step 2?","optionsAr":["تحديد معايير القرار (Identifying decision criteria)","تطوير البدائل","تقييم فعالية القرار","اختيار بديل"],"optionsEn":["Identifying decision criteria","Developing alternatives","Evaluating decision effectiveness","Selecting an alternative"],"correct":0,"whyAr":"الخطوة الثانية هي تحديد معايير القرار.","whyEn":"Step 2 is identifying decision criteria."},{"ar":"ماذا يحدث في الخطوة الثالثة؟","en":"What happens in Step 3?","optionsAr":["تنفيذ البديل","تحليل البدائل","إعطاء أوزان للمعايير (Allocating weights to the criteria)","اختيار البديل"],"optionsEn":["Implementing the alternative","Analyzing alternatives","Allocating weights to the criteria","Selecting the alternative"],"correct":2,"whyAr":"الخطوة الثالثة هي إعطاء أوزان للمعايير.","whyEn":"Step 3 is allocating weights to the criteria."},{"ar":"أي خطوة تأتي مباشرة بعد تطوير البدائل (Step 4)؟","en":"Which step comes right after developing alternatives (Step 4)?","optionsAr":["اختيار بديل","تحليل البدائل (Analyzing alternatives)","تنفيذ البديل","متابعة النتائج بعد تطبيق الحل"],"optionsEn":["Selecting an alternative","Analyzing alternatives","Implementing the alternative","Monitoring results after implementing the solution"],"correct":1,"whyAr":"الخطوة الخامسة هي تحليل البدائل، ثم اختيار بديل في الخطوة السادسة.","whyEn":"Step 5 is analyzing alternatives, then selecting one in Step 6."},{"ar":"ما الخطوة الأخيرة في العملية؟","en":"What is the last step in the process?","optionsAr":["تنفيذ البديل","اختيار بديل","تحديد المعايير","تقييم فعالية القرار (Evaluating decision effectiveness)"],"optionsEn":["Implementing the alternative","Selecting an alternative","Identifying criteria","Evaluating decision effectiveness"],"correct":3,"whyAr":"الخطوة الثامنة هي تقييم فعالية القرار.","whyEn":"Step 8 is evaluating decision effectiveness."},{"ar":"ما الغرض من صنع القرار؟","en":"What is the purpose of decision making?","optionsAr":["تحديد مسار العمل (Course of action)","زيادة عدد الاجتماعات","تجنب المسؤولية","كتابة السياسات فقط"],"optionsEn":["To identify a course of action","To increase meetings","To avoid responsibility","Only to write policies"],"correct":0,"whyAr":"الغرض هو تحديد مسار العمل.","whyEn":"The purpose is to identify a course of action."},{"ar":"تحت أي ظروف يتخذ الممرضون قراراتهم؟","en":"Under which conditions do nurses make decisions?","optionsAr":["اليقين فقط","المخاطرة فقط","اليقين وعدم اليقين والمخاطرة","عدم اليقين فقط"],"optionsEn":["Certainty only","Risk only","Certainty, uncertainty, and risk","Uncertainty only"],"correct":2,"whyAr":"يتخذ الممرضون قرارات شخصية وسريرية وتنظيمية في ظروف اليقين وعدم اليقين والمخاطرة.","whyEn":"Nurses decide in personal, clinical, and organizational situations under certainty, uncertainty, and risk."},{"ar":"أي مما يلي عامل خارجي يؤثر في صنع القرار؟","en":"Which is an external factor affecting decision making?","optionsAr":["الخبرات السابقة","الظروف البيئية والوقت","الحالة الانفعالية","الثقة بالنفس"],"optionsEn":["Past experiences","Environmental conditions and time","Emotional state","Self-confidence"],"correct":1,"whyAr":"العوامل الخارجية تشمل الظروف البيئية والوقت.","whyEn":"External factors include environmental conditions and time."},{"ar":"أي مما يلي عامل داخلي؟","en":"Which is an internal factor?","optionsAr":["الوقت المتاح","الظروف البيئية","الرقابة الحكومية","الحالة الجسدية والانفعالية لمتخذ القرار"],"optionsEn":["Available time","Environmental conditions","Government control","The decision maker's physical and emotional state"],"correct":3,"whyAr":"العوامل الداخلية تشمل الحالة الجسدية والانفعالية والخبرات والمعرفة والاتجاهات.","whyEn":"Internal factors include physical and emotional state, experience, knowledge, and attitudes."},{"ar":"أي نمط قرار لا يتحمل الغموض ويتخذ قرارات سريعة بمعلومات وبدائل قليلة؟","en":"Which style has no tolerance for ambiguity and decides fast with few alternatives?","optionsAr":["النمط التوجيهي (Directive)","النمط التحليلي (Analytical)","النمط المفاهيمي (Conceptual)","النمط السلوكي (Behavioral)"],"optionsEn":["Directive style","Analytical style","Conceptual style","Behavioral style"],"correct":0,"whyAr":"النمط التوجيهي كفء ومنطقي وسريع ويركز على المدى القصير.","whyEn":"The directive style is efficient, logical, fast, and short-run focused."},{"ar":"أي نمط ينظر إلى بدائل كثيرة ويركز على المدى الطويل ويجيد الحلول المبتكرة؟","en":"Which style looks at many alternatives, focuses on the long run, and finds creative solutions?","optionsAr":["التوجيهي","المفاهيمي (Conceptual)","السلوكي","التحليلي"],"optionsEn":["Directive","Conceptual","Behavioral","Analytical"],"correct":1,"whyAr":"النمط المفاهيمي واسع النظرة ويركز على المدى الطويل.","whyEn":"The conceptual style is broad in outlook, long-run focused, and creative."},{"ar":"مديرة تمريض تستخدم الاجتماعات للتواصل وتتجنب الصراع وتهتم بقبول الآخرين لها. أي نمط تمثّل؟","en":"A nurse manager uses meetings to communicate, avoids conflict, and values acceptance by others. Which style is this?","optionsAr":["التوجيهي","التحليلي","المفاهيمي","السلوكي (Behavioral)"],"optionsEn":["Directive","Analytical","Conceptual","Behavioral"],"correct":3,"whyAr":"النمط السلوكي يعمل جيدًا مع الآخرين ويتقبل الاقتراحات ويتجنب الصراع.","whyEn":"The behavioral style works well with others, welcomes suggestions, and avoids conflict."}]},{"id":5,"ar":"التنظيم","en":"Organizing","pages":"56–77","summaryAr":"يتناول هذا الفصل عملية التنظيم كأحد الوظائف الإدارية الرئيسية، والتي تشمل التقسيم المنهجي للأنشطة، وتحديد الوحدات الإدارية، وتفويض السلطة، وتوزيع المسؤوليات لتمكين العاملين من العمل بفعالية لتحقيق أهداف المؤسسة.","summaryEn":"This chapter covers organizing as a core management function, which involves the systematic arrangement of activities, establishing administrative units, delegating authority, and distributing responsibilities to enable personnel to work effectively toward organizational goals.","textAr":"يؤدي التخطيط إلى تحديد مجموعة متنوعة من الأنشطة التي يجب إنجازها، ومن الضروري تنظيم هذه الأنشطة لضمان إدارتها بفاعلية، حيث يعني التنظيم (Organizing) بمعناه العام الترتيب المنهجي للأنشطة ويتم بواسطة كل فرد، بينما يتعلق كمفهوم إداري بتقسيم الأنشطة وتجميحها، وتصبح عملية التنظيم ضرورية عندما يعمل شخصان أو أكثر معاً لتحقيق أهداف مشتركة.\n\nتعرف عملية التنظيم (Organizing process) بأنها العملية التي تتضمن تحديد وتجميع الأنشطة المراد أداؤها، وتحديد وتفويض السلطة، وتحمل المسؤولية، وإنشاء العلاقات لتمكين الأفراد من العمل معاً بفاعلية لتحقيق الأهداف، بينما تشمل أهمية التنظيم التركيز على الأهداف وتسهيل تحقيقها، وترتيب الوظائف ضمن التسلسل الهرمي، وتحديد المسؤوليات وخطوط السلطة بوضوح لجميع المستويات، وخلق علاقات تقلل من الاحتكاك، فضلاً عن مواجهة التحديات في الرعاية الصحية مثل نقص الموظفين وصراع الأدوار.\n\nتتكون عملية التنظيم من خطوات أساسية تبدأ بتحديد الأنشطة المراد أداؤها لتحقيق أهداف المنظمة، ثم تحديد الوظائف الرئيسية التي تتعلق بها هذه الأنشطة، تليها تجميع وتقسيم الأنشطة داخل كل وظيفة على أساس التشابه أو الترافق، وأخيراً إنشاء العلاقات بين الأفراد والمجموعات.\n\nتتضمن مبادئ التنظيم عدة عناصر رئيسية منها سلسلة القيادة (Chain of command) وهي المسار الرسمي للاتصال والسلطة، ووحدة القيادة (Unity of command) وتعني أن كل شخص لديه رئيس واحد فقط مسؤول أمامه، ونطاق الإشراف أو التحكم (Span of control) الذي يتعامل مع نطاق الإشراف وعدد مرؤوسين يمكن الإشراف عليهم بكفاءة من قبل مشرف واحد، وتتخذ أبعاد نطاق الإشراف شكلين هما النطاق الضيق (Narrow span of control) أو النطاق الواسع (Wide span of control).\n\nتعتبر تفويض السلطة (Delegation of authority) إحدى ركائز التنظيم، وتعرف بأنها عملية إسناد العمل من مستوى تنظيمى أعلى إلى مستوى أقل أو من الرئيس إلى المرؤوس وإعطائه السلطة لإنجازها، وتمر عملية التفويض بخطوات تشمل تخصيص الواجبات، وتفويض السلطة، وإسناد المسؤولية، وخلق المساءلة حيث يجب أن يُحاسب المرؤوسون على أداء واجباتهم بشكل صحيح.\n\nتتضمن أنواع السلطة داخل المنظمات السلطة المطلقة (Ultimate authority) التي تتعامل مع المصدر الأصلي للحق في اتخاذ الإجراءات مثل وزارة الصحة، والسلطة القانونية (Legal authority) التي تعني أن الفرد مخول قانوناً بحكم منصبه، والسلطة الفنية (Technical authority) التي تشير إلى الشخص الخبير المعترف به في مجال معين، والسلطة التشغيلية (Operational authority) الممنوحة من خلال تفويض السلطة.\n\nتشير المسؤولية (Responsibility) إلى الالتزام المرتبط بقبول التكليف ولا يمكن تفويضها بل قد تستمر أو تنتهي بإنجاز إجراء واحد، بينما تشير المساءلة (Accountability) في بيئة العمل إلى التزام الشخص بمهامه والاعتراف بدوره المحدد، وتعني في الإدارة امتلاك التزامات تجاه الآخرين في المنظمة لإتمام دور المدير، حيث يتحتم على المرؤوسين أن يكونوا مسؤولين ومحاسبين عن أداء واجباتهم وتتحرك المساءلة في اتجاه صاعد.\n\nيُعرّف التقسيم الإداري أو الأقسام (Departmentation) بأنه عملية تجميع الأنشطة في وحدات إدارية، وتتعدد أنواعه لتشمل التقسيم حسب الخدمات (Departmentation by services) كالوحدات الطبية والجراحية وأقسام الأطفال، والتقسيم حسب الوقت (Departmentation by time) لتغطية 24 ساعة طوال أيام الأسبوع، والتقسيم حسب درجة حدة المرض (Departmentation by degree of acuteness of illness) مثل وحدات الرعاية المركزة والمتوسطة، والتقسيم حسب الوظيفة (Departmentation by function) مثل المغسلة والصيدلية والخدمات الغذائية، والتقسيم حسب الموقع (Departmentation by location)، والتقسيم حسب المريض (Departmentation by patient).\n\nيؤكد مبدأ التخصص (Specialization) على أن الشخص يجب أن يؤدي وظيفة رئيسية واحدة، مما يؤدي إلى تقسيم العمل والتمييز بين أنواع الواجبات والمهام داخل المنظمة لضمان تحقيق أعلى كفاءة وأداء متميز.","textEn":"Planning results in deciding a variety of activities to be done, and organizing these activities is essential if they are to be administered effectively, where organizing in a general sense means systematic arrangement of activities done by each individual, while as a management process it relates to sub-dividing and grouping activities, becoming necessary when two or more persons work together to achieve common objectives.\n\nThe organizing process refers to identifying and grouping of activities to be performed, defining and delegating authority, casting responsibility and establishing relationships to enable people to work together effectively in accomplishing objectives, while the importance of organizing includes focusing on objectives, arranging positions within the hierarchy, clearly defining responsibilities and lines of authority, creating relationships to minimize friction, and handling healthcare challenges such as staff shortages and role conflict.\n\nThe process of organizing consists of steps starting with determining the activities to be performed to achieve objectives, identifying major functions, grouping and sub-dividing activities on the basis of similarity, and establishing relationships among individuals and groups.\n\nPrinciples of organizing include the chain of command as the formal path of communication and authority, unity of command meaning one person has one boss to whom they are responsible, and span of control dealing with the scope of supervision and the number of subordinates supervised by one person, implemented through either a narrow span of control or a wide span of control.\n\nDelegation of authority is crucial for work accomplishment, defined as assigning work from a top organizational level to a lower one or from superior to subordinate and giving them authority, passing through steps of allocating duties, delegating authority, assigning responsibility, and creating accountability where subordinates must be held answerable for carrying out duties properly.\n\nTypes of authority inside organizations include ultimate authority dealing with the original source of rights like the ministry of health, legal authority meaning an individual is legally permitted by virtue of position, technical authority referring to a recognized expert, and operational authority giving someone permission through delegation.\n\nResponsibility refers to the obligation involved when accepting an assignment which cannot be delegated, whereas accountability refers to a person's commitment to tasks and having obligations to others moving in an upward direction where subordinates must be held answerable.\n\nDepartmentation is the process of grouping activities into administrative units, implemented through types such as departmentation by services like medical and surgical units, departmentation by time for 24/7 coverage, departmentation by degree of acuteness of illness like ICU, departmentation by function like pharmacy and dietary, departmentation by location, and departmentation by patient.\n\nThe principle of specialization states that a person should perform a single leading function, leading to a division of labor and differentiation among kinds of duties to ensure organizational efficiency.","terms":[["Organizing","عملية تحديد الأنشطة الواجب أداؤها، وترتيبها في وحدات إدارية، وتخصيص السلطات والمسؤوليات للأفراد العاملين.","The process of determining the activities to be performed, arranging these activities to administrative units, as well as assigning managerial authority and responsibilities to people employed in the organization."],["Chain of command","المسار الرسمي للاتصال والسلطة داخل المؤسسة.","The formal path of communication and authority."],["Unity of command","مبدأ يعني أن لكل موظف رئيساً مباشراً واحداً مسؤولاً أمامه فقط (شخص واحد/مدير واحد).","One person/one boss, each person has one manager to whom they are responsible."],["Span of control","عدد المرؤوسين الذين يمكن الإشراف عليهم بفاعلية وكفاءة من قبل مشرف واحد.","The number of subordinates that can be adequately supervised by one supervisor."],["Delegation of authority","عملية إسناد المهام والأعمال من مستوى إداري أعلى إلى مستوى أقل أو من الرئيس إلى المرؤوس مع منحه السلطة اللازمة للإنجاز.","The process of assigning work from a top organizational level to a lower one or from superior to subordinate and giving that person the authority to accomplish them."],["Departmentation","عملية تجميع الأنشطة وتصنيفها في وحدات إدارية داخل الهيكل التنظيمي.","It is the process of grouping activities into administrative units."],["Specialization","مبدأ ينص على أن الفرد يجب أن يؤدي وظيفة رئيسية واحدة، مما يؤدي إلى تقسيم العمل وتمايز الواجبات.","The principle that a person should perform a single leading function, resulting in division of labor."]],"questions":[{"ar":"أي مما يلي يُعد المعنى الإداري لعملية التنظيم في المنظمات الصحية؟","en":"Which of the following represents the managerial meaning of organizing in healthcare organizations?","whyAr":"وفقاً للكتاب، فإن التنظيم كعملية إدارية يتعرض لتقسيم وتجميع الأنشطة وإنشاء العلاقات لتمكين الأفراد من العمل معاً بفاعلية.","whyEn":"According to the book, organizing as a management process relates to sub-dividing and grouping activities and establishing relationships to enable people to work together effectively.","optionsAr":["تقسيم وتجميع الأنشطة وإنشاء العلاقات لتنسيق جهود الأفراد.","التنبؤ بالأحداث المستقبلية ووضع الخطط الاستراتيجية.","تقييم أداء العاملين وصرف الحوافز المالية.","مراقبة الأداء الفعلي ومقارنته بالمعايير الموضوعة."],"optionsEn":["Sub-dividing and grouping activities and establishing relationships to coordinate individual efforts.","Forecasting future events and formulating strategic plans.","Evaluating employee performance and distributing financial incentives.","Monitoring actual performance and comparing it with established standards."],"correct":0},{"ar":"ما هو المبدأ التنظيمي الذي ينص على أن كل موظف يجب أن يتلقى أوامر ويكون مسؤولاً أمام رئيس واحد فقط؟","en":"What is the organizational principle stating that each employee should receive orders and be responsible to only one boss?","whyAr":"يعرف مبدأ وحدة القيادة في الكتاب بأنه (شخص واحد/مدير واحد)، حيث يكون لكل شخص رئيس واحد مسؤول أمامه.","whyEn":"Unity of command is defined in the book as one person/one boss, where each person has one manager to whom they are responsible.","optionsAr":["التخصص (Specialization)","وحدة القيادة (Unity of command)","التقسيم الإداري (Departmentation)","نطاق الإشراف (Span of control)"],"optionsEn":["Specialization","Unity of command","Departmentation","Span of control"],"correct":1},{"ar":"أي من الخيارات التالية يمثل ميزة أساسية لنطاق الإشراف الضيق (Narrow span of control)؟","en":"Which of the following represents a key advantage of a narrow span of control?","whyAr":"يوضح الكتاب أن من مزايا نطاق الإشراف الضيق توفير إشراف دقيق ورقابة قريبة وسرعة في الاتصال بين المرؤوسين والرؤساء.","whyEn":"The book indicates that the advantages of a narrow span of control include close supervision, close control, and fast communication.","optionsAr":["انخفاض التكاليف الإدارية بشكل ملحوظ.","إشراف دقيق ورقابة وثيقة على المرؤوسين.","سرعة تفويض المهام وتجنب تداخل الصلاحيات.","وجود عدة مستويات إدارية وقليلة المسافة."],"optionsEn":["Significant reduction in administrative costs.","Close supervision and close control over subordinates.","Rapid task delegation and avoidance of overlapping authorities.","Presence of multiple management levels with short distances."],"correct":1},{"ar":"ما هي الخطوة الأخيرة في عملية تفويض السلطة (Delegation process) المذكورة في الكتاب؟","en":"What is the final step in the delegation process mentioned in the book?","whyAr":"خطوات عملية التفويض هي تخصيص الواجبات، تفويض السلطة، إسناد المسؤولية، وأخيراً خلق المساءلة بحيث يكون المرؤوسون مسؤولين عن أداء واجباتهم.","whyEn":"The steps of the delegation process are allocation of duties, delegation of authority, assignment of responsibility, and creation of accountability.","optionsAr":["تفويض السلطة الفعلية.","خلق المساءلة (Accountability).","تخصيص الواجبات المباشرة.","إسناد المسؤولية للمرؤوس."],"optionsEn":["Delegation of actual authority.","Creation of accountability.","Allocation of direct duties.","Assignment of responsibility to the subordinate."],"correct":1},{"ar":"أي أنواع السلطة التالية ينبع من كون الشخص خبيراً معترفاً به في مجال معين بغض النظر عن منصبه؟","en":"Which type of authority stems from an individual being a recognized expert in a certain field regardless of their position?","whyAr":"تُعرف السلطة الفنية في الكتاب بأنها تشير إلى الشخص الذي يُعد خبيراً معترفاً به في مجال معين ولا بالضرورة أن تكون مستمدة من المنصب.","whyEn":"Technical authority refers in the book to a person who is a recognized expert in some particular field, which does not necessarily mean it is derived from a position.","optionsAr":["السلطة القانونية (Legal authority)","السلطة التشغيلية (Operational authority)","السلطة المطلقة (Ultimate authority)","السلطة الفنية (Technical authority)"],"optionsEn":["Legal authority","Operational authority","Ultimate authority","Technical authority"],"correct":3},{"ar":"ما هو نوع التقسيم الإداري (Departmentation) الذي يُعتمد على تجميع الأنشطة وفقاً لمدى حدة حالة المرض لدى المريض مثل وحدات الرعاية المركزة؟","en":"What type of departmentation is based on grouping activities according to the acuteness of patient illness, such as Intensive Care Units?","whyAr":"ينص الكتاب على أن التقسيم حسب درجة حدة المرض يشتمل على الرعاية التقدمية (PPC) مثل وحدة العناية المركزة والمتوسطة والرعاية الذاتية.","whyEn":"The book states that departmentation by degree of acuteness of illness includes progressive patient care (PPC) such as Intensive Care Units and Intermediate Care Units.","optionsAr":["التقسيم حسب الوقت (Departmentation by time)","التقسيم حسب الخدمات (Departmentation by services)","التقسيم حسب درجة حدة المرض (Departmentation by degree of acuteness)","التقسيم حسب الوظيفة (Departmentation by function)"],"optionsEn":["Departmentation by time","Departmentation by services","Departmentation by degree of acuteness of illness","Departmentation by function"],"correct":2},{"ar":"قامت مديرة التمريض بتكليف إحدى رئيسات الممرضات بمهام الإشراف على جدول مناوبات قسم الجراحة مع إعطائها الصلاحية الكاملة لإنجاز ذلك. ماذا يُسمى هذا الإجراء الإداري؟","en":"The nursing director assigned a head nurse the task of supervising the surgery department's shift schedule while granting her full authority to do so. What is this administrative action called?","whyAr":"هذا يمثل تعريف تفويض السلطة وهو إسناد عمل من مستوى أعلى إلى مستوى أقل أو من الرئيس إلى المرؤوس مع إعطائه السلطة لإنجازه.","whyEn":"This represents the definition of delegation of authority, which is assigning work from a top organizational level to a lower one or superior to subordinate with given authority.","optionsAr":["تفويض السلطة (Delegation of authority)","التخصص الوظيفي (Specialization)","التقسيم الإداري (Departmentation)","وحدة القيادة (Unity of command)"],"optionsEn":["Delegation of authority","Specialization","Departmentation","Unity of command"],"correct":0},{"ar":"أرادت رئيسة تمريض إعادة تنظيم وحدة العناية المركزة لضمان تغطية العمل على مدار 24 ساعة طوال أيام الأسبوع بكفاءة عالية. أي أنواع التقسيم الإداري ينبغي عليها تطبيقه هنا؟","en":"A head nurse wanted to reorganize the ICU to ensure work coverage 24/7 efficiently. Which type of departmentation should she apply here?","whyAr":"التقسيم حسب الوقت في الكتاب مخصص للأنشطة التي تتطلب تغطية أربعة وعشرين ساعة طوال أيام الأسبوع مثل إعدادات الرعاية الحادة.","whyEn":"Departmentation by time in the book is used for activities that need coverage 24 hours a day, seven days a week, such as acute care settings.","optionsAr":["التقسيم حسب العميل (Departmentation by client)","التقسيم حسب الوظيفة (Departmentation by function)","التقسيم حسب الموقع (Departmentation by location)","التقسيم حسب الوقت (Departmentation by time)"],"optionsEn":["Departmentation by client","Departmentation by function","Departmentation by location","Departmentation by time"],"correct":3},{"ar":"ممرضة رئيسية تشرف على عدد كبير جداً من العاملين في وحدة كبيرة مما تسبب في شعورها بعبء العمل وفقدان السيطرة في بعض الأحيان. ما هو المبدأ الإداري المتعلق بهذا الموقف؟","en":"A head nurse supervises a very large number of workers in a large unit, causing her to feel overworked and sometimes lose control. What management principle relates to this situation?","whyAr":"مفهوم نطاق الإشراف يتعامل مع نطاق الإشراف وعدد المرؤوسين الذين يمكن الإشراف عليهم بكفاءة، ونطاق الإشراف الواسع يتضمن الإشراف على عدد كبير من العمال.","whyEn":"The concept of span of control deals with the scope of supervision and the number of subordinates that can be supervised, where a wide span involves supervising a large number of workers.","optionsAr":["التخصص (Specialization)","نطاق الإشراف (Span of control)","سلسلة القيادة (Chain of command)","المساءلة (Accountability)"],"optionsEn":["Specialization","Span of control","Chain of command","Accountability"],"correct":1},{"ar":"عندما يقبل موظف تكليفاً بمهام معينة، فإن الالتزام المترتب على قبول هذا التكليف يُعرف في الكتاب بأنه:","en":"When an employee accepts an assignment of certain tasks, the obligation involved in accepting it is defined in the book as:","whyAr":"ينص الكتاب صراحةً على أن المسؤولية (Responsibility) تشير إلى الالتزام المرتبط عندما يقبل الشخص التكليف.","whyEn":"The book explicitly states that responsibility refers to the obligation involved when one accepts an assignment.","optionsAr":["السلطة (Authority)","المسؤولية (Responsibility)","التخصص (Specialization)","المساءلة (Accountability)"],"optionsEn":["Authority","Responsibility","Specialization","Accountability"],"correct":1},{"ar":"أي من الخيارات التالية يُعتبر من التحديات الشائعة التي تواجه عملية التنظيم في إعدادات الرعاية الصحية؟","en":"Which of the following is considered a common challenge faced in organizing healthcare settings?","whyAr":"يذكر الكتاب ضمن التحديات في تنظيم إعدادات الرعاية الصحية كل من نقص الموظفين، صراع أو غموض الأدوار، مقاومة التغيير، وتعقيد التكنولوجيا.","whyEn":"The book lists challenges in organizing healthcare settings as staff shortages, role conflict or ambiguity, resistance to change, and technological complexity.","optionsAr":["استقرار اللوائح وعدم تغيرها.","غياب الهيكل التنظيمي تماماً.","صراع أو غموض الأدوار (Role conflict or ambiguity).","وفرة الممرضات المفرطة."],"optionsEn":["Stability of regulations without changes.","Complete absence of organizational structure.","Role conflict or ambiguity.","Excessive nurse abundance."],"correct":2},{"ar":"لماذا يُعتبر مبدأ 'المسؤولية لا يمكن تفويضها' قاعدة أساسية في عملية تفويض السلطة؟","en":"Why is the principle that 'responsibility cannot be delegated' considered fundamental in delegation?","whyAr":"يشير الكتاب إلى أن المسؤولية لا يمكن تفويضها (Responsibility cannot be delegated)، بينما يتم تفويض السلطة وإسناد المهام مع بقاء الالتزام الأساسي للمدير.","whyEn":"The book indicates that responsibility cannot be delegated, meaning the ultimate obligation remains with the delegator while authority is transferred.","optionsAr":["لأن التفويض ينقل بعض الصلاحيات ولا يلغي المساءلة النهائية للمدير.","لأن التفويض يقتصر على المهام التي لا تحتاج إلى إشراف.","لأن المدير يظل مسؤولاً نهائياً عن إنجاز المهمة حتى لو قام بتفويض شخص آخر بأدائها.","لأن المدير يظل مسؤولًا عن متابعة تنفيذ المهمة وفق المعايير."],"optionsEn":["Because delegation transfers some authority but does not remove the manager’s ultimate accountability.","Because delegation is limited to tasks that do not require supervision.","Because the manager remains ultimately accountable for task completion even if authority is delegated.","Because the manager remains responsible for monitoring performance against standards."],"correct":2},{"ar":"أي مما يلي يصف بدقة مفهوم سلسلة القيادة (Chain of command) كما ورد في الفصل؟","en":"Which of the following accurately describes the concept of the chain of command as stated in the chapter?","whyAr":"يعرف الكتاب سلسلة القيادة بأنها المسار الرسمي للاتصال والسلطة حيث تتدفق السلطة من مستوى إلى آخر من القمة إلى القاع.","whyEn":"The book defines the chain of command as the formal path of communication and authority, flowing from top to bottom.","optionsAr":["تحديد عدد المرؤوسين الخاضعين لإشراف مشرف واحد.","المسار الرسمي للاتصال والسلطة الذي يتدفق من أعلى التنظيم إلى أسفله.","طريقة تجميع الأنشطة حسب الخدمات الطبية والجراحية.","مجموعة العلاقات غير الرسمية بين أعضاء التمريض."],"optionsEn":["Determining the number of subordinates under one supervisor.","The formal path of communication and authority flowing from top to bottom.","The method of grouping activities by medical and surgical services.","The set of informal relationships among nursing staff members."],"correct":1},{"ar":"إذا طلبت رئيسة التمريض من إحدى الممرضات الالتزام التام بأداء مهمة تمريضية واحدة محددة باستمرار لزيادة الإتقان، فإي مبدأ من مبادئ التنظيم تكون قد طبقته؟","en":"If a head nurse asks a nurse to strictly stick to performing one specific nursing task continuously to increase mastery, which organizing principle has she applied?","whyAr":"ينص مبدأ التخصص على أن الشخص يجب أن يؤدي وظيفة رئيسية واحدة، مما يؤدي إلى تقسيم العمل واكتساب المهارة القصوى.","whyEn":"The principle of specialization states that a person should perform a single leading function, leading to division of labor and maximum skill mastery.","optionsAr":["نطاق الإشراف (Span of control)","التقسيم حسب الوقت (Departmentation by time)","وحدة القيادة (Unity of command)","التخصص (Specialization)"],"optionsEn":["Span of control","Departmentation by time","Unity of command","Specialization"],"correct":3},{"ar":"ما هو الغرض الأساسي من استخدام 'التقسيم حسب الخدمات' (Departmentation by services) في المستشفيات؟","en":"What is the primary purpose of using 'departmentation by services' in hospitals?","whyAr":"يؤكد الكتاب أن التقسيم حسب الخدمات يتم فيه تجميع الأنشطة وفقاً لتشابه المهارات اللازمة لتحقيق الهدف مثل الأقسام الطبية والجراحية وأقسام الأطفال.","whyEn":"The book confirms that departmentation by services groups activities according to similarities of skills needed, such as medical, surgical, and pediatric units.","optionsAr":["تقسيم العمل لتغطية الساعات الأربع والعشرين طوال أيام الأسبوع.","تجميع الأنشطة بناءً على تشابه المهارات المطلوبة مثل الأقسام الطبية والجراحية.","توزيع الخدمات الإدارية جغرافياً عبر المحافظات.","مراعاة الحالة الاقتصادية للمرضى مثل الأقسام المجانية والمدفوعة."],"optionsEn":["Dividing work to cover twenty-four hours a day.","Grouping activities based on similarities of skills needed, such as medical and surgical units.","Distributing administrative services geographically across provinces.","Considering patients' economic status such as paying and free units."],"correct":1}]},{"id":6,"ar":"إدارة الوقت","en":"Time Management","pages":"78–95","summaryAr":"يتناول هذا الفصل مفهوم إدارة الوقت كأحد الموارد الهامة مثل المال والمعدات، ويناقش أهمية إدارته بفعالية، ومبادئ إدارة الوقت، وتصنيف مضيعات الوقت إلى داخلية وخارجية، ودور مدير التمريض في تحقيق الإنتاجية وتحسين الأداء.","summaryEn":"This chapter covers the concept of time management as an important resource equivalent to money and equipment, discussing the importance of effective time management, its principles, the classification of time wasters into internal and external, and the role of the nurse manager in achieving productivity and improving performance.","textAr":"يُعد الوقت مورداً هاماً للغاية لا يقل أهمية عن المال والمعدات والsupplies (المستلزمات)، ولكنه يتطلب التخطيط المستمر، حيث تتطلب الإدارة الفعالة للوقت تحليل خصائص العمل وعادات العمل الفردية لأعضاء الفريق والتدخل عند العثور على استخدام غير منتج للوقت.\n\nتُعرف إدارة الوقت (Time Management) بأنها إدارة الوقت بفعالية بحيث يتم تخصيص الوقت المناسب للنشاط المناسب، وهي تعني أيضاً الاستفادة المثلى من الوقت المتاح لتحقيق أقصى قدر من الإنتاجية.\n\nتتعدد فوائد إدارة الوقت وأهميته لتشمل كون الوقت محدوداً، وتحقيق المزيد بجهد أقل، واتخاذ قرارات أفضل، وأن يكون الشخص أكثر نجاحاً، والتعلم بشكل أكبر، وتقليل التوتر، واكتساب ساعات إضافية منتجة، وزيادة الكفاءة والإنتاجية، والحصول على مزيد من التحكم في الحياة، وقضاء وقت إضافي للاستمتاع.\n\nتتضمن مبادئ إدارة الوقت (Principles of time management) وضوح الغرض (Clarity of purpose) لتحديد ما يحاول الشخص تحقيقه، وتقييم الاستخدام الحالي للتوجه نحو الأهداف وتجنب التسويف، وإنشاء خطة مكتوبة للأنشطة اليومية والأسبوعية، وترتيب الأولويات (Prioritizing) بحيث تحصل الأنشطة المرتبطة بالأهداف على الاهتمام أولاً، ووضع حدود لمضيعات الوقت (Place boundaries on your time wasters)، وتنفيذ مهمة واحدة في المرة الواحدة نظراً لأن تعدد المهام يمثل عبئاً معرفياً، بالإضافة إلى التفويض (Delegation) والتقييم (Evaluation) الأسبوعي الفعال.\n\nيُعرّف مضيع الوقت (Time waster) بأنه أي شيء يمنع الشخص من إنجاز الوظيفة أو تحقيق الهدف، وتصنف مضيعات الوقت إلى نوعين رئيسيين هما مضيعات الوقت الداخلية أو الشخصية (Internal time wasters) وتلك المتعلقة بالنفس وهي الأسهل في التحكم مثل نقص التخطيط والأولويات، والتسويف (Procrastination)، والتنظيم الضعيف (Disorganization)، والكمال المفرط (Perfectionism).\n\nالنوع الثاني هو مضيعات الوقت الخارجية (External time wasters) وهي الأمور التي يفتعلها الآخرون وتكون أكثر صعوبة في السيطرة عليها، وتشمل المكالمات الهاتفية (Telephone calls)، والزيارات المفاجئة (Drop in visitors)، ونظام حفظ الملفات الضعيف (Poor filing system)، والأوراق والوثائق المفرطة (Paper work).\n\nيتضمن دور مدير التمريض في إدارة الوقت (Nurse manager role in time management) أن يكون واعيًا بذاته تجاه المعوقات والعوائق الشخصية للوقت الفعال، والعمل كقدوة ودعم ومورد للمرؤوسين في تحديد الأولويات، ومساعدة العاملين في العمل تعاونياً لتعظيم الاستفادة من الوقت، وترتيب أولويات التخطيط اليومي للوصول للأهداف قصيرة وطويلة المدى، وبناء وقت مخصص للتخطيط في مكان العمل، وتحليل كيفية إدارة الوقت على مستوى الوحدة باستخدام تحليل الوظائف ودراسات الحركة والزمن.","textEn":"Time is an equally important resource such as money, equipment, and supplies, but this requires planning, where effective time management requires analysis of work characteristics, individual work habits, and interventions w
