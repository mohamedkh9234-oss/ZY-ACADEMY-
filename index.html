al classifies patients and determines nursing care hours needed per shift based on the patient's medical diagnosis. What is this method of calculating staffing called?","whyAr":"يشير الكتاب إلى أن طريقة حساب التوظيف بناءً على التشخيص الطبي للمرضى تُعرف بالمجموعات المرتبطة تشخيصياً (Diagnostic related groups).","whyEn":"The book indicates that calculating staffing based on the medical diagnosis of patients is called diagnostic related groups.","optionsAr":["نظام توثيق الحوادث فقط دون تقدير ساعات الرعاية المطلوبة لكل فئة من المرضى.","المجموعات المرتبطة تشخيصياً (Diagnostic related groups).","ميزانية رأس المال والإنفاق.","جدول الإجازات السنوية الإجبارية."],"optionsEn":["Incident documentation alone without estimating care hours required for each patient category.","Diagnostic related groups.","Capital and expenditure budget.","Mandatory annual leave schedule."],"correct":1}]},{"id":10,"ar":"التواصل التنظيمي","en":"Organizational Communication","pages":"156–177","summaryAr":"يتناول هذا الفصل مفهوم التواصل التنظيمي وعناصره وأهميته في بناء الثقة وتقليل سوء الفهم، وأنواعه المختلفة مثل التواصل الرسمي وغير الرسمي والعمودي والأفقي، وأدواته واستراتيجياته في الرعاية الصحية مثل SBAR لتحسين سلامة المرضى.","summaryEn":"This chapter covers the concept of organizational communication, its elements and importance in building trust and reducing misunderstanding, its types such as formal, informal, vertical, and horizontal, and its tools and strategies in healthcare like SBAR to improve patient safety.","textAr":"يُشتق مصطلح التواصل من الكلمة اللاتينية communis وتعني المشاركة، وهو عملية تبادل المعلومات بين الأفراد من خلال نظام مشترك من الرموز أو الإشارات، ويحدث تفاعلياً بين مرسل ومستقبل مع تلقي رد الفعل.\n\nتنقسم أنواع التواصل إلى الاتصال الرسمي لنقل المعلومات الرسمية، والاتصال غير الرسمي المعروف بشبكة الكروم أو القيل والقال الناشئ عن العلاقات الشخصية.\n\nيُعرّف التواصل التنظيمي بأنه مكون إداري يضم خطط الاتصال الاستراتيجية والممارسات لتوجيه وإدارة المعلومات داخلياً وخارجياً.\n\nتكمن أهمية التواصل التنظيمي في بناء الثقة، وتأسيس علاقات عمل أقوى، وتقليل سوء الفهم والمعلومات الخاطئة، ومساعدة الموظفين على فهم رسالة الشركة، وتحسين الكفاءة وتقليل الأخطاء.\n\nتشمل أنواع التواصل التنظيمي التواصل العمودي بشقيه التصاعدي والهبوطي، والتواصل الأفقي الشائع في الشركات الناشئة، بالإضافة للاتصالات الداخلية والخارجية والشفهية والمكتوبة.\n\nتشتمل عناصر التواصل الفعال على التعاطف لفهم مشاعر الآخرين، والوضوح لإرسال رسائل محددة، والتواصل الإيجابي، والتوكيد أو الحزم للتعبير عن الأفكار باحترام، والتأمل الذاتي لتصفية الذهن.\n\nتتطلب إدارة التواصل بكفاءة ربطه بالخطة الاستراتيجية للمنظمة، وفهم الجمهور، وإشراك الموظفين بمحادثات ثنائية الاتجاه، وتوزيع المحتوى عبر القنوات المناسبة، وقياس النتائج.\n\nتكتسي أهمية التواصل الفعال في الرعاية الصحية أهمية بالغة لضمان استمرار الرعاية ورفع السلامة باستخدام أدوات مثل التواصل مغلق الحلقة، وأداة إس بار، والخصائص الخمس، وتقنية آي باس الباتون، وقراءة التحقق.","textEn":"Communication is derived from the Latin word communis, meaning to share, and is a process of exchanging information between individuals interactively between a sender and receiver with feedback.\n\nTypes of communication include formal communication for official messages and informal communication known as grapevine communication arising from personal relationships.\n\nOrganizational communication describes an important management component that includes strategic communication plans and practices to manage information internally and externally.\n\nThe importance of organizational communication includes building trust, establishing stronger working relationships, reducing misinformation, helping employees understand the company mission, and improving efficiency.\n\nTypes of organizational communications include vertical communication up and down, horizontal communication, internal, external, oral, and written communication.\n\nElements of effective organizational communication include empathy, clarity, positive communication, assertiveness, and self-reflection.\n\nManaging organizational communication efficiently involves linking the plan to the strategic plan, understanding audiences, engaging employees in two-way conversations, distributing content, and measuring outcomes.\n\nThe importance of effective communication in healthcare includes ensuring continuity of care and enhancing safety using tools like closed-loop communication, SBAR, Five Ps, I PASS the BATON, and read-back technique.","terms":[["Communication","عملية يتم من خلالها تبادل المعلومات بين الأفراد من خلال نظام مشترك من الرموز أو الإشارات.","A process by which information is exchanged between individuals through a common system of symbols or signs."],["Formal communication","خط الاتصال الرسمي لنقل الرسائل والمعلومات الرسمية داخل أو خارج المنظمة.","A line of communication for the transmission of official message and information within or outside the organization."],["Informal communication","التواصل المبني على العلاقات الاجتماعية والروابط الشخصية بين أعضاء المنظمة والمعروف بالشبكة غير الرسمية.","Communication built around the social relationship of the members of the organization, also known as grapevine."],["Organizational communication","المكون الإداري الذي يضم خطط التواصل الاستراتيجية والممارسات لتوجيه وإدارة المعلومات داخلياً وخارجياً.","An important component of management that includes strategic communication plans, documents and practices to channel and manage information."],["Empathy","محاولة تقمص شخصية الآخر لفهم مشاعره وأفكاره ووجهات نظره.","Stepping into the shoes of the other, to comprehend their feelings, thoughts and perspectives."],["Assertiveness","طريقة فعالة للتعبير عن الأفكار والمشاعر بوضوح ومباشرة وباحترام دون إصدار أحكام.","An effective way to express thoughts and feelings clearly and directly without judging others."],["SBAR","أداة تواصل مستخدمة في الرعاية الصحية وتتكون من الموقف، والخلفية، والتقييم، والتوصية.","A healthcare communication tool standing for situation, background, assessment, recommendation."]],"questions":[{"ar":"ما هو الأصل اللاتيني لكلمة تواصل وماذا تعني؟","en":"What is the Latin origin of the word communication and what does it mean?","whyAr":"ينص الكتاب على أن كلمة التواصل مشتقة من الكلمة اللاتينية communis والتي تعني المشاركة.","whyEn":"The book states that communication is derived from the Latin word communis, meaning to share.","optionsAr":["كلمة motivo وتعني التحفيز.","كلمة organiso وتعني التنظيم.","كلمة communis وتعني المشاركة.","كلمة manager وتعني الإدارة."],"optionsEn":["The word motivo, meaning to motivate.","The word organiso, meaning to organize.","The word communis, meaning to share.","The word manager, meaning management."],"correct":2},{"ar":"ما هو الاسم الآخر المعروف للتواصل غير الرسمي داخل المنظمات؟","en":"What is the other well-known name for informal communication within organizations?","whyAr":"يُذكر في الكتاب أن التواصل غير الرسمي يُعرف أيضاً بتواصل الشبكة غير الرسمية أو القيل والقال.","whyEn":"The book mentions that informal communication is also known as the grapevine communication.","optionsAr":["الاتصال الهرمي التصاعدي","الاتصال الاستراتيجي المكتوب","تواصل الكروم أو القيل والقال","التواصل الخارجي للعملاء"],"optionsEn":["Upward hierarchical communication","Written strategic communication","Grapevine communication","External customer communication"],"correct":2},{"ar":"أي من أنواع التواصل التنظيمي يتميز بأنه لا يتبع التسلسل الهرمي وغالباً ما يكون شائعاً في الشركات الناشئة؟","en":"Which type of organizational communication is characterized by not following the hierarchy and is common in startups?","whyAr":"يوضح الكتاب أن التواصل الأفقي هو الأكثر شيوعاً في الشركات الناشئة حيث لا يُحافظ على التسلسل الهرمي.","whyEn":"The book explains that horizontal communication is most common in startup companies where hierarchy is not maintained.","optionsAr":["التواصل العمودي","التواصل الأفقي","التواصل الخارجي الرسمي","التواصل الهبوطي الصارم"],"optionsEn":["Vertical communication","Horizontal communication","Formal external communication","Strict downward communication"],"correct":1},{"ar":"ما هو العنصر من عناصر التواصل الفعال الذي يعني محاولة وضع النفس مكان الآخر لفهم مشاعره وأفكاره؟","en":"What element of effective communication means trying to put oneself in another's shoes to understand their feelings and thoughts?","whyAr":"يُعرّف الكتاب التعاطف بأنه خطو خطوات شخص آخر لفهم مشاعره وأفكاره ومنظوره.","whyEn":"The book defines empathy as stepping into the shoes of the other to comprehend their feelings, thoughts, and perspectives.","optionsAr":["الوضوح","التأمل الذاتي","التواصل الإيجابي","التعاطف"],"optionsEn":["Clarity","Self-reflection","Positive communication","Empathy"],"correct":3},{"ar":"ما هي الفائدة الأساسية لتخصيص وقت قصير للتأمل الذاتي للمدير؟","en":"What is the primary benefit of devoting time to self-reflection for a manager?","whyAr":"ينص الكتاب على أن التأمل الذاتي يساعد في تهدئة العقل والجسم، تقليل المشتتات، وتصفية المساحة العقلية.","whyEn":"The book states that self-reflection helps calm the mind and body, reduce distractions, and clear mental space.","optionsAr":["تحديد الأولويات قبل البدء في المهام","مراجعة تقدم العمل مقارنة بالأهداف المحددة","تهدئة العقل والجسم وتقليل المشتتات وتصفية المساحة العقلية.","تحسين سرعة إنجاز المهام دون مراجعة الأولويات"],"optionsEn":["Setting priorities before beginning tasks","Reviewing progress against defined objectives","Calming mind and body, reducing distractions, and clearing mental space.","Improving task speed without reviewing priorities"],"correct":2},{"ar":"ممرضة رئيسية تريد إبلاغ طاقم التمريض بتعليمات جديدة وصاغت العبارة بإيجابية لتعزيز التركيز على المرضى. أي عنصر استخدمت؟","en":"A head nurse wants to inform staff of new instructions positively to enhance focus on patients. Which element did she use?","whyAr":"هذا مثال على التواصل الإيجابي المذكور في الكتاب الذي يعزز الانفتاح وتقبل الملاحظات.","whyEn":"This is an example of positive communication mentioned in the book which promotes openness and feedback.","optionsAr":["التواصل غير الرسمي السلبي","التواصل الإيجابي","الغموض الهيكلي","العدوانية المباشرة"],"optionsEn":["Negative informal communication","Positive communication","Structural ambiguity","Direct aggression"],"correct":1},{"ar":"مدير تمريض يواجه مشكلة عدم تناسق المعلومات المرسلة للموظفين. ما هي الخطوة الأولى الصحيحة لإدارة التواصل بكفاءة؟","en":"A nurse manager faces inconsistent communication to employees. What is the correct first step to manage communication efficiently?","whyAr":"يشير الكتاب إلى أن إدارة التواصل بكفاءة تبدأ بربط الاتصال بالخطة الاستراتيجية للمنظمة.","whyEn":"The book indicates that managing communication efficiently begins by linking communication to the organization's strategic plan.","optionsAr":["الاعتماد الكامل على الشائعات غير الرسمية.","ربط خطة التواصل التنظيمي بالخطة الاستراتيجية للمنظمة.","منع الموظفين من تقديم أي نوع من الملاحظات.","الاعتماد على تعميم ورقي واحد لجميع الرسائل دون التأكد من وصوله للورديات."],"optionsEn":["Relying entirely on informal rumors.","Linking the organizational communication plan to the strategic plan.","Preventing employees from giving any feedback.","Using one paper circular for every message without confirming it reached all shifts."],"correct":1},{"ar":"أرادت ممرضة في العناية المركزة نقل تقرير حالة مريض حرج بطريقة منظمة تشمل الموقف والخلفية والتقييم والتوصية. ما هي الأداة الموصى بها؟","en":"An ICU nurse wanted to handover a critical patient's condition covering situation, background, assessment, and recommendation. What tool is recommended?","whyAr":"تُعرف أداة SBAR في الكتاب بأنها أداة تواصل تتكون من الموقف، الخلفية، التقييم، والتوصية.","whyEn":"The SBAR tool is defined in the book as a communication tool consisting of situation, background, assessment, and recommendation.","optionsAr":["نظام تقييم الأداء السنوي","الميزانية الرأسمالية للقسم","أداة SBAR","أداة الجداول الدائرية التنظيمية"],"optionsEn":["Annual performance appraisal system","Departmental capital budget","SBAR tool","Circular organizational chart"],"correct":2},{"ar":"عندما يقوم المدير بالتعبير عن أفكاره ومشاعره بوضوح ومباشرة وباحترام دون إصدار أحكام على الآخرين، ماذا يُسمى هذا السلوك؟","en":"When a manager expresses thoughts and feelings clearly, directly, and respectfully without judging others, what is this behavior called?","whyAr":"يُعرّف الكتاب الحزم بأنه طريقة فعالة للتعبير عن الأفكار والمشاعر بوضوح ومباشرة وباحترام دون إصدار أحكام.","whyEn":"The book defines assertiveness as an effective way to express thoughts and feelings clearly and directly without judging others.","optionsAr":["التواصل العشوائي","العدوانية المفرطة","التوكيد أو الحزم","الكمال المطلق"],"optionsEn":["Random communication","Excessive aggressiveness","Assertiveness","Absolute perfection"],"correct":2},{"ar":"لماذا يُعتبر التواصل ثنائي الاتجاه في بيئة العمل أمراً بالغ الأهمية؟","en":"Why is two-way communication in the work environment considered crucial?","whyAr":"يؤكد الكتاب على أهمية إشراك جميع الموظفين في محادثات ثنائية الاتجاه ضمن إدارة التواصل.","whyEn":"The book emphasizes engaging all employees in two-way conversations as part of managing communication.","optionsAr":["لإشراك جميع الموظفين في محادثات ثنائية الاتجاه كجزء من الإدارة الفعالة.","لأنه يلغي الحاجة للمقابلات الفردية.","لأنه يقلل الحاجة إلى توثيق الملاحظات الراجعة من طاقم التمريض.","لأنه يقتصر على إرسال الأوامر العليا دون رد."],"optionsEn":["Engaging all employees in two-way conversations.","Because it eliminates the need for one-on-one interviews.","Because it prevents any discussion or questioning by subordinates.","Because it is restricted to sending top orders without response."],"correct":0},{"ar":"أي من الأدوات التالية يُستخدم في الرعاية الصحية لضمان وضوح الأوامر من خلال كتابتها وقراءتها والتحقق منها؟","en":"Which of the following tools is used in healthcare to ensure order clarity by writing them down, reading them back, and verifying them?","whyAr":"يذكر الكتاب تقنية الكتابة والقراءة والتحقق كأحد الأدوات والاستراتيجيات في الرعاية الصحية.","whyEn":"The book mentions the write down, read back, and verify technique as a healthcare strategy.","optionsAr":["خرائط السلاسل الزمنية للوقت","تقنية تحليل باريتو للأخطاء","تقنية الكتابة والقراءة والتحقق","نظام الحفظ الضعيف للملفات"],"optionsEn":["Time series charts","Pareto error analysis technique","Write down, read back, and verify technique","Poor file storage system"],"correct":2},{"ar":"ما هو التأثير السلبي لعدم قيام المنظمات بقياس نتائج خطط التواصل الخاصة بها؟","en":"What is the negative effect of organizations failing to measure their communication plans' outcomes?","whyAr":"يشير الكتاب إلى أهمية قياس النتائج واستخدام البيانات للتحسين، مما يعني أن عدم قياسها يعيق ذلك.","whyEn":"The book points to the importance of measuring outcomes and using data for improvement.","optionsAr":["تحسين التواصل دون قياس أثره على النتائج","زيادة عدد الرسائل المتبادلة دون تقييم فعاليتها","عدم القدرة على قياس النتائج واستخدام البيانات للتحسين.","صعوبة تحديد الجوانب التي تحتاج إلى تحسين"],"optionsEn":["Improving communication without measuring its impact","Increasing the number of messages exchanged without evaluating effectiveness","Inability to measure outcomes and use data for improvement.","Difficulty identifying areas needing improvement"],"correct":2},{"ar":"إذا أردت كمدير تمريض توزيع المحتوى عبر القنوات المناسبة بناءً على البيانات، فماذا تتبع؟","en":"If you want to distribute content through appropriate channels based on data, what do you follow?","whyAr":"يوضح الكتاب ضرورة توزيع المحتوى عبر القنوات المناسبة وتنفيذ تكنولوجيا التواصل الملائمة.","whyEn":"The book clarifies the need to distribute content through right channels and implement appropriate communication technology.","optionsAr":["استخدام قناة واحدة لجميع أنواع الرسائل","اختيار القناة دون مراعاة طبيعة الرسالة والجمهور","توزيع المحتوى عبر القنوات المناسبة وتطبيق التكنولوجيا الملائمة.","استخدام القنوات الرقمية دون التحقق من وصول الرسالة"],"optionsEn":["Using one channel for all types of messages","Choosing a channel without considering the message and audience","Distributing content through right channels and implementing communication technology.","Using digital channels without checking message receipt"],"correct":2},{"ar":"ما هو الغرض من استخدام أدوات مثل تقنية آي باس الباتون في الرعاية الصحية؟","en":"What is the purpose of using tools like I PASS the BATON in healthcare?","whyAr":"تُصنف التقنية في الكتاب ضمن الأدوات والاستراتيجيات المستخدمة لتعزيز جودة الرعاية الصحية وسلامة المرضى.","whyEn":"The technique is classified in the book among tools and strategies used to enhance healthcare quality and patient safety.","optionsAr":["توحيد طريقة تسليم المعلومات بين أعضاء الفريق","تحسين توثيق التواصل بين مقدمي الرعاية","تقليل فقدان المعلومات عند انتقال المسؤولية","تعزيز جودة الرعاية الصحية وسلامة المرضى ضمن الاستراتيجيات المخدمة."],"optionsEn":["Standardizing information handoff among team members","Improving communication documentation among care providers","Reducing information loss during handoffs","Enhancing healthcare quality and patient safety."],"correct":3},{"ar":"أي من العبارات الآتية تصف دور التواصل الفعال في تقليل الأخطاء في بيئة العمل التمريضية؟","en":"Which of the following describes the role of effective communication in reducing errors in nursing?","whyAr":"يذكر الكتاب أن التواصل الفعال يقلل سوء الفهم والمعلومات الخاطئة ويحسن الكفاءة ويقلل الأخطاء المكلفة.","whyEn":"The book mentions that effective communication reduces misinformation and misunderstanding, improving efficiency and reducing costly errors.","optionsAr":["تقليل سوء الفهم والمعلومات الخاطئة وتحسين الكفاءة وتقليل الأخطاء المكلفة.","يؤدي إلى زيادة الأوراق المعاملاتية وتأخير اتخاذ القرار.","زيادة احتمالية حدوث نزاعات مستمرة بين الأقسام.","يلغي تماماً حاجة الموظفين لحضور الاجتماعات."],"optionsEn":["Reducing misinformation and misunderstanding, improving efficiency and reducing costly errors.","It leads to increased transactional paperwork and delayed decision-making.","It increases the likelihood of continuous interdepartmental conflicts.","It completely eliminates the need for employees to attend meetings."],"correct":0}]},{"id":11,"ar":"التوجيه","en":"Directing","pages":"178–193","summaryAr":"يتناول هذا الفصل مفهوم التوجيه (Directing) كأحد الوظائف الإدارية الرئيسية التي تضمن وضع الخطط التنظيمية موضع التنفيذ من خلال توجيه عمل المرؤوسين، وعناصر التوجيه المختلفة كالرقابة والإشراف والقيادة والتحفيز والتواصل والإدارة بالأهداف، ودور مدير التمريض في تطبيق التوجيه بفعالية.","summaryEn":"This chapter covers directing as a core management function that ensures organizational plans are put into action through directing subordinates' work, its various elements such as supervision, leadership, motivation, communication, and management by objectives, and the nurse manager's role in applying directing effectively.","textAr":"يُعد التوجيه (Directing) وظيفة إدارية تلعب دوراً محورياً في ضمان وضع الخطط التنظيمية موضع التنفيذ من خلال توجيه عمل المرؤوسين بواسطة المديرين، وهو يشجع تقنيات القيادة والتحفيز والتواصل ويؤكد على الجوانب الإنسانية لإدارة الأفراد الفرق لتنفيذ المهام والأنشطة بما يتوافق مع الاستراتيجية الشاملة للمنظمة.\n\nيُعرّف التوجيه بأنه المكون الحاسم في عملية الإدارة الخاصة بتوجيه والإشراف والتأثير على الموظفين والموارد داخل المنظمة لتحقيق أهداف وغايات بفعالية وكفاءة، ويتمثل غرضه في توجيه سلوك جميع العاملين لإنجاز رسالة وأهداف المنظمة بالتزامن مع مساعدتهم في تحقيق أهدافهم المهنية الخاصة.\n\nتتعدد أهمية التوجيه لتشمل زيادة مساهمات المرؤوسين في تحقيق أهداف إدارة التمريض، وخلق انسجام بين أهداف إدارة التمريض وأهداف العاملين فيها، والعمل كمهدد وموجه وميسر من قِبل مدير التمريض.\n\nتشمل عناصر التوجيه (Elements of directing) خمسة عناصر رئيسية هي الإشراف (Supervision) لتوفير التوجيه والإرشاد للعمل، والقيادة (Leadership) للتأثير في الآخرين، والتحفيز (Motivation) لإلهام الأفراد لزيادة رغبتهم في بذل أقصى طاقاتهم، والتواصل (Communication) لتبادل المعلومات والوصول لفهم مشترك، والإدارة بالأهداف (Management by Objectives) كإطار منهجي لتقييم الأداء ووضع الأهداف.\n\nيستطيع المدير الإشراف والتوجيه عبر تقنيات تشمل الملاحظة، والتفويض، وخلق بيئة محفزة، وتطوير الموظفين، والإدارة بالأهداف. كما يمكن للمدير القيادة وتوجيه المرؤوسين عبر خلق رؤية قوية، وتوضيح مسار واضح، وممارسة التواصل الشخصي الممتاز، واكتساب القناعة، والحفاظ على الرؤية، وخلق وحدة الغرض ومواءمتها مع الثقافة التنظيمية.\n\nتعتمد الإدارة بالأهداف (Management by Objectives) التي اشتهر بها بيتر دراكر على مبادئ تشمل وضع الأهداف، والعملية التشاركية، وتقييم الأداء، وتقييم الأداء والمكافآت، والتغذية الراجعة والتواصل، والمرونة، والالتزام.\n\nيتلخص دور وتطبيق مدير التمريض للتوجيه بحسب نطاق إشرافه في قيادة أفراد التمريض باستخدام نمط قيادي مناسب، والعمل كقدوة حسنة، وتفويض السلطة، والإشراف على العاملين، وخلق بيئة عمل مواتية، واستخدام طريقة التوزيع الملائمة لأعداد المرضى ومستوى حدتهم، والإشراف على تدفق الاتصالات، وحل النزاعات.","textEn":"Directing is a management function which plays a pivotal role in ensuring that organizational plans are put into action through directing the work of subordinates by managers, encouraging leadership, motivation, and communication techniques.\n\nDirecting is defined as a crucial component of the management process of guiding, supervising, and influencing employees and resources within an organization to achieve its goals effectively and efficiently, aiming to channel personnel behavior to accomplish the mission and objectives.\n\nThe importance of directing includes increasing subordinates' contributions to goals, creating harmony between nursing management and worker goals, and acting as a facilitator and coach.\n\nElements of directing include supervision to provide guidance, leadership to influence others, motivation to inspire willingness to use capabilities, communication to reach common understanding, and management by objectives as a systematic performance framework.\n\nA manager supervises and directs subordinates through techniques such as observation, delegation, creating a motivating environment, staff development, and MBO, and leads through creating a strong vision, articulating a clear course, practicing communication, and earning conviction.\n\nManagement by Objectives (MBO) principles include goal setting, participative process, performance evaluation, performance appraisal, feedback and communication, flexibility, and commitment.\n\nThe role and application of directing by the nurse manager include leading nursing personnel using a suitable leadership style, acting as a role model, delegating authority, supervising personnel, creating a conducive environment, using appropriate assignment methods, supervising communication flow, and resolving conflicts.","terms":[["Directing","وظيفة إدارية تضمن وضع الخطط موضع التنفيذ من خلال توجيه عمل المرؤوسين وتشجيع القيادة والتحفيز والتواصل.","A management function which plays a pivotal role in ensuring that organizational plans are put into action through directing the work of subordinates."],["Supervision","تقديم التوجيه والإرشاد للعمل من أجل تحقيق غرض معين باستخدام الملاحظة والتفويض.","Involves providing guidance and direction to the work in order to achieve a certain purpose."],["Leadership","التأثير في الآخرين وجعلهم يفهمون ويؤمنون برؤية القائد للعمل معه لتحقيق الأهداف.","Refer to influence others in a manner to do what the leader wants them to do and getting people to understand and believe in the leader vision."],["Motivation","القوى التي تلهم الشخص في العمل على تكثيف رغبته في استخدام أفضل قدراته لتحقيق أهداف محددة.","Forces that inspire a person at work to intensify his willingness to use the best of his capability for achievement of specific objectives."],["Management by Objectives","فلسفة إدارية وإطار لتقييم الأداء يؤكد على وضع الأهداف، والمشاركة، وتقييم الأداء، والتغذية الراجعة المنتظمة.","A management philosophy and performance management framework that emphasizes goal setting, participation, performance evaluation, and regular feedback."]],"questions":[{"ar":"ما هو التعريف الدقيق لوظيفة 'التوجيه' (Directing) كما ورد في الكتاب؟","en":"What is the exact definition of 'directing' as stated in the book?","whyAr":"يُعرف الكتاب التوجيه بأنه المكون الحاسم في عملية الإدارة الخاصة بتوجيه والإشراف والتأثير على الموظفين والموارد داخل المنظمة لتحقيق أهدافها بفعالية وكفاءة.","whyEn":"The book defines directing as a crucial component of the management process of guiding, supervising, and influencing employees and resources within an organization to achieve its goals effectively and efficiently.","optionsAr":["توزيع الموارد البشرية على الورديات وفق الاحتياجات","المكون الحاسم في عملية الإدارة الخاصة بتوجيه والإشراف والتأثير على الموظفين والموارد لتحقيق الأهداف بفعالية.","تحديد السياسات العامة على مستوى الوزارة","تحديد تكلفة المستلزمات الطبية والمالية للوحدة."],"optionsEn":["Allocating human resources to shifts according to needs","A crucial component of the management process of guiding, supervising, and influencing employees and resources within an organization to achieve its goals effectively and efficiently.","Defining ministry-level general policies","Determining the cost of medical and financial supplies for the unit."],"correct":1},{"ar":"ما هي العناصر الأساسية لوظيفة التوجيه (Elements of directing) المذكورة في الفصل؟","en":"What are the core elements of directing mentioned in the chapter?","whyAr":"يذكر الكتاب أن عناصر التوجيه تتكون من: الإشراف، القيادة، التحفيز، التواصل، والإدارة بالأهداف.","whyEn":"The book states that the elements of directing consist of supervision, leadership, motivation, communication, and management by objectives.","optionsAr":["التقسيم الإداري، التفويض، التخصص، المركزية، اللامركزية.","الإشراف، القيادة، التحفيز، التواصل، الإدارة بالأهداف.","التحفيز الخارجي، التسويف، الكمال، زيارات الزوار، التقارير.","التخطيط، التنظيم، التوظيف، الميزانية، الرقابة."],"optionsEn":["Departmentation, Delegation, Specialization, Centralization, Decentralization.","Supervision, Leadership, Motivation, Communication, Management by Objectives.","Extrinsic motivation, procrastination, perfectionism, visitors, reports.","Planning, Organizing, Staffing, Budgeting, Controlling."],"correct":1},{"ar":"من هو الشخص الذي اشتهر بترويج مفهوم 'الإدارة بالأهداف' (MBO) في كتابه عام 1954؟","en":"Who popularized the concept of Management by Objectives (MBO) in his 1954 book?","whyAr":"يشير الكتاب صراحةً إلى أن الإدارة بالأهداف (MBO) هي فلسفة إدارية تم تعميمها بواسطة خبير الإدارة بيتر دراكر في كتابه الصادر عام 1954.","whyEn":"The book explicitly states that Management by Objectives (MBO) was popularized by management guru Peter Drucker in his 1954 book.","optionsAr":["دوايت أيزنهاور (Dwight D. Eisenhower)","بيتر دراكر (Peter Drucker)","جورج تيري (George Terry)","بروس توكمان (Bruce Tuckman)"],"optionsEn":["Dwight D. Eisenhower","Peter Drucker","George Terry","Bruce Tuckman"],"correct":1},{"ar":"أي من الخيارات التالية يُعد غرضاً أساسياً لعملية التوجيه في المنظمات الصحية؟","en":"Which of the following is considered a primary purpose of directing in healthcare organizations?","whyAr":"يوضح الكتاب أن الغرض من التوجيه هو توجيه سلوك جميع العاملين لإنجاز رسالة وأهداف المنظمة بالتزامن مع مساعدتهم في تحقيق أهدافهم المهنية.","whyEn":"The book explains that the purpose of directing is to channel the behavior of all personnel to accomplish the organization's mission and objectives while simultaneously helping them accomplish their own career objectives.","optionsAr":["تقليل قنوات الاتصال إلى قناة واحدة مهما اختلف الموقف","قصر التوجيه على إصدار الأوامر دون تغذية راجعة","التركيز على إنجاز المهام دون مراعاة أهداف العاملين","توجيه سلوك جميع العاملين لإنجاز رسالة وأهداف المنظمة بالتزامن مع مساعدتهم في تحقيق أهدافهم المهنية."],"optionsEn":["Reducing communication to one channel regardless of context","Limiting direction to orders without feedback","Focusing on task completion without considering staff goals","To channel the behavior of all personnel to accomplish the organization's mission and objectives while helping them accomplish their own career objectives."],"correct":3},{"ar":"كيف يُعرّف الكتاب 'القيادة' (Leadership) كعنصر من عناصر التوجيه؟","en":"How does the book define 'leadership' as an element of directing?","whyAr":"يُعرّف الكتاب القيادة بأنها التأثير في الآخرين بطريقة تجعلهم يفعلون ما يريد القائد، وهي تتعلق بجعل الناس يفهمون ويؤمنون برؤية القائد للعمل معه.","whyEn":"The book defines leadership as referring to influencing others in a manner to do what the leader wants them to do, getting people to understand and believe in the leader's vision.","optionsAr":["التأثير في الآخرين بطريقة تجعلهم يفعلون ما يريد القائد فعله وجعلهم يؤمنون برؤيته.","مراقبة حضور الموظفين عبر كاميرات المراقبة.","إصدار عقوبات مالية صارمة عند حدوث أي خطأ في الوحدة.","التركيز الحصري على مراجعة الفواتير المالية."],"optionsEn":["Referring to influence others in a manner to do what the leader wants them to do and getting people to understand and believe in the leader's vision.","Monitoring employee attendance via surveillance cameras.","Issuing strict financial penalties when any error occurs in the unit.","Focusing exclusively on reviewing financial invoices."],"correct":0},{"ar":"مديرة تمريض لاحظت وجود تباين وفجوة بين أهداف إدارة التمريض وأهداف العاملين في القسم، مما أثر سلباً على الأداء. أي من فوائد التوجيه الفعال يمكن أن يحل هذه المشكلة؟","en":"A nurse manager noticed a gap between nursing management goals and staff goals, negatively affecting performance. Which benefit of effective directing can solve this problem?","whyAr":"يذكر الكتاب ضمن أهمية التوجيه أن التوجيه الفعال يخلق انسجاماً وتوافقاً بين أهداف إدارة التمريض وأهداف العاملين.","whyEn":"The book mentions among the importance of directing that effective directing creates harmony between nursing management goals and nursing workers' goals.","optionsAr":["إصدار قرارات فصل إدارية بحق الموظفين غير الملتزمين.","تأجيل مناقشة الفجوة بين أهداف الوحدة وأهداف العاملين إلى نهاية السنة.","خلق انسجام وتوافق بين أهداف إدارة التمريض وأهداف العاملين (Harmony between goals).","تقليص عدد العاملين في الوردية الليلية."],"optionsEn":["Issuing administrative dismissal decisions against non-compliant employees.","Canceling the annual performance evaluation system.","Creating harmony between nursing management goals and nursing workers' goals.","Reducing the number of workers on the night shift."],"correct":2},{"ar":"أراد مدير تمريض استخدام التقنيات الصحيحة للإشراف على مرؤوسيه في الوحدة وفقاً لما ورد في الفصل. أي من الآتي يمثل إحدى تقنيات الإشراف المذكورة؟","en":"A nurse manager wanted to use the correct techniques to supervise subordinates in the unit according to the chapter. Which of the following represents one of the mentioned supervision techniques?","whyAr":"يوضح الكتاب أن تقنيات الإشراف تشمل: الملاحظة، التفويض، خلق بيئة محفزة، تطوير الموظفين، والإدارة بالأهداف.","whyEn":"The book explains that supervision techniques include observation, delegation, creating a motivating environment, staff development, and management by objectives.","optionsAr":["الملاحظة والتفويض وخلق بيئة محفزة وتطوير الموظفين.","الاعتماد على التقارير الخارجية فقط وتجنب النزول للقسم.","الاكتفاء بتوثيق الملاحظات دون تقديم تغذية راجعة أو خطة تحسين.","فرض جداول مناوبات عشوائية دون استشارة."],"optionsEn":["Observation, delegation, creating a motivating environment, and staff development.","Relying solely on external reports and avoiding visiting the unit.","Completely ignoring workers' mistakes and not interfering.","Imposing random shift schedules without consultation."],"correct":0},{"ar":"ممرضة رئيسية تريد تطبيق مبادئ الإدارة بالأهداف (MBO) في قسمها، فما هي أول خطوة أساسية يجب عليها البدء بها مع مرؤوسيها؟","en":"A head nurse wants to apply Management by Objectives (MBO) principles in her department. What is the first essential step she must start with her subordinates?","whyAr":"تتضمن مبادئ الإدارة بالأهداف (MBO) كخطوة أولى أساسية وضع الأهداف (Goal Setting) وتأسيس أهداف واضحة ومحددة.","whyEn":"MBO principles include goal setting (establishment of clear and specific objectives for the organization, its departments, and individual employees) as the first foundational component.","optionsAr":["تحديد مهام الوردية دون الاتفاق على أهداف أداء قابلة للقياس.","إصدار تعليمات تنفيذية قبل مناقشة الأهداف والمسؤوليات مع الفريق.","تغيير توزيع المسؤوليات قبل تحديد أهداف الوحدة ومؤشرات قياسها.","وضع الأهداف (Goal Setting) وتحديد أهداف واضحة ومحددة للقسم والأفراد."],"optionsEn":["Granting open leaves without setting objectives.","Imposing immediate financial penalties for tardiness.","Closing the nursing department and completely restructuring it.","Goal Setting (establishment of clear and specific objectives for the organization, departments, and employees)."],"correct":3},{"ar":"كيف يمارس مدير التمريض 'التواصل' الفعال لتوجيه المرؤوسين بشكل صحيح عند إعطاء التوجيهات؟","en":"How does a nurse manager practice effective 'communication' to direct subordinates properly when giving instructions?","whyAr":"يشير الكتاب إلى أن المدير يوجه عبر التواصل من خلال قول الخلاصة باختصار، معرفة متلقي الرسالة، والاستماع الفعال مع إظهار إيماءات الإنصات والتواصل البصري.","whyEn":"The book indicates that managers communicate and direct by speaking the gist concisely, knowing recipients, listening, and showing gestures like nodding and eye contact.","optionsAr":["إعطاء تعليمات عامة دون تحديد المسؤوليات أو الموعد","الاكتفاء بالتواصل الكتابي في المواقف التي تتطلب توضيحًا فوريًا","قول الخلاصة باختصار، معرفة متلقي الرسالة، والاستماع الجيد مع إظهار علامات الإنصات.","تقديم التعليمات دون التأكد من فهم المتلقي"],"optionsEn":["Giving general instructions without defining responsibilities or deadlines","Relying on written communication when immediate clarification is needed","Speaking the gist concisely, knowing message recipients, and listening well with listening gestures.","Giving instructions without confirming the recipient understands"],"correct":2},{"ar":"ممرضة تعمل مشرفة وتواجه مشكلات متكررة وصراعات بين طاقم التمريض في الوردية الصباحية. وفقاً لدور مدير التمريض في التوجيه، كيف يجب أن تتعامل مع هذا الموقف؟","en":"A nurse working as a supervisor faces frequent problems and conflicts among the nursing staff on the day shift. According to the nurse manager's role in directing, how should she handle this situation?","whyAr":"ينص الكتاب ضمن تطبيق التوجيه من قِبل مدير التمريض على حل نزاعات الممرضات باستخدام الآلية المناسبة.","whyEn":"The book states under the application of directing by the nurse manager to resolve nurses' conflicts through using appropriate mechanisms.","optionsAr":["إحالة الخلاف مباشرة إلى الإدارة العليا دون محاولة حله ضمن الصلاحيات.","حل نزاعات الممرضات باستخدام الآلية المناسبة.","فصل جميع الموظفين المتورطين في النزاع فوراً.","تأجيل معالجة الخلاف إلى نهاية الوردية دون تقييم أثره على تنسيق الرعاية."],"optionsEn":["Withdrawing from the department and avoiding morning presence.","Resolving nurses' conflicts through using appropriate mechanisms.","Immediately dismissing all employees involved in the conflict.","Completely ignoring the conflict and letting it worsen among employees."],"correct":1},{"ar":"أي من الخيارات التالية يمثل إحدى الطرق التي يتبعها المدير لكسب 'القناعة' (Earn conviction) وتوجيه مرؤوسيه قيادياً؟","en":"Which of the following represents a way a manager earns conviction and leads subordinates?","whyAr":"يُبين الكتاب أن كسب القناعة (Earn conviction) يعني كسب ثقة واعتقاد المرؤوسين كإحدى طرق القيادة وتوجيه المرؤوسين.","whyEn":"The book shows that earning conviction means gaining the trust and belief of subordinates as a way of leading and directing.","optionsAr":["استخدام التقييم والعقوبات بدلًا من بناء الثقة وإشراك الفريق.","الاعتماد على الأوامر الرسمية وحدها دون طلب ملاحظات العاملين.","الاعتماد على السلطة الرسمية وحدها دون شرح مبررات القرار.","اكتساب ثقة واعتقاد المرؤوسين (Gain the trust and belief of subordinates)."],"optionsEn":["Using appraisal and penalties instead of building trust and involving the team.","Refusing to listen to any developmental proposals.","Forcing them to obey orders by coercive power.","Gain the trust and belief of subordinates."],"correct":3},{"ar":"عندما يقوم مدير التمريض بتوفير تجارب تعلم تساعد في تحسين أداء الممرضات، فهذا يندرج تحت أي من مهامه في التوجيه؟","en":"When a nurse manager provides learning experiences to help improve nurses' performance, this falls under which of their directing duties?","whyAr":"يُدرج الكتاب خلق التجربة التعليمية التي تحسن أداء الممرض ضمن التطبيق العملي لوظيفة التوجيه من قِبل مدير التمريض.","whyEn":"The book lists creating the learning experience that helps to improve the nurse performance under the practical application of directing by the nurse manager.","optionsAr":["خلق التجربة التعليمية التي تساعد على تحسين أداء الممرض (Create the learning experience that helps to improve the nurse performance).","متابعة الالتزام بالمعايير والإجراءات التمريضية","تقييم احتياجات التدريب بناءً على فجوات الأداء","تنسيق الموارد المطلوبة لتنفيذ خطط التدريب"],"optionsEn":["Creating the learning experience that helps to improve the nurse performance.","Monitoring adherence to nursing standards and procedures","Assessing training needs based on performance gaps","Coordinating resources needed to deliver training plans"],"correct":0},{"ar":"كيف يحقق مدير التمريض 'وحدة الغرض' (Unity of purpose) بين أعضاء الفريق التمريضي أثناء عملية التوجيه؟","en":"How does a nurse manager achieve 'unity of purpose' among nursing team members during the directing process?","whyAr":"يُعرّف الكتاب وحدة الغرض (Unity of Purpose) بأنها خلق هدف موحد بين أعضاء الفريق.","whyEn":"The book defines unity of purpose as creating a unified goal among team members.","optionsAr":["قصر تبادل المعلومات على التوجيهات الفردية دون اجتماعات تنسيق للفريق.","عبر تشجيع المنافسة السلبية والعداء الشخصي.","من خلال إعطاء كل ممرض مهام تعارض مهام الزميل الآخر.","من خلال خلق هدف موحد بين أعضاء الفريق."],"optionsEn":["Completely preventing group communication in the unit.","By encouraging negative competition and personal hostility.","Through giving each nurse tasks conflicting with colleagues.","Through creating a unified goal among team members."],"correct":3},{"ar":"أي من الخيارات التالية يُعد شرطاً أساسياً لنجاح نظام الإدارة بالأهداف (MBO) في تقييم أداء العاملين وتوجيههم؟","en":"Which of the following is considered an essential prerequisite for the success of MBO in evaluating and directing employee performance?","whyAr":"تُعد العملية التشاركية (إشراك الموظفين في وضع الأهداف) أحد المبادئ الأساسية لنجاح نظام الإدارة بالأهداف وتوجيههم بفعالية.","whyEn":"The participative process (involving employees in the goal-setting process) is one of the essential principles for the success of MBO and effective direction.","optionsAr":["وضع أهداف فردية دون ربطها بأهداف الوحدة","العملية التشاركية (Participative Process) وإشراك الموظفين في وضع الأهداف.","تقييم الأداء في نهاية الفترة فقط دون مراجعات مرحلية","تحديد الأهداف من المدير دون الاتفاق على معايير قياسها"],"optionsEn":["Setting individual goals without linking them to unit goals","Participative Process (involving employees in the goal-setting process).","Evaluating performance only at period-end without interim reviews","Setting goals by the manager without agreeing on measurement criteria"],"correct":1},{"ar":"ممرضة رئيسية تحاول توجيه العاملين في قسمها عبر إرسال رسالة واضحة تربط رؤية القسم بالثقافة التنظيمية للمستشفى. ماذا يُسمى هذا المبدأ القيادي في التوجيه؟","en":"A head nurse tries to direct workers in her department by sending a clear message linking the department's vision to the hospital's organizational culture. What is this leadership principle in directing called?","whyAr":"يُطلق على مطابقة الرؤية مع الثقافة التنظيمية اسم (Harmonize Vision) ضمن الطرق التي يقود بها المدير ويوجه مرؤوسيه.","whyEn":"Aligning the vision with the organizational culture is termed 'Harmonize Vision' among the ways a manager leads and directs subordinates.","optionsAr":["الابتعاد عن التواصل الشخصي مع الموظفين.","مواءمة الرؤية والثقافة (Harmonize Vision / Align the vision with the organizational culture).","التسويف الإداري المستمر.","المركزية المطلقة في إصدار القرارات."],"optionsEn":["Avoiding personal communication with employees.","Harmonize Vision (Align the vision with the organizational culture).","Continuous administrative procrastination.","Absolute centralization in decision making."],"correct":1}]},{"id":12,"ar":"بناء فرق العمل","en":"Team Building","pages":"194–216","summaryAr":"يتناول هذا الفصل مفهوم الفريق وعملية بناء فرق العمل، والفروق بين المجموعة وفريق العمل، ومراحل تطور الفريق وفق نموذج بروس توكمان، واستراتيجيات بناء الفريق، والأدوار داخله، وأنواع الفرق المختلفة.","summaryEn":"This chapter covers the concept of a team and team building, the differences between a group and a team, stages of team development according to Bruce Tuckman's model, team building strategies, various team roles, and different types of teams.","textAr":"يُعرّف الفريق بأنه مجموعة من الأفراد الذين يجتمعون للتعاون والعمل بشكل جماعي نحو هدف أو غاية مشتركة[span_0](start_span)[span_0](end_span). يمتلك أعضاء الفريق مهارات وأدواراً متكاملة مع صفات مثل التماسك والثقة[span_1](start_span)[span_1](end_span).\n\nتُعرف عملية بناء الفريق بأنها عملية جمع الأشخاص المناسبين وجعلهم يعملون معاً لصالح المشروع[span_2](start_span)[span_2](end_span). تبرز أهمية بناء الفريق في تحسين التعاون، وحل المشكلات، وزيادة الإنتاجية، ورفع الروح المعنوية، وبناء الثقة[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span).\n\nتوجد فروق بين المجموعة والفريق؛ فالمجموعة تفتقر للترابط الجماعي المتبادل ومخرجاتها فردية، بينما الفريق يتميز بالاعتماد المتبادل ومخرجاته جماعية[span_5](start_span)[span_5](end_span).\n\nتتضمن مراحل تطور الفريق نموذج بروس توكمان: التكوين، والعصف، والتطبيع أو التشكيل، والأداء، والإنهاء[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span)[span_8](start_span)[span_8](end_span)[span_9](start_span)[span_9](end_span)[span_10](start_span)[span_10](end_span)[span_11](start_span)[span_11](end_span).\n\nتتنوع استراتيجيات بناء الفريق لتشمل استخدام أنشطة كسر الجليد، وتحديات حل المشكلات، والسلامة النفسية، وإدارة النزاعات، وتطوير ميثاق الفريق[span_12](start_span)[span_12](end_span)[span_13](start_span)[span_13](end_span)[span_14](start_span)[span_14](end_span).\n\nتتعدد الأدوار اللازمة لعمل الفريق لتشمل قائد الفريق، وميسر الفريق، ومسجل الفريق، ومراقب الوقت، والأعضاء[span_15](start_span)[span_15](end_span)[span_16](start_span)[span_16](end_span).\n\nتتنوع أنواع الفرق لتشمل الفرق التقليدية، والفرق ذاتية التوجيه، والفرق الوظيفية، والفرق متعددة الوظائف، وفرق المشاريع، والفرق الافتراضية، وفرق تحسين الجودة[span_17](start_span)[span_17](end_span)[span_18](start_span)[span_18](end_span)[span_19](start_span)[span_19](end_span).","textEn":"A team is a group of individuals who come together to collaborate toward a common goal, typically having complementary skills and cohesion[span_20](start_span)[span_20](end_span).\n\nTeam building is the process of gathering the right people to work together for a project's benefit, improving collaboration, problem-solving, productivity, and morale[span_21](start_span)[span_21](end_span)[span_22](start_span)[span_22](end_span)[span_23](start_span)[span_23](end_span).\n\nThe difference between a group and a team lies in interdependence and collective work products versus individual ones[span_24](start_span)[span_24](end_span).\n\nStages of team development follow Bruce W. Tuckman's model: forming, storming, norming, performing, and adjourning[span_25](start_span)[span_25](end_span)[span_26](start_span)[span_26](end_span)[span_27](start_span)[span_27](end_span)[span_28](start_span)[span_28](end_span)[span_29](start_span)[span_29](end_span)[span_30](start_span)[span_30](end_span).\n\nTeam building strategies include icebreakers, problem-solving challenges, psychological safety, conflict management, and developing a team charter[span_31](start_span)[span_31](end_span)[span_32](start_span)[span_32](end_span)[span_33](start_span)[span_33](end_span).\n\nRoles that keep a team operating smoothly include the team leader, facilitator, recorder, timekeeper, and members[span_34](start_span)[span_34](end_span)[span_35](start_span)[span_35](end_span).\n\nTypes of teams include traditional, self-directed, functional, cross-functional, project, virtual, and quality improvement teams[span_36](start_span)[span_36](end_span)[span_37](start_span)[span_37](end_span)[span_38](start_span)[span_38](end_span).","terms":[["Team building","عملية جمع الأشخاص المناسبين وجعلهم يعملون معاً لصالح المشروع.","The process of gathering the right people and getting them to work together for the benefit of a project."],["Forming","مرحلة التكوين التي يتعرف فيها أعضاء الفريق على بعضهم وتكون تفاعلاتهم حذرة.","The initial stage where team members get to know each other and are cautious in interactions."],["Storming","مرحلة العصف التي تتسم بالصراع والتوتيرات بين أعضاء الفريق.","The stage marked by conflict and tension as team members express opinions and preferences."],["Norming","مرحلة التطبيع التي يبدأ فيها الأعضاء بحل الخلافات وبناء الثقة وتطوير معايير السلوك.","The stage where team members resolve differences, build trust, and develop norms."],["Performing","مرحلة الأداء التي يعمل فيها الفريق بسلاسة وكفاءة عالية وبشكل ذاتي نحو الأهداف.","The stage where high-performing teams work seamlessly and efficiently to achieve goals."],["Adjourning","مرحلة الإنهاء التي ينحل فيها الفريق أو يكمل مشروعه.","The final stage where the team disbands or completes its project."],["Team charter","مستند يحدد هدف الفريق، وأهدافه، وقيمه، والسلوكيات المتوقعة.","A document that outlines the team's purpose, goals, values, and expected behaviors."]],"questions":[{"ar":"ما هو التعريف الدقيق لعملية بناء الفريق كما ورد في الكتاب؟","en":"What is the exact definition of team building as stated in the book?","whyAr":"يُعرف الكتاب بناء الفريق بأنه عملية جمع الأشخاص المناسبين وجعلهم يعملون معاً لصالح المشروع[span_41](start_span)[span_41](end_span).","whyEn":"The book defines team building as the process of gathering the right people and getting them to work together for the benefit of a project[span_42](start_span)[span_42](end_span).","optionsAr":["عملية جمع الأشخاص المناسبين وجعلهم يعملون معاً لصالح المشروع[span_39](start_span)[span_39](end_span).","توزيع الميزانية المالية السنوية للمستشفى على الأقسام.","تقييم الأداء الفردي للممرضات في نهاية العام.","وضع القواعد القانونية المنظمة لعمل الوزارة."],"optionsEn":["The process of gathering the right people and getting them to work together for the benefit of a project[span_40](start_span)[span_40](end_span).","Distributing the hospital's annual financial budget to departments.","Evaluating nurses' individual performance at the end of the year.","Establishing legal rules organizing ministry work."],"correct":0},{"ar":"من هو صاحب نموذج مراحل تطور الفريق المعروف باسم توكمان؟","en":"Who is the author of the team development stages model?","whyAr":"يُشير الكتاب بوضوح إلى أن نموذج مراحل تطور الفريق يُعرف بنموذج بروس توكمان[span_45](start_span)[span_45](end_span).","whyEn":"The book clearly indicates that the stages of team development model is known as Bruce W. Tuckman's model[span_46](start_span)[span_46](end_span).","optionsAr":["جورج تيري","دوايت أيزنهاور","بيتر دراكر","بروس توكمان[span_43](start_span)[span_43](end_span)"],"optionsEn":["George Terry","Dwight D. Eisenhower","Peter Drucker","Bruce W. Tuckman[span_44](start_span)[span_44](end_span)"],"correct":3},{"ar":"أي من مراحل تطور الفريق تتميز بالصراع والتوتيرات وبدء أعضاء الفريق في التعبير عن آرائهم؟","en":"Which stage of team development is characterized by conflict, tension, and members expressing opinions?","whyAr":"يُبيّن الكتاب أن مرحلة العصف تتميز بالصراع والتوتيرات وتعبير الأعضاء عن آرائهم وتفضيلاتهم[span_49](start_span)[span_49](end_span).","whyEn":"The book shows that the storming stage is marked by conflict and tension as members express opinions and preferences[span_50](start_span)[span_50](end_span).","optionsAr":["مرحلة العصف[span_47](start_span)[span_47](end_span)","مرحلة التطبيع","مرحلة الأداء","مرحلة التكوين"],"optionsEn":["Storming[span_48](start_span)[span_48](end_span)","Norming","Performing","Forming"],"correct":0},{"ar":"ما هي الميزة الأساسية لفريق العمل مقارنة بالمجموعة التقليدية من ح
