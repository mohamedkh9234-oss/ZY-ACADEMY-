,"optionsAr":["فرق تحسين الجودة[span_91](start_span)[span_91](end_span)","فريق القيادة الاستراتيجية","الفريق الوظيفي الدائم","الفريق الافتراضي الدولي"],"optionsEn":["Quality improvement teams[span_92](start_span)[span_92](end_span)","Strategic leadership team","Permanent functional team","International virtual team"],"correct":0},{"ar":"أي من الخيارات الآتية يمثل أهمية بناء الفريق في بيئة العمل التمريضية حسب النص؟","en":"Which of the following represents the importance of team building in the nursing work environment?","whyAr":"يحدد الكتاب أهمية بناء الفريق في تحسين التعاون، حل المشكلات، زيادة الإنتاجية، ورفع الروح المعنوية[span_97](start_span)[span_97](end_span).","whyEn":"The book specifies the importance of team building in improving collaboration, enhancing problem-solving, increasing productivity, and boosting morale[span_98](start_span)[span_98](end_span).","optionsAr":["يقلل الحاجة إلى التنسيق بين التخصصات عند اتخاذ قرارات الرعاية.","تحسين التعاون، وتعزيز حل المشكلات، وزيادة الإنتاجية ورفع الروح المعنوية[span_95](start_span)[span_95](end_span).","يجعل إنجاز المهام معتمدًا على قائد الفريق بدلًا من التعاون المتبادل.","يفرض قرارات تعسفية على الممرضات دون مناقشة."],"optionsEn":["Completely eliminates any different opinions.","Improving collaboration, enhancing problem-solving, increasing productivity, and boosting morale[span_96](start_span)[span_96](end_span).","Increases the rate of personal disputes and tensions.","Imposes arbitrary decisions on nurses without discussion."],"correct":1}]},{"id":13,"ar":"الموازنة","en":"Budget","pages":"217–231","summaryAr":"تعريف الموازنة وأغراضها ووظائفها الخمس، ومخاطر عدم وجود موازنة، وخطوات إعدادها، وخصائص الموازنة الفعالة، وأنواعها (القوى العاملة والتشغيل ورأس المال والنقدية)، ونظامي الإعداد المركزي واللامركزي.","summaryEn":"Definition, purposes, and five functions of a budget, the risks of not budgeting, budgetary steps, characteristics of an effective budget, its types (personnel, operating, capital, cash), and centralized versus decentralized development.","textAr":"تعريف الموازنة (Budget): هي وصف رقمي للإيرادات المتوقعة والنفقات المخططة للمنظمة لفترة زمنية محددة. وهي خطة تستخدم البيانات للتنبؤ بأنشطة المنظمة خلال فترة زمنية، وتوفر آلية للتخطيط والرقابة وتعزيز احتياجات كل وحدة ومساهماتها. وإعداد الموازنة يُسمى (Budgeting)، وفي كثير من المنظمات يوجد قسم مستقل مسؤول عن إعدادها وتنفيذها.\n\nأغراض الموازنة (Purposes of the budget):\n1. وضع حدود لتكاليف التشغيل، فهي تحوّل الخطط إلى أرقام.\n2. تعمل كأداة قوية لأنها دليل لأداء التمريض.\n3. تساعد في توزيع الأفراد والمستلزمات وخدمات الدعم والمرافق.\n\nوظائف الموازنة (Functions of budgets): للموازنة خمس وظائف. الأولى التخطيط (Planning): فإعداد الموازنة يساعد المديرين على التخطيط للمستقبل بتقييم بدائل العمل وتوقع المشكلات قبل حدوثها، وهو يعطي نتائج أفضل من القرارات \"على الماشي\". ويشمل ذلك توزيع الموارد (Resource Allocation) كالعاملين والمستلزمات والمعدات والتدريب بكفاءة، مما يساعد المنشأة على الحفاظ على مستوى عاملين كافٍ وتخزين المستلزمات اللازمة والاستثمار في تعليم الطاقم.\n\nالوظيفة الثانية التنسيق (Coordination): فمن دون رقابة الموازنة قد يتخذ مديرو الوظائف المختلفة قرارات عن المستقبل تتعارض مع الأقسام الأخرى، ولذلك تتطلب الموازنة الفعالة مواءمة المخصصات مع أهداف المنظمة. كما تعزز الموازنة الكفاءة التشغيلية (Operational Efficiency) بتحسين توزيع الموارد وتبسيط سير العمل، فتقلل الهدر وتتكيف سريعاً مع تغيّر طلب المرضى.\n\nالوظيفة الثالثة التحفيز (Motivation): فمشاركة العاملين في إعداد الموازنة تمكّنهم، لأنها تجعلهم مسؤولين عن الأداء المالي. وتشير الدراسات إلى أن الناس يؤدون أفضل عندما تكون أهدافهم قابلة للتحقيق، ويرتفع إنتاجهم وتقل معدلات ترك العمل.\n\nالوظيفة الرابعة الرقابة (Control): تحافظ الموازنة على رقابة مالية فعالة وتمنع المنظمة من إنفاق أكثر مما تكسب. ومقارنة البيانات المخططة بالفعلية تسمى تحليل الانحراف (Variance analysis). فإذا زاد الإنفاق باستمرار في مجال ما، يمكن للمدير البحث عن السبب. وتشمل الرقابة ضبط التكلفة (Cost Control) بمتابعة النفقات وتحديد ما يمكن خفضه دون المساس برعاية المرضى، كما أن الحفاظ على جودة الرعاية (Quality of Care) هدف رئيسي لموازنات التمريض، بتخصيص الأموال للموارد الأساسية ومبادرات تحسين النتائج وتدريب الطاقم.\n\nالوظيفة الخامسة التواصل (Communication): فعملية إعداد الموازنة تسهّل التواصل والتفاعل بين المديرين وأقسامهم، وتزيد وعيهم باحتياجات الأقسام الأخرى.\n\nمخاطر عدم وجود موازنة (Risks of not budgeting): 1. عدم وجود صندوق للطوارئ. 2. العجز عن توسيع العمليات أو دخول سوق جديدة. 3. عدم القدرة على جذب الاستثمارات. 4. احتمال إغلاق الشركة لعجزها عن سداد الديون. 5. عدم القدرة على الالتزامات طويلة الأجل مع العملاء والموردين، مما يضعف العلاقات. 6. العجز عن الحصول على قروض أو إجراء مشتريات كبيرة ضرورية للعمل.\n\nخطوات عملية الموازنة (Steps in the budgetary process):\n1. تقييم ما يجب أن تغطيه الموازنة. وكان كبار المديرين قديماً يعدّونها دون مشاركة المستويين الأوسط والأول، أما اليوم فتعكس مدخلات من كل مستويات الهرم التنظيمي.\n2. وضع الخطة. ودورة الموازنة المحددة بـ12 شهراً تسمى موازنة السنة المالية (fiscal-year budget)، وقد لا توافق السنة التقويمية، وتُقسم عادة إلى أرباع أو فترات شهرية أو نصف سنوية.\n3. التنفيذ، وفيه متابعة وتحليل مستمران لتجنب نقص الأموال أو زيادتها في نهاية السنة المالية.\n4. التقييم، وتُراجع الموازنة دورياً وتعدّل حسب الحاجة خلال السنة.\n\nخصائص الموازنة الفعالة (Characteristics of an effective budget): أن تكون 1. مبنية على أهداف المنظمة ومعاييرها. 2. بسيطة ومرنة ومتوازنة واقتصادية. 3. عادلة وموضوعية. 4. مبنية على عوامل يمكن التحكم فيها. 5. موجهة نحو النتائج.\n\nأنواع الموازنات (Types of Budgets):\n1. موازنة القوى العاملة (Personnel budget): هي الأكبر لأن الرعاية الصحية كثيفة العمالة. وللتعامل مع تقلب عدد المرضى وحدّة حالاتهم يلزم إعداد موازنة متغيرة شاملة، باستخدام البيانات التاريخية لتقلبات إشغال الوحدة. ويجب متابعتها عن كثب لمنع نقص العاملين أو زيادتهم. وتشمل وقت العمل الفعلي (productive) والوقت الذي تدفع فيه المنظمة للموظف دون عمل (non-productive) كالمزايا وتوجيه الموظف الجديد والإجازات المرضية والعطلات ووقت التعليم. مثال: وردية 8.5 ساعة تتضمن استراحة غداء 30 دقيقة واستراحتين كل منهما 15 دقيقة، فيعمل الموظف 7.5 ساعة إنتاجية وساعة غير إنتاجية.\n2. موازنة التشغيل (Operating budget): تعكس النفقات التي تتغير مع حجم الخدمة، كالمصروفات اليومية للكهرباء والإصلاح والصيانة والمستلزمات.\n3. موازنة رأس المال (Capital budget): تغطي النفقات التي تتطلب معدات رئيسية (عادة تتجاوز 300 دولار) أو تغييرات مادية في المبنى تتطلب مبالغ كبيرة. وتخطط لشراء المباني أو المعدات الرئيسية ذات العمر الطويل (عادة أكثر من خمس إلى سبع سنوات).\n4. الموازنة النقدية (Cash budget): هي شريان الحياة لأي منظمة، وتعادل في أهميتها موازنتي التشغيل ورأس المال. وهي خطة تشغيل للمقبوضات والمدفوعات النقدية الشهرية. وبقاء المنظمة يعتمد على سداد فواتيرها في موعدها.\n\nنظم إعداد الموازنة (Systems of budget development):\n1. الموازنة المركزية (Centralized): يعدها ويفرضها المراقب المالي ومدير المستشفى ومدير خدمات التمريض بقليل من التشاور مع المديرين الأدنى أو دونه. وهذا الأسلوب من أعلى إلى أسفل يترك المنفذين بلا استقلالية أو حق في تخصيص النفقات أو التحكم فيها.\n2. الموازنة اللامركزية (Decentralized): تدرك مزيد من المنشآت الصحية قيمة أن يعد الموازنة من سينفذونها. ففي اللامركزية يشارك المدير من المستوى الأول (رئيسة التمريض) فعلياً في التخطيط والموازنة، وتوضع الاستقلالية والمساءلة والسلطة عند مستوى الممارس.","textEn":"Definition of budget: a numerical description of expected income and planned expenditures for an organization for a specified period of time. It is a plan that uses data to predict the activities of an organization over a period, and it provides a mechanism for planning and control, promoting each unit's needs and contributions. Preparing a budget is called budgeting, and in many organizations it is a separate department.\n\nPurposes of the budget:\n1. To set operating cost limits; it quantifies plans.\n2. It can be a powerful instrument since it serves as a guide for nursing performance.\n3. It helps in allocation of personnel, supplies, support services, and facilities.\n\nFunctions of budgets: a budget has five functions. The first is planning: creating a budget helps managers plan for the future by evaluating options for action and anticipating problems before they occur, and it produces better results than decisions made on the spot. This includes resource allocation of staffing, supplies, equipment, and training, which helps maintain adequate staffing levels, stock necessary supplies, and invest in staff education.\n\nThe second function is coordination: without budget control, managers of different functions can make decisions about the future that conflict with other departments, so effective budgeting requires aligning allocations with organizational goals. Budgeting also promotes operational efficiency by optimizing resource allocation and streamlining workflows, reducing waste and adapting quickly to changes in patient demand.\n\nThe third function is motivation: involvement in budgeting empowers employees by holding them accountable for financial performance. Studies show people perform better when they have achievable goals, increase productivity, and reduce turnover.\n\nThe fourth function is control: a budget maintains effective financial control and prevents spending more than the organization earns. The comparison of planned and actual data is called variance analysis; if a manager constantly overspends in one area, he can find out why. Control includes cost control, monitoring expenses and reducing costs without compromising patient care, and quality of care, a primary goal of nursing budgets, by allocating funds for essential resources, quality improvement initiatives, and staff training.\n\nThe fifth function is communication: the budgeting process facilitates communication and interaction between managers and their departments, increasing awareness of the needs of other departments.\n\nRisks of not budgeting: 1. No emergency fund. 2. Inability to expand operations or enter a new market. 3. Not being able to secure investment dollars. 4. Potentially shutting down because the company cannot get out of debt. 5. Not making long-term commitments to customers, clients, vendors, or suppliers, which strains relationships. 6. Inability to secure loans or make a large necessary purchase.\n\nSteps in the budgetary process:\n1. Assess what needs to be covered. Historically top-level managers developed the budget without input from middle or first-level managers, but today budgeting reflects input from all levels.\n2. Develop a plan. A budgeting cycle set for 12 months is a fiscal-year budget, which may not match the calendar year and is usually divided into quarters or monthly, quarterly, or semiannual periods.\n3. Implementation, with ongoing monitoring and analysis to avoid inadequate or excess funds at the end of the fiscal year.\n4. Evaluation: the budget must be reviewed periodically and modified as needed throughout the fiscal year.\n\nCharacteristics of an effective budget: it should be 1. Based on organizational objectives and standards. 2. Simple, flexible, balanced, and economic. 3. Fair and objective. 4. Based on controllable factors. 5. Outcome oriented.\n\nTypes of budgets:\n1. Personnel budget: the largest budget because healthcare is labor intensive. To handle fluctuating patient census and acuity, managers need a comprehensive variable budget, using historical data on unit census fluctuations. It must be monitored closely to prevent understaffing or overstaffing. It includes productive time and non-productive time paid by the organization, such as benefits, new employee orientation, sick and holiday time, and education time. Example: an 8.5-hour shift includes a 30-minute lunch and two 15-minute breaks, so the employee works 7.5 productive hours and has 1 hour of non-productive time.\n2. Operating budget: reflects expenses that change in response to the volume of service, such as daily expenses for electricity, repair, maintenance, and supplies.\n3. Capital budget: provides for expenditures that call for major equipment (usually items over $300) or physical changes in the building requiring large sums. It plans purchase of buildings or major equipment with a long life (usually greater than five to seven years).\n4. Cash budget: the life blood of any organization, as important as the operating and capital budgets. It is the operating plan for monthly cash receipts and disbursements. Organizational survival depends on paying bills on time.\n\nSystems of budget development:\n1. Centralized budgets: developed and imposed by the controller, the hospital administrator, and the director of nursing services, with little or no consultation with lower-level managers. This top-down approach leaves the implementers without autonomy or the right to appropriate or control expenses.\n2. Decentralized budgets: more health agencies recognize the value of budgets prepared by those who must implement them. The first-level manager (head nurse) becomes actively involved in planning and budgeting, and autonomy, accountability, and authority are placed at the practitioner level.","terms":[["Budget","وصف رقمي للإيرادات المتوقعة والنفقات المخططة للمنظمة لفترة زمنية محددة.","A numerical description of expected income and planned expenditures for a specified period of time."],["Budgeting","النشاط الأساسي لإعداد الموازنة.","The activity of preparing a budget."],["Variance analysis","مقارنة البيانات المخططة بالفعلية.","The comparison of planned and actual data."],["Fiscal-year budget","دورة موازنة مدتها 12 شهراً قد لا توافق السنة التقويمية.","A budgeting cycle set for 12 months that may not match the calendar year."],["Personnel budget","أكبر موازنة في الرعاية الصحية، وتشمل وقت العمل الفعلي وغير الفعلي.","The largest budget in healthcare, covering productive and non-productive time."],["Operating budget","نفقات تتغير مع حجم الخدمة مثل الكهرباء والصيانة والمستلزمات.","Expenses that change in response to the volume of service, such as electricity, repair, maintenance, and supplies."],["Capital budget","موازنة المعدات الرئيسية والمباني ذات العمر الطويل.","Budget for major equipment and buildings with a long life."],["Cash budget","خطة المقبوضات والمدفوعات النقدية الشهرية.","The operating plan for monthly cash receipts and disbursements."],["Decentralized budget","موازنة يعدها من سينفذونها، ويشارك فيها مدير المستوى الأول.","A budget prepared by those who implement it, with first-level manager involvement."]],"questions":[{"ar":"ما التعريف الصحيح للموازنة (Budget) في الكتاب؟","en":"What is the book's definition of a budget?","whyAr":"الموازنة وصف رقمي للإيرادات المتوقعة والنفقات المخططة لفترة زمنية محددة.","whyEn":"A budget is a numerical description of expected income and planned expenditures for a specified period.","optionsAr":["خطة تقديرية لتوزيع الموارد المالية على الأنشطة","تقرير دوري عن المصروفات الفعلية فقط","وصف رقمي للإيرادات المتوقعة والنفقات المخططة لفترة زمنية محددة","خطة مشتريات للمستلزمات دون تقدير الإيرادات"],"optionsEn":["An estimated plan for allocating financial resources to activities","A periodic report of actual expenses only","A numerical description of expected income and planned expenditures for a specified period","A supply purchasing plan without estimating revenue"],"correct":2},{"ar":"ما اسم نشاط إعداد الموازنة؟","en":"What is the activity of preparing a budget called?","whyAr":"النشاط الأساسي لإعداد الموازنة يسمى Budgeting.","whyEn":"Primarily, the activity of preparing a budget is called budgeting.","optionsAr":["Budgeting","Directing","Staffing","Controlling"],"optionsEn":["Budgeting","Directing","Staffing","Controlling"],"correct":0},{"ar":"أي مما يلي من أغراض الموازنة؟","en":"Which is a purpose of the budget?","whyAr":"من أغراضها وضع حدود لتكاليف التشغيل وأنها تحوّل الخطط إلى أرقام.","whyEn":"One purpose is to set operating cost limits; it quantifies plans.","optionsAr":["تقدير الموارد المطلوبة لتنفيذ الخطط","توزيع الموارد وفق الأولويات المعتمدة","تحديد حدود لتكاليف التشغيل وتحويل الخطط إلى أرقام","مقارنة النفقات الفعلية بالتقديرات"],"optionsEn":["Estimating resources needed to implement plans","Allocating resources according to approved priorities","Setting operating cost limits and quantifying plans","Comparing actual expenditures with estimates"],"correct":2},{"ar":"كم وظيفة للموازنة ذكرها الكتاب؟","en":"How many functions of budgets does the book list?","whyAr":"الوظائف: التخطيط والتنسيق والتحفيز والرقابة والتواصل.","whyEn":"The functions are planning, coordination, motivation, control, and communication.","optionsAr":["أربع","خمس","سبع","ثلاث"],"optionsEn":["Four","Five","Seven","Three"],"correct":1},{"ar":"مقارنة البيانات المخططة بالبيانات الفعلية تسمى…","en":"Comparing planned data with actual data is called…","whyAr":"الكتاب يسمي هذه المقارنة تحليل الانحراف.","whyEn":"The book calls this comparison variance analysis.","optionsAr":["التسويف","التفويض","التقسيم الإداري","تحليل الانحراف (Variance analysis)"],"optionsEn":["Procrastination","Delegation","Departmentation","Variance analysis"],"correct":3},{"ar":"أي وظيفة للموازنة تجعل العاملين مسؤولين عن الأداء المالي عند مشاركتهم في إعدادها؟","en":"Which budget function holds employees accountable for financial performance when they take part in it?","whyAr":"مشاركة العاملين تمكّنهم لأنها تجعلهم مسؤولين عن الأداء المالي.","whyEn":"Involvement empowers employees by holding them accountable for financial performance.","optionsAr":["التواصل","التخطيط","التنسيق","التحفيز (Motivation)"],"optionsEn":["Communication","Planning","Coordination","Motivation"],"correct":3},{"ar":"أي مما يلي من مخاطر عدم وجود موازنة؟","en":"Which is a risk of not budgeting?","whyAr":"من المخاطر الست: عدم وجود صندوق للطوارئ.","whyEn":"Not having an emergency fund is one of the six risks listed.","optionsAr":["زيادة صعوبة التنبؤ بتكاليف التشغيل عند غياب خطة مالية معتمدة","صعوبة تحديد أولويات الإنفاق بين احتياجات الوحدات المختلفة","عدم وجود صندوق للطوارئ","ضعف القدرة على ضبط المصروفات ومقارنة الفعلي بالمخطط"],"optionsEn":["Easier access to loans","Automatic profit increase","Not having an emergency fund","Automatic debt reduction"],"correct":2},{"ar":"ما الخطوة الأولى في عملية الموازنة؟","en":"What is the first step in the budgetary process?","whyAr":"الخطوة الأولى هي تقييم ما يجب أن تغطيه الموازنة، ثم الخطة، ثم التنفيذ، ثم التقييم.","whyEn":"Step 1 assesses what needs to be covered, then plan, implementation, and evaluation.","optionsAr":["التقييم","التنفيذ","صرف النقدية","تقييم ما يجب أن تغطيه الموازنة"],"optionsEn":["Evaluation","Implementation","Disbursing cash","Assess what needs to be covered in the budget"],"correct":3},{"ar":"دورة موازنة مدتها 12 شهراً تسمى…","en":"A budgeting cycle set for 12 months is called a…","whyAr":"الكتاب يسميها موازنة السنة المالية، وقد لا توافق السنة التقويمية.","whyEn":"The book calls it a fiscal-year budget, which may not match the calendar year.","optionsAr":["موازنة السنة المالية (Fiscal-year budget)","موازنة مركزية","موازنة رأس المال","موازنة نقدية"],"optionsEn":["Fiscal-year budget","Centralized budget","Capital budget","Cash budget"],"correct":0},{"ar":"أي مما يلي ليس من خصائص الموازنة الفعالة؟","en":"Which is NOT a characteristic of an effective budget?","whyAr":"الموازنة الفعالة مبنية على عوامل يمكن التحكم فيها.","whyEn":"An effective budget is based on controllable factors.","optionsAr":["بسيطة ومرنة","عادلة وموضوعية","مبنية على عوامل لا يمكن التحكم فيها","موجهة نحو النتائج"],"optionsEn":["Simple and flexible","Fair and objective","Based on uncontrollable factors","Outcome oriented"],"correct":2},{"ar":"أي موازنة هي الأكبر في الرعاية الصحية لأنها كثيفة العمالة؟","en":"Which budget is the largest in healthcare because it is labor intensive?","whyAr":"موازنة القوى العاملة هي الأكبر لأن الرعاية الصحية كثيفة العمالة.","whyEn":"The personnel budget is the largest because healthcare is labor intensive.","optionsAr":["موازنة القوى العاملة (Personnel)","موازنة التشغيل","الموازنة النقدية","موازنة رأس المال"],"optionsEn":["Personnel budget","Operating budget","Cash budget","Capital budget"],"correct":0},{"ar":"في موازنة القوى العاملة، وردية 8.5 ساعة فيها استراحة غداء 30 دقيقة واستراحتان كل منهما 15 دقيقة. كم ساعة إنتاجية؟","en":"In the personnel budget, an 8.5-hour shift has a 30-minute lunch and two 15-minute breaks. How many productive hours?","whyAr":"يعمل الموظف 7.5 ساعة إنتاجية ولديه ساعة غير إنتاجية.","whyEn":"The employee works 7.5 productive hours with 1 hour of non-productive time.","optionsAr":["8 ساعات","7.5 ساعة","6 ساعات","8.5 ساعة"],"optionsEn":["8 hours","7.5 hours","6 hours","8.5 hours"],"correct":1},{"ar":"وحدة تريد توفير الكهرباء والصيانة والمستلزمات اليومية. أي موازنة تخصها؟","en":"A unit needs daily electricity, maintenance, and supplies. Which budget covers this?","whyAr":"موازنة التشغيل تعكس النفقات التي تتغير مع حجم الخدمة مثل الكهرباء والصيانة.","whyEn":"The operating budget reflects expenses that change with volume of service, like electricity and maintenance.","optionsAr":["موازنة القوى العاملة","الموازنة المركزية","موازنة التشغيل (Operating)","موازنة رأس المال"],"optionsEn":["Personnel budget","Centralized budget","Operating budget","Capital budget"],"correct":2},{"ar":"أي موازنة توصف بأنها شريان الحياة للمنظمة وهي خطة المقبوضات والمدفوعات النقدية الشهرية؟","en":"Which budget is called the life blood of an organization, the plan for monthly cash receipts and disbursements?","whyAr":"الموازنة النقدية هي شريان الحياة، وبقاء المنظمة يعتمد على سداد الفواتير في موعدها.","whyEn":"The cash budget is the life blood; survival depends on paying bills on time.","optionsAr":["موازنة التشغيل","موازنة القوى العاملة","الموازنة النقدية (Cash budget)","موازنة رأس المال"],"optionsEn":["Operating budget","Personnel budget","Cash budget","Capital budget"],"correct":2},{"ar":"في الموازنة اللامركزية (Decentralized)، من يشارك فعلياً في التخطيط والموازنة؟","en":"In a decentralized budget, who actively takes part in planning and budgeting?","whyAr":"في اللامركزية يشارك المدير من المستوى الأول وتوضع السلطة والمساءلة عند مستوى الممارس.","whyEn":"In decentralization the first-level manager is involved and authority and accountability sit at the practitioner level.","optionsAr":["المراقب المالي وحده","لا أحد","المدير من المستوى الأول (رئيسة التمريض)","مدير المستشفى وحده"],"optionsEn":["The controller alone","No one","The first-level manager (head nurse)","The hospital administrator alone"],"correct":2}]},{"id":14,"ar":"الرقابة","en":"Controlling","pages":"232–257","summaryAr":"تعريف الرقابة وأهميتها وخصائصها وقيودها، وخطوات عملية الرقابة الأربع، وأنواعها (الارتجاعية والمتزامنة والتنبؤية)، وصفات نظام الرقابة الفعال، وأساليبها، ودور مدير التمريض.","summaryEn":"Definition, importance, features, and limitations of controlling, the four steps of the control process, its types (feedback, concurrent, feed-forward), characteristics of an effective control system, methods of controlling, and the nurse manager's role.","textAr":"مقدمة: الرقابة (Controlling) إحدى الوظائف الأساسية للإدارة إلى جانب التخطيط والتنظيم والتوظيف والقيادة. ومن خلالها يضمن المديرون استخدام الموارد بكفاءة وبقاء الأداء متوافقاً مع الأهداف الاستراتيجية ومعالجة المشكلات المحتملة سريعاً. وهي وظيفة مستمرة وديناميكية تحافظ على النظام والمساءلة وتدفع التحسين والتكيف مع التغيرات الداخلية والخارجية.\n\nتعريف الرقابة: هي عملية مراقبة الأنشطة للتأكد من إنجازها كما هو مخطط وتصحيح أي انحرافات كبيرة. وتشمل مراقبة أنشطة المنظمة ومقارنة الأداء الفعلي بالمعايير الموضوعة وتحديد الانحرافات واتخاذ إجراءات تصحيحية لضمان تحقيق الأهداف بفعالية.\n\nأهمية الرقابة (Importance of controlling): 1. تحفز العاملين، فهي لا تعني إصدار الأوامر فقط بل أن يرشد المدير موظفيه ويساعدهم عند الحاجة. 2. تحقق الاستخدام الكفء للموارد. 3. تضمن تنسيق الأعمال بين الأقسام المختلفة، فغياب التنسيق قد يضيع موارد كثيرة. 4. تساعد على الحكم الصحيح على المعايير، فالمعايير لا تُحدد بالحدس بل بتحليل أداء المشاريع السابقة وظروف السوق والموارد المتاحة وقدرة المنظمة. 5. تساعد على تحقيق أهداف المنظمة. 6. تحسّن أداء العاملين، فالمتابعة المستمرة تخلق جواً من النظام والانضباط وتضمن وعيهم بواجباتهم ومسؤولياتهم بوضوح. 7. تقلل الأخطاء، فالأخطاء الصغيرة المتكررة قد تصبح كارثة، والرقابة الفعالة تكتشف الخطأ في وقته وتتخذ خطوات علاجية.\n\nخصائص الرقابة (Features): 1. وظيفة موجهة نحو الهدف، تضمن توافق اتجاهات الأفراد والمجموعات مع الخطط قصيرة وطويلة المدى. 2. وظيفة شاملة (all pervasive) تنطبق على كل أنواع المنظمات وكل المستويات الإدارية. 3. وظيفة مستمرة، فهي ليست نشاطاً لمرة واحدة بل عملية ديناميكية تحلل الأداء الفعلي والمخطط وتصحح الانحرافات. 4. تنظر إلى الخلف وإلى الأمام: فتحلل الأداء السابق، ثم تتخذ إجراءات علاجية لتحسين المستقبل. 5. عملية ديناميكية تتطلب تغييرات حيثما أمكن. 6. عملية إيجابية؛ فبحسب جورج تيري هدفها أن تجعل الأشياء تحدث لتحقيق الهدف ضمن القيود المحددة، وهي ضرورة وعون للمدير وليست عقبة.\n\nقيود الرقابة (Limitations): 1. نطاق محدود، فقد لا تعالج القضايا الاستراتيجية الأوسع أو تغيرات البيئة الخارجية. 2. مخاوف أخلاقية، كالمراقبة التي تنتهك خصوصية العاملين وتضر بسمعة المنظمة. 3. صعوبة وضع معايير كمية لسلوك الإنسان ومستوى الكفاءة والرضا الوظيفي والروح المعنوية، فيعتمد التقدير على تقدير المدير. 4. لا يمكن التحكم في العوامل الخارجية كسياسة الحكومة والتغيرات التكنولوجية وسياسة المنافسين. 5. مقاومة العاملين، فهم يشعرون أنها تحد من حريتهم وقد يرفضون استخدام الكاميرات. 6. مكلفة، تتطلب وقتاً وجهداً ومبالغ كبيرة، ويجب أن تفوق فوائدها تكلفتها.\n\nعملية الرقابة (Process of controlling): هي دورة منهجية ومستمرة تضمن تحقيق الأهداف بكفاءة وفعالية، وخطواتها:\nأ. وضع المعايير (Establishing standards): تحديد الهدف المطلوب بلوغه، والمعايير هي محكّات الأداء، ويمكن أن تكون كمية أو نوعية، ويجب أن تكون مرنة بما يكفي لتعديلها عند الحاجة. وينبغي أن تكون SMART: S بسيطة التعبير (Simply expressed)، M قابلة للقياس (Measurable)، A قابلة للتحقيق (Attainable)، R معقولة (Reasonable)، T محددة بزمن (Time bounded).\nب. قياس الأداء الفعلي (Measuring actual performance): يقيس المديرون الأداء الفعلي لتحديد الانحرافات عن المعيار. ويُقاس أداء الموظف مقابل الهدف. وكلما ارتفع مستوى الإدارة صعب قياس الأداء.\nج. مقارنة الأداء المقاس بالمعايير: مقارنة بين \"ما هو كائن\" و\"ما يجب أن يكون\". فإن كانت النتائج مقبولة فلا إجراء، وإن اتجهت نحو غير المقبول يلزم إجراء. والفرق بين الاثنين يسمى الانحراف (deviation).\nد. اتخاذ الإجراءات التصحيحية (Taking corrective actions): يبادر بها المدير لتصحيح أي قصور، لتتوافق أنشطة المنظمة مع الخطة. وتعتمد على ثلاثة أشياء: المعيار، ودقة القياسات التي حددت وجود الانحراف، وتشخيص الشخص أو الأداة التي تبحث سبب الانحراف. وقد تحدد الإدارة الإجراءات مسبقاً بالسياسات والإجراءات والممارسات، وقد يكون بعضها آلياً، وبعضها يستلزم استثناء من السياسة. ومن أمثلتها: تغيير الاستراتيجية أو الهيكل أو ممارسات التعويض، وبرامج التدريب، وإعادة تصميم الوظائف، وفصل الموظفين.\n\nأنواع الرقابة (Types of controlling):\n1. الرقابة الارتجاعية (Feedback Control): جمع معلومات عن مهمة انتهت وتقييمها لتحسين المهام المماثلة مستقبلاً. وهي رقابة بعد الأداء تركز على النتائج النهائية، وتتبعها تعديلات وتصحيحات.\n2. الرقابة المتزامنة (Concurrent control): وتسمى رقابة الوقت الفعلي أو أثناء العملية أو التوجيهية (steering). تفحص المشكلة وتتخذ الإجراء قبل وقوع خسارة.\n3. الرقابة التنبؤية أو الاستباقية (Predictive / Feed-forward control): تتنبأ بالمشكلة قبل حدوثها لاتخاذ إجراء قبل نشوء الظرف. وهي موجهة نحو المستقبل وتكشف الانحرافات وتتوقعها، وتركز على تهيئة ظروف تجعل الانحراف عن المعايير صعباً أو مستحيلاً. ومن أمثلتها الوصف الوظيفي ومواصفات الوظيفة والتعريف بالعمل والتوجيه.\n\nنظم الرقابة وخصائص النظام الفعال: مجموع الرقابة الارتجاعية والمتزامنة والتنبؤية يكوّن \"حزمة\" أو \"نظاماً\"، والنظام هو مزيج من اثنتين أو أكثر. ويتصف النظام الفعال بأنه: مناسب (Suitable) لاحتياجات المنظمة، وبسيط (Simple) سهل الفهم والتشغيل، وذو جدوى اقتصادية (Economic feasibility) بمقارنة التكاليف بالفوائد، ودقيق (Accuracy) بمعلومات مفيدة ودقيقة، ومتطلع إلى الأمام (Forward looking) يوفر معلومات في الوقت المناسب عن الانحرافات.\n\nأساليب الرقابة (Methods of controlling): 1. الإشراف والملاحظة المباشرة، وهي أقدم الأساليب. 2. القوائم المالية، كحساب الأرباح والخسائر والميزانية العمومية. 3. الرقابة بالموازنة (Budgetary control): استخدام الموازنات لمقارنة الأداء الفعلي بالمخطط لاكتشاف الانحرافات. 4. الإدارة بالأهداف (MBO)، ومن متطلباتها أن يحدد الرئيس والمرؤوس معاً أهداف الفرد، وتقييم دوري وتغذية راجعة منتظمة، وأن يجلب تحقيق الأهداف مكافآت. 5. التدقيق الإداري (Management audit): تقييم مستقبلي ومستقل ومنهجي لأنشطة الإدارة على كل المستويات. 6. نظام المعلومات الإدارية (MIS): معلومات دقيقة عن الأداء الداخلي والبيئة الخارجية، وتُجمع باستمرار. 7. الرقابة الذاتية (Self-Control): يُمنح الشخص حرية وضع أهدافه وتقييم أدائه واتخاذ الإجراء التصحيحي، وتلزم خاصة لكبار المديرين.\n\nدور مدير التمريض في الرقابة (Role of nurse manager): يجري تقييماً لأداء العاملين، ويشجع المرؤوسين على المشاركة الفعلية في عملية الرقابة، ويوصل معايير الرعاية المتوقعة بوضوح، ويطبق الرقابة استباقياً لا رد فعل، ويستخدمها لمعرفة سبب عدم تحقق الأهداف، ويفرّق بين المعايير السريرية ومعايير استخدام الموارد، ويدعم البحوث التي تحدد وتقيس، ويحصل على مصادر المعلومات المناسبة لجمع البيانات للرقابة، ويكون نشطاً في توصيل الرقابة.","textEn":"Introduction: controlling is one of the fundamental functions of management, alongside planning, organizing, staffing, and leading. Through it, managers ensure resources are used efficiently, performance remains aligned with strategic objectives, and potential problems are addressed promptly. As a continuous and dynamic function, it maintains order and accountability and drives improvement and adaptation to internal and external changes.\n\nDefinition: controlling is the process of monitoring activities to ensure that they are being accomplished as planned and correcting any significant variations. It involves monitoring organizational activities, comparing actual performance with established standards, identifying deviations, and taking corrective actions so goals are effectively achieved.\n\nImportance of controlling: 1. It motivates employees; it does not mean just giving orders, but guiding employees and helping them where needed. 2. It makes efficient use of resources. 3. It ensures coordination of action among departments; without coordination resources may be lost. 4. It helps in deciding the right judgment about standards, which cannot be set on intuition but by analyzing past projects, market conditions, available resources, and capacity. 5. It aids in accomplishing organizational goals. 6. It improves employee performance, creating order and discipline and making sure employees know their duties and responsibilities clearly. 7. It minimizes errors; small repeated errors can become a disaster, and effective control detects errors on time and takes remedial steps.\n\nFeatures of controlling: 1. A goal oriented function that keeps individuals and groups consistent with short- and long-range plans. 2. An all-pervasive function applicable to all types of organizations and all managerial levels. 3. A continuous function, not a one-time activity but a dynamic process of constant analysis of actual and planned performance. 4. Both backward looking and forward looking: past performance is analyzed, then remedial action improves future performance. 5. A dynamic process that requires changes wherever possible. 6. A positive process; George Terry says its function is to make things happen, a managerial necessity and a help, not a hindrance.\n\nLimitations of controlling: 1. Limited scope; it may not address broader strategic issues or external changes. 2. Ethical concerns, such as surveillance that infringes on employee privacy and harms reputation. 3. Difficulty setting quantitative standards for human behavior, efficiency level, job satisfaction, and morale, so judgment depends on the manager's discretion. 4. No control over external factors such as government policy, technological change, or competitors' policy. 5. Resistance from employees, who feel it curtails their freedom and may oppose cameras. 6. A costly affair requiring time, effort, and large spending; benefits must exceed the cost.\n\nProcess of controlling: a systematic and continuous cycle that helps ensure goals are achieved efficiently and effectively. Its steps:\nA. Establishing standards: setting the target to be achieved. Standards are the criteria of performance, can be quantitative or qualitative, and should be flexible enough to be modified when required. They should be SMART: S Simply expressed, M Measurable, A Attainable, R Reasonable, T Time bounded.\nB. Measuring actual performance: managers measure actual performance to determine variations from standard. The employee's performance is measured against the target. With increasing management levels, measurement becomes more difficult.\nC. Comparing measured performance to established standards: a comparison between what is and what should be. If results are acceptable, no action is needed; if they trend away from acceptable, action may be called for. The difference between what is and what should be is the deviation.\nD. Taking corrective actions: initiated by the manager to correct defects so performance conforms to the plan. It depends on three things: the standard, the accuracy of the measurements that determined a deviation exists, and the diagnosis of the person or device investigating the cause. Corrective actions can be prescribed in advance through policies, procedures, and practices; some are automatic; some take exception to established policy. Examples: changing strategy, changing structure, compensation practices, training programs, redesigning jobs, and firing employees.\n\nTypes of controlling:\n1. Feedback control: collecting information about a finished task, assessing it, and improving the same type of tasks in the future. These post-performance controls focus on end results, and adjustments follow the feedback input.\n2. Concurrent control: also called real-time, in-process, or steering control. It checks any problem and takes action before any loss is incurred.\n3. Predictive / feed-forward control: foresees problems ahead of occurrence so action can be taken before the circumstance arises. It is future directed, detecting and anticipating deviations, and focuses on establishing conditions that make deviations from norms difficult or impossible. Examples include job descriptions, job specifications, inductions, and orientation.\n\nControl systems and effective systems: the composite of feedback, concurrent, and feed-forward controls make up a package or system, a combination of any two or more controls. An effective control system is suitable to the organization's needs, simple, economically feasible (benefits compared to costs), accurate (useful and accurate information), and forward looking (timely information on deviations).\n\nMethods of controlling: 1. Direct supervision and observation, the oldest method. 2. Financial statements, such as the profit and loss account and the balance sheet. 3. Budgetary control: using budgets to compare actual performance with budgeted performance to find deviations. 4. Management by objectives (MBO): objectives are jointly fixed by superior and subordinate, with periodic evaluation and regular feedback, and achievement brings rewards. 5. Management audit: a future-oriented, independent, systematic evaluation of the activities of all levels of management. 6. Management information system (MIS): accurate information about internal working and the external environment, collected continuously. 7. Self-control: a person sets his own targets, evaluates his performance, and takes corrective measures; especially needed for top-level managers.\n\nRole of the nurse manager for controlling: gives employees job performance evaluations; encourages followers to be actively involved in the control process; clearly communicates expected standards of care; implements control proactively instead of reactively; uses control to determine why goals were not met; differentiates between clinical standards and resource utilization standards; supports research efforts to identify and measure; accesses appropriate sources of information for data gathering; and is politically active in communicating control.","terms":[["Controlling","مراقبة الأنشطة للتأكد من إنجازها كما هو مخطط وتصحيح الانحرافات الكبيرة.","Monitoring activities to ensure they are accomplished as planned and correcting significant variations."],["Standards","محكّات الأداء، ويمكن أن تكون كمية أو نوعية، ويجب أن تكون SMART.","Criteria of performance, quantitative or qualitative, and should be SMART."],["Deviation","الفرق بين ما هو كائن وما يجب أن يكون.","The difference between what is and what should be."],["Feedback control","رقابة بعد انتهاء المهمة تركز على النتائج النهائية.","Post-performance control focused on end results."],["Concurrent control","رقابة أثناء العملية تتخذ الإجراء قبل وقوع خسارة.","In-process (real-time) control that acts before any loss is incurred."],["Feed-forward control","رقابة استباقية تتنبأ بالمشكلة قبل حدوثها.","Preventive control that foresees problems before they occur."],["Budgetary control","استخدام الموازنات لمقارنة الأداء الفعلي بالمخطط.","Using budgets to compare actual with budgeted performance."],["Management audit","تقييم مستقبلي ومستقل ومنهجي لأنشطة الإدارة على كل المستويات.","A future-oriented, independent, systematic evaluation of management activities at all levels."],["Self-control","رقابة ذاتية يضع فيها الشخص أهدافه ويقيّم أداءه.","The person sets his own targets and evaluates his own performance."]],"questions":[{"ar":"ما التعريف الصحيح للرقابة (Controlling)؟","en":"What is the correct definition of controlling?","whyAr":"الكتاب يعرّفها بأنها عملية مراقبة الأنشطة وتصحيح أي انحرافات كبيرة.","whyEn":"The book defines it as monitoring activities and correcting any significant variations.","optionsAr":["تعيين الموظفين الجدد","مراقبة الأنشطة للتأكد من إنجازها كما هو مخطط وتصحيح الانحرافات الكبيرة","تقسيم الأنشطة إلى أقسام","تحديد أجور العاملين"],"optionsEn":["Hiring new employees","Monitoring activities to ensure they are accomplished as planned and correcting significant variations","Dividing activities into departments","Determining employee wages"],"correct":1},{"ar":"لماذا تساعد الرقابة على تقليل الأخطاء؟","en":"Why does controlling help minimize errors?","whyAr":"الأخطاء الصغيرة المتكررة قد تصبح كارثة، والرقابة الفعالة تكتشفها في وقتها.","whyEn":"Small repeated errors can become a disaster; effective control detects them on time.","optionsAr":["لأنها تزيد الحاجة إلى التوثيق دون تحسين توقيت اكتشاف الانحرافات","لأنها تركز على النتائج النهائية فقط ولا تتابع الأداء أثناء التنفيذ","لأنها تعتمد على التقييم الشخصي بدلًا من مؤشرات الأداء المحددة","لأن المتابعة المستمرة تكتشف الخطأ في وقته وتتخذ خطوات علاجية"],"optionsEn":["Because it stops employees from working","Because it increases small errors","Because it removes the need for standards","Because continuous monitoring detects errors on time and takes remedial steps"],"correct":3},{"ar":"أي مما يلي من خصائص الرقابة؟","en":"Which is a feature of controlling?","whyAr":"الرقابة مستمرة وشاملة وتنظر إلى الخلف وإلى الأمام وهي عملية إيجابية.","whyEn":"Control is continuous, all-pervasive, backward and forward looking, and positive.","optionsAr":["وظيفة تُمارس عند ظهور الانحرافات فقط","وظيفة تركز على النتائج السابقة دون مؤشرات مستقبلية","وظيفة تقتصر على اكتشاف الأخطاء بعد وقوعها","وظيفة مستمرة وليست نشاطاً لمرة واحدة"],"optionsEn":["A function performed only when deviations appear","A function focused on past results without forward-looking indicators","A function limited to detecting errors after they occur","A continuous function, not a one-time activity"],"correct":3},{"ar":"أي من القيود التالية ذكره الكتاب للرقابة؟","en":"Which limitation of controlling does the book list?","whyAr":"من القيود صعوبة وضع معايير كمية للسلوك والكفاءة والرضا والروح المعنوية.","whyEn":"One limitation is the difficulty of quantitative standards for behavior, efficiency, satisfaction, and morale.","optionsAr":["أنها تضمن عدم حدوث مقاومة من العاملين عند تطبيق المعايير","أن تكلفة تطبيقها ثابتة ولا تتأثر بحجم الوحدة أو نظام المتابعة","أن العاملين يتقبلونها دائمًا دون حاجة إلى شرح أو مشاركة","صعوبة وضع معايير كمية لسلوك الإنسان والروح المعنوية"],"optionsEn":["It guarantees that staff will not resist the implementation of standards","Its implementation cost never changes with unit size or monitoring systems","Staff always accept it without explanation or participation","Difficulty setting quantitative standards for human behavior and morale"],"correct":3},{"ar":"كم خطوة في عملية الرقابة حسب الكتاب؟","en":"How many steps are in the controlling process?","whyAr":"الخطوات: وضع المعايير، قياس الأداء الفعلي، المقارنة، اتخاذ الإجراء التصحيحي.","whyEn":"Steps: establish standards, measure actual performance, compare, take corrective action.","optionsAr":["أربع","ثمان","ست","ثلاث"],"optionsEn":["Four","Eight","Six","Three"],"correct":0},{"ar":"ما الخطوة الأولى في عملية الرقابة؟","en":"What is the first step in the controlling process?","whyAr":"تبدأ الدورة بوضع المعايير، وهي محكّات الأداء.","whyEn":"The cycle begins by establishing standards, the criteria of performance.","optionsAr":["وضع المعايير (Establishing standards)","قياس الأداء الفعلي ومقارنته بالمعايير المعتمدة","قياس الأداء الفعلي","اتخاذ الإجراء التصحيحي"],"optionsEn":["Establishing standards","Measuring actual performance and comparing it with approved standards","Measuring actual performance","Taking corrective action"],"correct":0},{"ar":"في الحرف T من كلمة SMART للمعايير، ماذا يعني؟","en":"In SMART standards, what does T stand for?","whyAr":"S بسيطة التعبير، M قابلة للقياس، A قابلة للتحقيق، R معقولة، T محددة بزمن.","whyEn":"S Simply expressed, M Measurable, A Attainable, R Reasonable, T Time bounded.","optionsAr":["Target","Time bounded (محددة بزمن)","Trackable","Tangible"],"optionsEn":["Target-based","Time bounded","Traceable","Tangible"],"correct":1},{"ar":"يسمى الفرق بين \"ما هو كائن\" و\"ما يجب أن يكون\"…","en":"The difference between what is and what should be is known as…","whyAr":"الكتاب يسمي هذا الفرق الانحراف.","whyEn":"The book calls this difference the deviation.","optionsAr":["الانحراف (Deviation)","المعيار","المساءلة","الموازنة"],"optionsEn":["Deviation","Standard","Accountability","Budget"],"correct":0},{"ar":"على أي شيء تعتمد خطوة الإجراء التصحيحي؟","en":"On what does the
