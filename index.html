<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>ZY Academy | أكاديمية إدارة التمريض</title>
<style>
:root{--bg:#f7f4ff;--sf:#fff;--sr:#ece8ff;--tx:#25234a;--su:#6a6890;--ln:#e0daf5;--ac:#5b4bc4;--on:#fff;--gd:#b8650f;--ok:#1b9e5a;--bad:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14122b;--sf:#1d1a3d;--sr:#262250;--tx:#f1eeff;--su:#aaa6d6;--ln:#35306a;--ac:#9d8cff;--on:#1b1740;--gd:#ffb86b}}
:root[data-theme=dark]{--bg:#14122b;--sf:#1d1a3d;--sr:#262250;--tx:#f1eeff;--su:#aaa6d6;--ln:#35306a;--ac:#9d8cff;--on:#1b1740;--gd:#ffb86b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;padding-bottom:78px;max-width:760px;margin:auto}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;letter-spacing:1px}.logo small{display:block;font-size:11px;color:var(--su);font-weight:500;letter-spacing:0}
.hb{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.ib,.chip{min-height:44px;min-width:44px;border:1px solid var(--ln);background:var(--sr);border-radius:99px;padding:0 12px;font-size:14px;font-weight:600}
.xp{background:var(--gd);color:#1b1740;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
main{padding:14px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:25px;line-height:1.35;margin:4px 0 8px}h2{font-size:20px;margin:0 0 8px}h3{font-size:17px;margin:0 0 6px}em{color:var(--ac);font-style:normal}.su{color:var(--su);font-size:14px}
.cta{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--ac);color:var(--on);font-weight:700;margin-top:10px}
.cta.alt{background:var(--sr);color:var(--tx);border:1px solid var(--ln)}
.ch{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px}
.ch .n{flex:none;width:46px;height:46px;border-radius:14px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:800}
.ch.lock{opacity:.6}.ch.lock .n{background:var(--sr);color:var(--su)}.ch b{display:block}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.para{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.para>div{white-space:pre-line;line-height:2}
.en{direction:ltr;text-align:left;color:var(--su);font-size:15px;line-height:1.8;margin:0 0 14px;white-space:pre-line}
.vid{background:var(--sr);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:14px 0}.vid iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}.vid a{color:var(--ac);display:inline-block;margin-top:6px}.vl{font-weight:700;color:var(--gd);margin-bottom:8px}
dt{font-weight:700;direction:ltr;text-align:start}dd{margin:0 0 10px;color:var(--su)}
.q{border-top:1px solid var(--ln);padding-top:14px;margin-top:14px}.q:first-child{border:0;margin:0;padding:0}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:start;min-height:52px;background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0}
.op i{font-style:normal;font-weight:700;color:var(--ac);width:22px;flex:none}.op.ok{border-color:var(--ok);background:rgba(27,158,90,.18)}.op.no{border-color:var(--bad);background:rgba(217,83,79,.18)}
.why{background:var(--sr);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--su);font-size:12px;font-weight:600}nav button.on{color:var(--ac)}
select,textarea{width:100%;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:10px;font:inherit;margin-bottom:10px}select{min-height:48px}textarea{min-height:130px;direction:ltr;font-size:13px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%;text-align:center}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.card,.ch,.q,.para,.vid{animation:up .5s ease both}.ch{transition:transform .2s}.ch:active{transform:scale(.98)}.op.ok{animation:pop .45s}.op.no{animation:shake .4s}.why{animation:up .4s both}.bar i{transition:width .6s}@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.why{line-height:1.8}.cta.alt{margin-inline-start:8px}

/* Achievement cabinet + original textbook library */
.badge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.badge-item{border:1px solid var(--ln);border-radius:16px;padding:12px 6px;text-align:center;background:var(--sf);min-width:0}
.badge-icon{font-size:32px;display:block;filter:grayscale(1);opacity:.28;transition:.3s}
.badge-item.unlocked .badge-icon{filter:none;opacity:1;animation:pop .5s}
.badge-item.locked .badge-icon{filter:grayscale(1);opacity:.18}
.badge-item b{display:block;font-size:12px;line-height:1.4;margin-top:5px}
.badge-item small{font-size:11px;color:var(--su)}
.book-frame{width:100%;height:min(72vh,780px);border:1px solid var(--ln);border-radius:12px;background:white}
.achievement-pop{border:1px solid var(--gd);background:var(--sr);border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.locked-exam-note{padding:12px;border:1px dashed var(--gd);border-radius:12px;color:var(--su);margin:10px 0}.grand-badge{border:2px solid #e3b341;background:linear-gradient(135deg,#3b2c65,#17142d);padding:18px;border-radius:18px;text-align:center}.grand-badge .medal{font-size:56px;filter:drop-shadow(0 0 8px #f8cf65)}

nav.open{display:block}nav button{min-width:0;font-size:12px}.navarrow{width:100%;min-height:50px;font-size:14px}nav.open .navarrow{border-bottom:1px solid var(--ln)}.navgrid{display:grid;grid-template-columns:repeat(3,1fr);max-height:60vh;overflow-y:auto}.navgrid button{min-height:64px;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.seg button{flex:1;min-height:44px;border:1px solid var(--ln);background:var(--sr);border-radius:12px;padding:0 8px;font-weight:600}.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tmv{font-size:52px;font-weight:800;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;margin:10px 0}
.row2{display:flex;gap:8px}.row2 .cta{margin-top:8px}
.wk{display:flex;gap:6px;align-items:flex-end;height:120px}.wk>div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.wk i{display:block;width:70%;background:var(--ac);border-radius:6px 6px 0 0}.wk b{font-size:12px}.wk small{font-size:10px;color:var(--su)}
.prow{padding:10px 0;border-top:1px solid var(--ln)}.prow:first-of-type{border:0}
.ringbar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--gd);color:#1b1740;padding:16px;text-align:center;font-size:18px}
.ringbar .cta{background:#1b1740;color:#fff}
</style>

<script>
const BOOK_ID='1Eq10GYtyQOYpakydnWwTmgb661wR-vx9';
const BOOK_PREVIEW_URL=`https://drive.google.com/file/d/${BOOK_ID}/preview`;
const BOOK_OPEN_URL=`https://drive.google.com/file/d/${BOOK_ID}/view?usp=sharing`;
const BOOK_DOWNLOAD_URL=`https://drive.google.com/uc?export=download&id=${BOOK_ID}`;
const BASE=[{"id":1,"ar":"مقدمة في القيادة وعملية الإدارة","en":"Introduction to Leadership & Management","pages":"7–18","summaryAr":"تعرّف على أساسيات الإدارة، والفرق بين الإدارة العليا والتنفيذية، ومستويات الإدارة الثلاثة ودور رئيسة التمريض.","summaryEn":"Explore administration, management, the three management levels, and the role of the head nurse.","textAr":"الإدارة (Administration): هي العملية المعنية بتحديد الأهداف، والأهداف العامة، والسياسات، والخطط التي تعمل المنظومة وإدارتها من خلالها. تعتبر الإدارة أكثر شمولاً وتشمل أنشطة وضع الأهداف والفلسفة وصياغة السياسات، وتتم في المستوى الأعلى للمنظمة.\n\nالإدارة التنفيذية (Management): هي عملية اجتماعية وتقنية تستخدم الموارد والمنشآت وتؤثر على السلوك البشري لتحقيق أهداف المنظمة. توفر الإدارة وسائل ترجمة الفلسفة الإدارية والخطط إلى واقع ملموس.\n\nإدارة التمريض (Nursing Management): هي عملية العمل من خلال طاقم التمريض لتقديم الرعاية والعلاج والراحة للعملاء والمرضى.\n\nمستويات الإدارة (Management Levels):\n1. الإدارة العليا: يتخذون القرارات الكبرى التي تؤثر على حاضر ومستقبل المنظمة، مثل مدير خدمات التمريض.\n2. الإدارة الوسطى: مسؤولون عن مديري الخط الأول وحلقة الوصل مع الإدارة العليا، مثل مشرفات التمريض.\n3. إدارة الخط الأول: المسؤولية الأساسية هي إنتاج الرعاية التمريضية المطلوبة، مثل رئيسات التمريض (Head Nurses).","textEn":"Administration determines organizational objectives, philosophy, policies, and plans. It operates at the highest organizational level.\n\nManagement is a social and technical process that uses resources and facilities and influences human behavior to achieve organizational goals. It translates administrative philosophy and plans into practice.\n\nNursing management means working through nursing staff to provide care, cure, and comfort to clients and patients.\n\nManagement levels:\n1. Top-level managers make major decisions affecting the present and future of the organization, such as the Director of Nursing.\n2. Middle-level managers supervise first-line managers and connect them with top management, such as nurse supervisors.\n3. First-line managers focus on producing the required nursing care, such as head nurses.","terms":[["Administration","تحديد الأهداف والسياسات والخطط في أعلى هرم المنظمة.","Determining objectives, policies, and plans at the highest organizational level."],["Management","ترجمة الفلسفة الإدارية والخطط إلى واقع عملي.","Translating administrative philosophy and plans into practice."],["Head Nurse","مدير خط أول يربط الإدارة الوسطى بممرضات الرعاية.","A first-line manager linking middle management and staff nurses."]],"cover":"THE FOUNDATIONS","questions":[{"ar":"في وحدة ارتفعت فيها الأخطاء رغم التزام الممرضين بالتعليمات، أي تصرف يُظهر دور الإدارة الفعّال؟","en":"Errors increased in a unit despite staff following instructions. Which action best reflects effective management?","optionsAr":["لوم الموظفين فورًا","تحليل سير العمل والموارد ثم وضع إجراء تصحيحي","زيادة التقارير دون تحليل","تغيير جدول العمل عشوائيًا"],"optionsEn":["Immediately blame staff","Analyze workflow and resources, then implement corrective action","Increase reports without analysis","Randomly change the schedule"],"correct":1,"whyAr":"الإدارة الفعالة تحلل النظام والأسباب قبل اختيار تدخل قابل للقياس.","whyEn":"Effective management analyzes the system and causes before selecting a measurable intervention."},{"ar":"رئيسة التمريض تنسق المناوبات وتتابع الأداء اليومي وترفع المشكلات لمدير التمريض. ما المستوى الإداري الأقرب؟","en":"A head nurse coordinates shifts, monitors daily performance, and escalates issues to the nursing director. Which level is most appropriate?","optionsAr":["الإدارة العليا","الإدارة الوسطى","إدارة الخط الأول","جهة خارجية"],"optionsEn":["Top management","Middle management","First-line management","External body"],"correct":2,"whyAr":"الإشراف المباشر على العاملين والعمليات اليومية يميز إدارة الخط الأول.","whyEn":"Direct supervision of staff and daily operations characterizes first-line management."},{"ar":"أي موقف يوضح الفرق بين الكفاءة والفاعلية؟","en":"Which situation best distinguishes efficiency from effectiveness?","optionsAr":["تحقيق الهدف مع هدر موارد كبير","تقليل المستلزمات دون تحقيق الهدف","تحقيق هدف الرعاية باستخدام موارد مناسبة دون هدر غير ضروري","زيادة عدد الإجراءات بصرف النظر عن النتائج"],"optionsEn":["Achieving the goal with major waste","Reducing supplies without achieving the goal","Achieving the care goal with appropriate resources and minimal avoidable waste","Increasing procedures regardless of outcomes"],"correct":2,"whyAr":"الفاعلية تعني تحقيق الهدف، والكفاءة تعني استخدام الموارد بحكمة.","whyEn":"Effectiveness means achieving the goal; efficiency means using resources wisely."},{"ar":"تعارضت رغبة أحد العاملين مع سياسة سلامة المرضى. ما الأولوية الإدارية السليمة؟","en":"A staff member's preference conflicts with a patient-safety policy. What is the sound managerial priority?","optionsAr":["تفضيل رغبة الموظف لتجنب الخلاف","تجاهل السياسة عند ضغط العمل","تطبيق السياسة وشرح السبب وتوفير دعم عملي","ترك القرار للمرضى"],"optionsEn":["Favor the staff preference to avoid conflict","Ignore policy during workload pressure","Apply the policy, explain the rationale, and provide practical support","Leave the decision to patients"],"correct":2,"whyAr":"القيادة المسؤولة توازن التواصل مع الالتزام بمعايير السلامة.","whyEn":"Responsible leadership combines communication with adherence to safety standards."}]},{"id":2,"ar":"التخطيط وأدواته","en":"Planning & Planning Tools","pages":"19–33","summaryAr":"من الفكرة إلى التنفيذ: أنواع الخطط، وخصائص التخطيط الفعّال، وصياغة أهداف SMART قابلة للتحقيق.","summaryEn":"From ideas to action: plan types, effective planning, and achievable SMART objectives.","textAr":"التخطيط (Planning): هو عملية تقرير ما يجب أن يتم مقدمًا، وكيف، ومتى، وأين، وبواسطة من يتم إنجازه. وهو وظيفة إدارية أساسية تحدد أهداف المنظمة وتطور الطرق المختلفة لتحقيقها.\n\nأنواع الخطط:\n1. الخطط الاستراتيجية (Strategic Plan): خطط طويلة الأجل (5–10 سنوات) تشمل الأهداف العامة للمنظمة مع مراعاة العوامل البيئية الخارجية.\n2. الخطط التكتيكية (Tactical Plan): تهتم بتنفيذ الخطة الاستراتيجية وتستغرق عادة 1–3 سنوات.\n3. الخطط التشغيلية (Operational Plan): خطط يومية تستهدف الاستخدام الكفء للموارد المتاحة لتحقيق أهداف الوحدة.\n\nأهداف SMART: يجب أن يكون الهدف محددًا (Specific)، قابلًا للقياس (Measurable)، قابلًا للتحقيق (Attainable)، ذا صلة (Relevant)، ومحددًا بزمن (Time-based).","textEn":"Planning means deciding in advance what must be done, how, when, where, and by whom. It is a core management function that determines organizational objectives and develops ways to achieve them.\n\nTypes of plans:\n1. Strategic plans: long-term plans (5–10 years) covering overall organizational goals and external environmental factors.\n2. Tactical plans: plans implementing strategy, usually over 1–3 years.\n3. Operational plans: daily plans for efficient use of available resources to achieve unit objectives.\n\nSMART objectives are Specific, Measurable, Attainable, Relevant, and Time-based.","terms":[["Strategic Plan","خطة طويلة الأجل تغطي الأهداف العامة للمنظمة (5–10 سنوات).","A long-term plan covering overall organizational goals (5–10 years)."],["SMART Objectives","أهداف محددة، قابلة للقياس والتحقيق، ذات صلة ومحددة بزمن.","Specific, Measurable, Attainable, Relevant, and Time-based objectives."]],"cover":"PLAN WITH PURPOSE","questions":[{"ar":"وحدة تريد خفض تأخر إعطاء الأدوية 30% خلال 8 أسابيع. أي هدف أكثر قابلية للتقييم؟","en":"A unit wants to reduce delayed medication administration by 30% within 8 weeks. Which objective is most evaluable?","optionsAr":["تحسين إعطاء الأدوية قريبًا","تذكير الجميع بأهمية الوقت","خفض نسبة الجرعات المتأخرة 30% خلال 8 أسابيع باستخدام سجل التدقيق","تقليل التأخير قدر الإمكان"],"optionsEn":["Improve medication administration soon","Remind everyone that time matters","Reduce delayed doses by 30% within 8 weeks using an audit log","Reduce delays as much as possible"],"correct":2,"whyAr":"الهدف يحدد النتيجة والقياس والمدة وأداة المتابعة.","whyEn":"The objective specifies the outcome, measure, timeframe, and monitoring method."},{"ar":"توقّع عدد المرضى غير مستقر بسبب تغيرات موسمية. ما أفضل أساس للتخطيط؟","en":"Patient census is unstable because of seasonal changes. What is the best planning basis?","optionsAr":["الاعتماد على رقم الأسبوع الماضي فقط","استخدام الاتجاهات التاريخية مع سيناريوهات وتحديث الخطة دوريًا","إعداد خطة ثابتة لعام كامل دون مراجعة","تجاهل بيانات الإشغال"],"optionsEn":["Use only last week's number","Use historical trends and scenarios, then update the plan regularly","Keep one fixed annual plan without review","Ignore occupancy data"],"correct":1,"whyAr":"التخطيط في بيئة متغيرة يستفيد من البيانات والسيناريوهات والمراجعة.","whyEn":"Planning in a changing environment benefits from data, scenarios, and review."},{"ar":"ما العيب الأهم في خطة لا تحدد مسؤولًا أو موعدًا لكل إجراء؟","en":"What is the main weakness of a plan that assigns no owner or deadline to each action?","optionsAr":["أنها مفصلة أكثر من اللازم","يصعب مساءلة التنفيذ وقياس التقدم","أنها تمنع المرونة دائمًا","أنها تجعل الأهداف قابلة للقياس تلقائيًا"],"optionsEn":["It is too detailed","Implementation accountability and progress measurement become difficult","It always prevents flexibility","It automatically makes goals measurable"],"correct":1,"whyAr":"تحديد المسؤول والموعد يحول الخطة إلى إجراءات قابلة للمتابعة.","whyEn":"Assigning an owner and deadline makes actions trackable."},{"ar":"أظهرت مؤشرات الخطة انحرافًا بعد شهر. ما الخطوة الأنسب قبل تعديل الموارد؟","en":"Plan indicators show a deviation after one month. What is the best step before reallocating resources?","optionsAr":["إلغاء الخطة فورًا","التحقق من جودة البيانات وتحليل أسباب الانحراف مع الفريق","إخفاء المؤشر حتى نهاية السنة","زيادة الموارد لجميع الأنشطة بالتساوي"],"optionsEn":["Cancel the plan immediately","Validate data quality and analyze causes with the team","Hide the indicator until year-end","Increase resources equally for all activities"],"correct":1,"whyAr":"يجب التمييز بين خلل البيانات والسبب الحقيقي قبل اتخاذ إجراء تصحيحي.","whyEn":"Data problems must be distinguished from root causes before corrective action."}]},{"id":3,"ar":"حل المشكلات","en":"Problem Solving","pages":"34–46","summaryAr":"من تعريف المشكلة إلى أنواعها وطرق حلها، ثم خطوات عملية حل المشكلات السبع وأساليبها.","summaryEn":"From defining a problem to its types and methods, then the seven problem-solving steps and techniques.","textAr":"مقدمة: يواجه مديرو التمريض تحديات تتراوح بين شؤون رعاية المرضى والحفاظ على رضا الطاقم. وتساعد مهارات التفكير الناقد (Critical Thinking) الممرضين على اتخاذ قرارات مبنية على الحقائق والبيانات والأدلة لتحديد أفضل حل. والقادة الفعّالون يرون المشكلات فرصًا لا عقبات.\n\nالمشكلة (Problem): هي الفرق بين ما هو قائم وما يمكن أو يجب أن يكون، أو هي شيء يسبب صعوبة ويصعب التعامل معه.\nحل المشكلات (Problem Solving): مسؤولية المدير في تحديد طبيعة المشكلة ومدى اتساعها، واختيار الأسلوب المناسب للتعامل معها، وتوجيه المرؤوسين لاستخدامه.\n\nأنواع المشكلات الإدارية (Types of Managerial Problems):\n1. مشكلات جيدة التحديد (Structured): مألوفة وواضحة الهدف ومعلوماتها كاملة، وتحتاج قرارًا مبرمجًا (Programmed Decision) متكررًا يُعالج بأسلوب روتيني.\n2. مشكلات سيئة التحديد (Poorly Structured): جديدة أو غير معتادة ومعلوماتها غامضة أو ناقصة، وتحتاج قرارًا غير مبرمج (Non-Programmed Decision) فريدًا بحل مفصّل لها.\n3. المشكلات الطارئة (Crises): أحداث غير متوقعة شديدة التعطيل تتطلب إجراءً فوريًا، مثل الكوارث الطبيعية والحوادث الكبرى والخسائر المالية المفاجئة. وإدارتها تحتاج قرارًا سريعًا وتواصلًا وتوزيعًا للموارد.\n\nطرق حل المشكلات (Problem Solving Methods):\n1. التجربة والخطأ (Trial and Error): تطبيق حل بعد آخر حتى تُحل المشكلة أو يظهر تحسّن.\n2. التجريب العلمي (Scientific Experimentation): دراسة عناصر مختارة من الموقف تحت ظروف مضبوطة بإحكام.\n3. الحل المبتكر (Novel Solution): يبتكر مدير التمريض حلولًا ليس لها نموذج سابق مسجّل في الذاكرة.\n\nخطوات عملية حل المشكلات (Problem Solving Process):\n1. تحديد المشكلة والهدف (Define Problem & Objective) بجمع بيانات دقيقة ومعلومات صحيحة.\n2. تحديد الأسباب المحتملة (Identify Likely Causes).\n3. تحديد الأسباب الرئيسية والجذرية (Identify Major & Root Causes).\n4. تطوير الحلول والاتفاق على خطة عمل (Develop Solutions / Agree Action Plans) مع تحديد كيفية قياس النتائج.\n5. تنفيذ خطة العمل (Implement Action Plan) مع التنسيق والتواصل الجيد لكسب التزام الجميع.\n6. تحديد فعالية الخطة (Determine Effectiveness) بقياس فاعليتها وكفاءتها.\n7. توحيد النتائج وتطبيقها في كل المجالات المعنية (Standardize Results) وتعميمها كدليل إرشادي.\n\nأساليب حل المشكلات (Techniques): 1. العصف الذهني (Brainstorming). 2. السبب والنتيجة (Cause and Effect). 3. أوراق الفحص (Check Sheets). 4. تحليل باريتو (Pareto Analysis). 5. مخطط تدفق العملية (Process Flow Chart).","textEn":"Introduction: Nurse managers face challenges from patient care matters to staff satisfaction. Critical thinking helps nurses make informed decisions based on facts, data, and evidence to find the best solution. Effective leaders see problems as opportunities rather than obstacles.\n\nA problem is the difference between what is and what might or should be, or something that causes difficulty.\nProblem solving is the manager's responsibility to identify the nature and extent of the problem, decide the method for dealing with it, and direct subordinates in using that method.\n\nTypes of managerial problems:\n1. Well-structured: familiar, clear goal, complete information; needs a programmed decision, a repetitive decision handled by a routine approach.\n2. Poorly structured: new or unusual, with ambiguous or incomplete information; needs a non-programmed decision, a unique custom-made solution.\n3. Crises: unexpected, highly disruptive events needing immediate action, such as natural disasters, major accidents, or sudden financial losses. They call for quick decisions, communication, and resource allocation.\n\nProblem-solving methods:\n1. Trial and error: applying one solution after another until the problem is solved or improves.\n2. Scientific experimentation: studying selected elements of the situation under highly controlled conditions.\n3. Novel solution: the nurse manager invents solutions that have no previously recorded prototype.\n\nThe problem-solving process:\n1. Define the problem and objective using accurate data.\n2. Identify likely causes.\n3. Identify major and root causes.\n4. Develop solutions and agree on action plans, including how results will be measured.\n5. Implement the action plan, coordinating and communicating to gain commitment.\n6. Determine effectiveness by measuring efficiency and results.\n7. Standardize results and implement them in all relevant areas as a guideline.\n\nTechniques: 1. Brainstorming. 2. Cause and effect. 3. Check sheets. 4. Pareto analysis. 5. Process flow chart.","terms":[["Problem","الفرق بين ما هو قائم وما يجب أن يكون.","The difference between what is and what should be."],["Programmed Decision","قرار متكرر يُعالج بأسلوب روتيني لمشكلة جيدة التحديد.","A repetitive decision handled by a routine approach."],["Non-Programmed Decision","قرار فريد يحتاج حلًا مفصّلًا لمشكلة سيئة التحديد.","A unique decision requiring a custom-made solution."],["Crisis","حدث غير متوقع شديد التعطيل يتطلب إجراءً فوريًا.","An unexpected, highly disruptive event requiring immediate action."],["Root Cause","السبب الكامن وراء وجود المشكلة.","The underlying reason why the problem exists."]],"cover":"SOLVE WITH CLARITY","questions":[{"ar":"تكررت أخطاء توثيق في نهاية النوبة. ما الإجراء الأقوى لحل المشكلة؟","en":"Documentation errors recur at the end of shifts. Which response is strongest?","optionsAr":["تذكير شفهي عام فقط","تحديد نمط الأخطاء وتحليل الأسباب الجذرية واختبار تغيير ثم قياس النتيجة","معاقبة آخر ممرض كتب في الملف","إضافة نموذج آخر دون دراسة"],"optionsEn":["A general verbal reminder only","Identify error patterns, analyze root causes, test a change, and measure results","Punish the last nurse who charted","Add another form without analysis"],"correct":1,"whyAr":"حل المشكلة المستدام يعالج الأسباب ويقيس أثر التدخل.","whyEn":"Sustainable problem solving addresses causes and measures intervention impact."},{"ar":"أي معلومة تُعد دليلًا أقوى عند تحديد سبب تأخر تسليم النوبة؟","en":"Which evidence is strongest when identifying the cause of delayed handover?","optionsAr":["انطباع شخص واحد","بيانات أوقات التسليم وملاحظات مباشرة عبر عدة نوبات","افتراض أن الفريق غير ملتزم","شكوى قديمة غير موثقة"],"optionsEn":["One person's impression","Handover-time data and direct observations across several shifts","Assuming the team is uncommitted","An old undocumented complaint"],"correct":1,"whyAr":"البيانات المتكررة والملاحظة المباشرة أقوى من الانطباعات المنفردة.","whyEn":"Repeated data and direct observation are stronger than isolated impressions."},{"ar":"بعد تطبيق حل، انخفضت المشكلة يومين ثم عادت. ما التفسير والتصرف الأفضل؟","en":"After a solution, the problem falls for two days and then returns. What is the best interpretation and response?","optionsAr":["الحل نجح نهائيًا ولا حاجة للمتابعة","قد يكون الأثر مؤقتًا؛ راجع الالتزام والعوامل المؤثرة واستمر في القياس","أوقف جمع البيانات","غيّر كل الإجراءات في وقت واحد"],"optionsEn":["The solution succeeded permanently; no follow-up is needed","The effect may be temporary; review adherence and contributing factors and continue measurement","Stop collecting data","Change all procedures at once"],"correct":1,"whyAr":"التحسن القصير لا يثبت استدامة الحل؛ المتابعة ضرورية.","whyEn":"Short-term improvement does not prove sustainability; follow-up is necessary."},{"ar":"عند وجود عدة مشكلات، أي معيار يساعد على ترتيبها؟","en":"When several problems exist, which criterion helps prioritize them?","optionsAr":["سهولة ملاحظة المشكلة فقط","الخطورة واحتمال الضرر والتكرار وقابلية التدخل","رأي أعلى موظف صوتًا","حداثة المشكلة وحدها"],"optionsEn":["Ease of noticing the problem only","Severity, likelihood of harm, frequency, and actionability","The loudest employee's opinion","Recency alone"],"correct":1,"whyAr":"ترتيب الأولويات يجب أن يركز على الخطر والأثر لا على الانطباعات.","whyEn":"Prioritization should focus on risk and impact rather than impressions."}]},{"id":4,"ar":"صنع القرار","en":"Decision Making","pages":"47–55","summaryAr":"تعريف القرار، وخطواته الثماني، والعوامل المؤثرة فيه، وأنماط صنع القرار الأربعة.","summaryEn":"What a decision is, its eight steps, the factors that influence it, and the four decision-making styles.","textAr":"صنع القرار (Decision Making) في التمريض عملية معقدة تشمل الحصول على بيانات ذاتية وموضوعية عن موقف المريض وتقييمها لتنفيذ إجراءات تحقق نتيجة مرغوبة. وتعتمد على معرفة الممرض وخبرته وقدرته على التعامل مع المواقف سريعة التغير.\n\nالقرار (Decision): اختيار من بديلين أو أكثر. المشكلة (Problem): فرق بين الوضع القائم والمرغوب. عملية صنع القرار (Decision Making Process): ثماني خطوات تشمل تحديد المشكلة واختيار البديل وتقييم فعالية القرار. وصنع القرار جزء من حل المشكلات، وهو الفعل العقلي الحاسم.\n\nالغرض من صنع القرار: تحديد مسار العمل (Course of Action). يتخذ الممرضون قرارات شخصية وسريرية وتنظيمية، في ظروف اليقين وعدم اليقين والمخاطرة. والوعي بمكونات القرار وعمليته واستراتيجياته يزيد فعالية القيادة والإدارة في التمريض.\n\nخطوات عملية صنع القرار الثماني:\n1. تحديد المشكلة (Identifying a problem).\n2. تحديد معايير القرار (Identifying decision criteria).\n3. إعطاء أوزان للمعايير (Allocating weights to the criteria).\n4. تطوير البدائل (Developing alternatives).\n5. تحليل البدائل (Analyzing alternatives).\n6. اختيار بديل (Selecting an alternative).\n7. تنفيذ البديل (Implementing alternative).\n8. تقييم فعالية القرار (Evaluating decision effectiveness).\n\nالعوامل المؤثرة في صنع القرار: يتأثر إدراك المشكلة بعوامل خارجية وداخلية. الخارجية: الظروف البيئية والوقت. الداخلية: الحالة الجسدية والانفعالية لمتخذ القرار، وخصائصه الشخصية، وخلفيته الثقافية والاجتماعية والفلسفية، وخبراته السابقة، واهتماماته ومعرفته واتجاهاته. كما أن عوامل الشخصية مثل تقدير الذات والثقة بالنفس تؤثر في الاستعداد للمخاطرة.\n\nأنماط صنع القرار (Decision Making Styles):\n- النمط التوجيهي (Directive): لا يتحمل الغموض، عقلاني وكفء ومنطقي، سريع القرار ويركز على المدى القصير، بمعلومات وبدائل قليلة.\n- النمط التحليلي (Analytical): تحمّله للغموض أكبر، يريد معلومات أكثر وبدائل أكثر، حذر ويتكيف مع المواقف الفريدة.\n- النمط المفاهيمي (Conceptual): نظرته واسعة، ينظر إلى بدائل كثيرة، يركز على المدى الطويل ويجيد الحلول الإبداعية.\n- النمط السلوكي (Behavioral): يعمل جيدًا مع الآخرين، يهتم بإنجاز المرؤوسين وينفتح على اقتراحاتهم، يستخدم الاجتماعات ويتجنب الصراع، ويهمه قبول الآخرين له.","textEn":"Decision making in nursing is a complex process: obtaining subjective and objective data about a patient situation and evaluating it to implement actions that achieve a desired outcome. It depends on the nurse's knowledge, experience, and ability to cope with rapidly changing situations.\n\nA decision is a choice from two or more alternatives. A problem is a discrepancy between an existing and a desired state. The decision making process is a set of eight steps, including identifying a problem, selecting an alternative, and evaluating the decision's effectiveness. Decision making is one subset of problem solving and is the critical mental action taken.\n\nThe purpose of decision making is to identify a course of action. Nurses make personal, clinical, and organizational decisions under conditions of certainty, uncertainty, and risk. Awareness of the components, process, and strategies of decision making contributes to effective nursing leadership and management.\n\nThe eight steps:\n1. Identifying a problem.\n2. Identifying decision criteria.\n3. Allocating weights to the criteria.\n4. Developing alternatives.\n5. Analyzing alternatives.\n6. Selecting an alternative.\n7. Implementing the alternative.\n8. Evaluating decision effectiveness.\n\nFactors affecting decision making: perception of the problem is influenced by external and internal factors. External: environmental conditions and time. Internal: the decision maker's physical and emotional state, personal characteristics, cultural, social, and philosophical background, past experiences, interests, knowledge, and attitudes. Personality factors such as self-esteem and self-confidence affect willingness to take risks.\n\nDecision making styles:\n- Directive: no tolerance for ambiguity; rational, efficient, and logical; decides fast with a short-run focus, using minimal information and few alternatives.\n- Analytical: greater tolerance for ambiguity; wants more information and considers more alternatives; careful and adaptable to unique situations.\n- Conceptual: broad outlook; looks at many alternatives; long-run focus; good at creative solutions.\n- Behavioral: works well with others; concerned about subordinates' achievement and receptive to suggestions; uses meetings and avoids conflict; acceptance by others matters.","terms":[["Decision","اختيار من بديلين أو أكثر.","A choice from two or more alternatives."],["Decision Making Process","ثماني خطوات من تحديد المشكلة إلى تقييم فعالية القرار.","Eight steps from identifying the problem to evaluating effectiveness."],["Directive Style","سريع، منطقي، لا يتحمل الغموض، ويركز على المدى القصير.","Fast and logical, low tolerance for ambiguity, short-run focus."],["Analytical Style","يريد معلومات وبدائل أكثر ويتحمل الغموض أكثر.","Wants more information and alternatives; more tolerance for ambiguity."],["Conceptual Style","نظرة واسعة وحلول إبداعية على المدى الطويل.","Broad outlook, creative solutions, long-run focus."],["Behavioral Style","يعمل مع الآخرين ويتجنب الصراع ويهمه القبول.","Works with others, avoids conflict, values acceptance."]],"cover":"DECIDE WITH CONFIDENCE","questions":[{"ar":"تحتاج رئيسة التمريض قرارًا سريعًا بشأن نقص طاقم مع وجود مرضى مرتفعي الحدة. ما أول ما ينبغي تقييمه؟","en":"A head nurse must respond quickly to staffing shortage with high-acuity patients. What should be assessed first?","optionsAr":["تفضيلات الإجازات فقط","حدة الحالات والحد الأدنى الآمن من التغطية والمهارات المتاحة","الأقدمية وحدها","توزيع العدد بالتساوي دون اعتبار للمهارة"],"optionsEn":["Leave preferences only","Patient acuity, minimum safe coverage, and available competencies","Seniority alone","Equal headcount distribution regardless of skills"],"correct":1,"whyAr":"القرار الآمن يعتمد على احتياجات المرضى وكفاءة التغطية لا العدد وحده.","whyEn":"A safe decision depends on patient needs and competency coverage, not headcount alone."},{"ar":"عند الاختيار بين بديلين، أحدهما أرخص لكنه يزيد مخاطر السلامة. كيف تُقارن البدائل؟","en":"When choosing between two options, one is cheaper but increases safety risk. How should options be compared?","optionsAr":["اختيار الأرخص دائمًا","مقارنة التكلفة والنتائج والمخاطر والمعايير غير القابلة للتفاوض","اختيار الأسرع دون مراجعة","ترك القرار دون توثيق"],"optionsEn":["Always choose the cheaper option","Compare cost, outcomes, risks, and non-negotiable standards","Choose the fastest without review","Leave the decision undocumented"],"correct":1,"whyAr":"التكلفة لا تُقيّم منفصلة عن السلامة والنتائج.","whyEn":"Cost must not be evaluated separately from safety and outcomes."},{"ar":"ما الخطر في اتخاذ قرار بناءً على أول حل يخطر بالبال؟","en":"What is the risk of deciding based on the first solution that comes to mind?","optionsAr":["يزيد عدد البدائل المدروسة","قد يؤدي إلى تجاهل بدائل أفضل وأسباب أساسية","يضمن الموضوعية","يمنع التحيز"],"optionsEn":["It increases the number of options considered","It may overlook better alternatives and root causes","It guarantees objectivity","It prevents bias"],"correct":1,"whyAr":"توليد بدائل ومقارنتها يقلل التسرع والتحيز.","whyEn":"Generating and comparing alternatives reduces haste and bias."},{"ar":"بعد تنفيذ قرار جديد، ما الدليل الأقوى على جودته؟","en":"After implementing a new decision, what is the strongest evidence of its quality?","optionsAr":["أن المدير مقتنع به","أن التنفيذ كان سريعًا فقط","مقارنة النتائج بالمؤشرات المحددة ومراجعة الآثار غير المقصودة","عدم ورود شكاوى في أول ساعة"],"optionsEn":["The manager believes in it","Implementation was fast only","Compare outcomes with defined indicators and review unintended effects","No complaints in the first hour"],"correct":2,"whyAr":"تقييم القرار يعتمد على النتائج الفعلية والمعايير المحددة.","whyEn":"Decision evaluation relies on actual outcomes and defined criteria."}]},{"id":5,"ar":"التنظيم","en":"Organizing","pages":"56–77","summaryAr":"يتناول هذا الفصل عملية التنظيم كأحد الوظائف الإدارية الرئيسية، والتي تشمل التقسيم المنهجي للأنشطة، وتحديد الوحدات الإدارية، وتفويض السلطة، وتوزيع المسؤوليات لتمكين العاملين من العمل بفعالية لتحقيق أهداف المؤسسة.","summaryEn":"This chapter covers organizing as a core management function, which involves the systematic arrangement of activities, establishing administrative units, delegating authority, and distributing responsibilities to enable personnel to work effectively toward organizational goals.","textAr":"يؤدي التخطيط إلى تحديد مجموعة متنوعة من الأنشطة التي يجب إنجازها، ومن الضروري تنظيم هذه الأنشطة لضمان إدارتها بفاعلية، حيث يعني التنظيم (Organizing) بمعناه العام الترتيب المنهجي للأنشطة ويتم بواسطة كل فرد، بينما يتعلق كمفهوم إداري بتقسيم الأنشطة وتجميحها، وتصبح عملية التنظيم ضرورية عندما يعمل شخصان أو أكثر معاً لتحقيق أهداف مشتركة.\n\nتعرف عملية التنظيم (Organizing process) بأنها العملية التي تتضمن تحديد وتجميع الأنشطة المراد أداؤها، وتحديد وتفويض السلطة، وتحمل المسؤولية، وإنشاء العلاقات لتمكين الأفراد من العمل معاً بفاعلية لتحقيق الأهداف، بينما تشمل أهمية التنظيم التركيز على الأهداف وتسهيل تحقيقها، وترتيب الوظائف ضمن التسلسل الهرمي، وتحديد المسؤوليات وخطوط السلطة بوضوح لجميع المستويات، وخلق علاقات تقلل من الاحتكاك، فضلاً عن مواجهة التحديات في الرعاية الصحية مثل نقص الموظفين وصراع الأدوار.\n\nتتكون عملية التنظيم من خطوات أساسية تبدأ بتحديد الأنشطة المراد أداؤها لتحقيق أهداف المنظمة، ثم تحديد الوظائف الرئيسية التي تتعلق بها هذه الأنشطة، تليها تجميع وتقسيم الأنشطة داخل كل وظيفة على أساس التشابه أو الترافق، وأخيراً إنشاء العلاقات بين الأفراد والمجموعات.\n\nتتضمن مبادئ التنظيم عدة عناصر رئيسية منها سلسلة القيادة (Chain of command) وهي المسار الرسمي للاتصال والسلطة، ووحدة القيادة (Unity of command) وتعني أن كل شخص لديه رئيس واحد فقط مسؤول أمامه، ونطاق الإشراف أو التحكم (Span of control) الذي يتعامل مع نطاق الإشراف وعدد مرؤوسين يمكن الإشراف عليهم بكفاءة من قبل مشرف واحد، وتتخذ أبعاد نطاق الإشراف شكلين هما النطاق الضيق (Narrow span of control) أو النطاق الواسع (Wide span of control).\n\nتعتبر تفويض السلطة (Delegation of authority) إحدى ركائز التنظيم، وتعرف بأنها عملية إسناد العمل من مستوى تنظيمى أعلى إلى مستوى أقل أو من الرئيس إلى المرؤوس وإعطائه السلطة لإنجازها، وتمر عملية التفويض بخطوات تشمل تخصيص الواجبات، وتفويض السلطة، وإسناد المسؤولية، وخلق المساءلة حيث يجب أن يُحاسب المرؤوسون على أداء واجباتهم بشكل صحيح.\n\nتتضمن أنواع السلطة داخل المنظمات السلطة المطلقة (Ultimate authority) التي تتعامل مع المصدر الأصلي للحق في اتخاذ الإجراءات مثل وزارة الصحة، والسلطة القانونية (Legal authority) التي تعني أن الفرد مخول قانوناً بحكم منصبه، والسلطة الفنية (Technical authority) التي تشير إلى الشخص الخبير المعترف به في مجال معين، والسلطة التشغيلية (Operational authority) الممنوحة من خلال تفويض السلطة.\n\nتشير المسؤولية (Responsibility) إلى الالتزام المرتبط بقبول التكليف ولا يمكن تفويضها بل قد تستمر أو تنتهي بإنجاز إجراء واحد، بينما تشير المساءلة (Accountability) في بيئة العمل إلى التزام الشخص بمهامه والاعتراف بدوره المحدد، وتعني في الإدارة امتلاك التزامات تجاه الآخرين في المنظمة لإتمام دور المدير، حيث يتحتم على المرؤوسين أن يكونوا مسؤولين ومحاسبين عن أداء واجباتهم وتتحرك المساءلة في اتجاه صاعد.\n\nيُعرّف التقسيم الإداري أو الأقسام (Departmentation) بأنه عملية تجميع الأنشطة في وحدات إدارية، وتتعدد أنواعه لتشمل التقسيم حسب الخدمات (Departmentation by services) كالوحدات الطبية والجراحية وأقسام الأطفال، والتقسيم حسب الوقت (Departmentation by time) لتغطية 24 ساعة طوال أيام الأسبوع، والتقسيم حسب درجة حدة المرض (Departmentation by degree of acuteness of illness) مثل وحدات الرعاية المركزة والمتوسطة، والتقسيم حسب الوظيفة (Departmentation by function) مثل المغسلة والصيدلية والخدمات الغذائية، والتقسيم حسب الموقع (Departmentation by location)، والتقسيم حسب المريض (Departmentation by patient).\n\nيؤكد مبدأ التخصص (Specialization) على أن الشخص يجب أن يؤدي وظيفة رئيسية واحدة، مما يؤدي إلى تقسيم العمل والتمييز بين أنواع الواجبات والمهام داخل المنظمة لضمان تحقيق أعلى كفاءة وأداء متميز.","textEn":"Planning results in deciding a variety of activities to be done, and organizing these activities is essential if they are to be administered effectively, where organizing in a general sense means systematic arrangement of activities done by each individual, while as a management process it relates to sub-dividing and grouping activities, becoming necessary when two or more persons work together to achieve common objectives.\n\nThe organizing process refers to identifying and grouping of activities to be performed, defining and delegating authority, casting responsibility and establishing relationships to enable people to work together effectively in accomplishing objectives, while the importance of organizing includes focusing on objectives, arranging positions within the hierarchy, clearly defining responsibilities and lines of authority, creating relationships to minimize friction, and handling healthcare challenges such as staff shortages and role conflict.\n\nThe process of organizing consists of steps starting with determining the activities to be performed to achieve objectives, identifying major functions, grouping and sub-dividing activities on the basis of similarity, and establishing relationships among individuals and groups.\n\nPrinciples of organizing include the chain of command as the formal path of communication and authority, unity of command meaning one person has one boss to whom they are responsible, and span of control dealing with the scope of supervision and the number of subordinates supervised by one person, implemented through either a narrow span of control or a wide span of control.\n\nDelegation of authority is crucial for work accomplishment, defined as assigning work from a top organizational level to a lower one or from superior to subordinate and giving them authority, passing through steps of allocating duties, delegating authority, assigning responsibility, and creating accountability where subordinates must be held answerable for carrying out duties properly.\n\nTypes of authority inside organizations include ultimate authority dealing with the original source of rights like the ministry of health, legal authority meaning an individual is legally permitted by virtue of position, technical authority referring to a recognized expert, and operational authority giving someone permission through delegation.\n\nResponsibility refers to the obligation involved when accepting an assignment which cannot be delegated, whereas accountability refers to a person's commitment to tasks and having obligations to others moving in an upward direction where subordinates must be held answerable.\n\nDepartmentation is the process of grouping activities into administrative units, implemented through types such as departmentation by services like medical and surgical units, departmentation by time for 24/7 coverage, departmentation by degree of acuteness of illness like ICU, departmentation by function like pharmacy and dietary, departmentation by location, and departmentation by patient.\n\nThe principle of specialization states that a person should perform a single leading function, leading to a division of labor and differentiation among kinds of duties to ensure organizational efficiency.","terms":[["Organizing","عملية تحديد الأنشطة الواجب أداؤها، وترتيبها في وحدات إدارية، وتخصيص السلطات والمسؤوليات للأفراد العاملين.","The process of determining the activities to be performed, arranging these activities to administrative units, as well as assigning managerial authority and responsibilities to people employed in the organization."],["Chain of command","المسار الرسمي للاتصال والسلطة داخل المؤسسة.","The formal path of communication and authority."],["Unity of command","مبدأ يعني أن لكل موظف رئيساً مباشراً واحداً مسؤولاً أمامه فقط (شخص واحد/مدير واحد).","One person/one boss, each person has one manager to whom they are responsible."],["Span of control","عدد المرؤوسين الذين يمكن الإشراف عليهم بفاعلية وكفاءة من قبل مشرف واحد.","The number of subordinates that can be adequately supervised by one supervisor."],["Delegation of authority","عملية إسناد المهام والأعمال من مستوى إداري أعلى إلى مستوى أقل أو من الرئيس إلى المرؤوس مع منحه السلطة اللازمة للإنجاز.","The process of assigning work from a top organizational level to a lower one or from superior to subordinate and giving that person the authority to accomplish them."],["Departmentation","عملية تجميع الأنشطة وتصنيفها في وحدات إدارية داخل الهيكل التنظيمي.","It is the process of grouping activities into administrative units."],["Specialization","مبدأ ينص على أن الفرد يجب أن يؤدي وظيفة رئيسية واحدة، مما يؤدي إلى تقسيم العمل وتمايز الواجبات.","The principle that a person should perform a single leading function, resulting in division of labor."]],"questions":[{"ar":"يوجد تضارب بين مسؤوليات ممرضتين لأن حدود الدور غير واضحة. ما الحل التنظيمي الأنسب؟","en":"Two nurses have overlapping duties because role boundaries are unclear. What is the best organizing response?","optionsAr":["مطالبتهما بحل الأمر شخصيًا فقط","توضيح المسؤوليات والصلاحيات ومسار التصعيد في وصف الدور","نقل إحداهما دون تحليل","ترك المسؤوليات شفوية دائمًا"],"optionsEn":["Ask them to resolve it personally only","Clarify responsibilities, authority, and escalation route in role descriptions","Transfer one without analysis","Keep responsibilities permanently verbal"],"correct":1,"whyAr":"وضوح الدور والصلاحيات يقلل الازدواجية والفجوات.","whyEn":"Clear roles and authority reduce duplication and gaps."},{"ar":"أي موقف يشير إلى خلل في مبدأ وحدة الأمر؟","en":"Which situation indicates a violation of unity of command?","optionsAr":["يعرف الموظف مشرفه المباشر","يتلقى الموظف تعليمات متعارضة من مسؤولين مختلفين دون آلية حسم","توجد سياسة مكتوبة","يُحدد مسار للتصعيد"],"optionsEn":["The employee knows the direct supervisor","The employee receives conflicting orders from different supervisors without a resolution process","A written policy exists","An escalation path is defined"],"correct":1,"whyAr":"تعدد الأوامر المتعارضة يربك المسؤولية والتنفيذ.","whyEn":"Conflicting orders blur accountability and execution."},{"ar":"لماذا لا يكفي تقسيم العمل حسب العدد فقط؟","en":"Why is allocating work by headcount alone insufficient?","optionsAr":["لأن العدد غير مهم إطلاقًا","لأن المهارات وعبء المرضى ودرجة الحدة تؤثر في ملاءمة التوزيع","لأن كل المرضى متساوون في الاحتياج","لأن التوزيع لا يحتاج متابعة"],"optionsEn":["Because headcount never matters","Because competencies, workload, and acuity affect allocation suitability","Because all patients have equal needs","Because allocation needs no follow-up"],"correct":1,"whyAr":"التنظيم الفعال يوازن الموارد مع متطلبات العمل وكفاءة العاملين.","whyEn":"Effective organizing matches resources to workload and staff competency."},{"ar":"عند تفويض مهمة، أي عنصر يجب ألا يُترك غامضًا؟","en":"When delegating a task, which element must not remain ambiguous?","optionsAr":["النتيجة المتوقعة وحدود الصلاحية وموعد المتابعة","اسم القسم فقط","تفضيل الموظف الشخصي فقط","تاريخ إنشاء القسم"],"optionsEn":["Expected outcome, authority limits, and follow-up time","Department name only","Staff preference only","Department establishment date"],"correct":0,"whyAr":"التفويض الواضح يحدد النتيجة والصلاحية والمتابعة.","whyEn":"Clear delegation defines the outcome, authority, and follow-up."}]},{"id":6,"ar":"إدارة الوقت","en":"Time Management","pages":"78–95","summaryAr":"يتناول هذا الفصل مفهوم إدارة الوقت كأحد الموارد الهامة مثل المال والمعدات، ويناقش أهمية إدارته بفعالية، ومبادئ إدارة الوقت، وتصنيف مضيعات الوقت إلى داخلية وخارجية، ودور مدير التمريض في تحقيق الإنتاجية وتحسين الأداء.","summaryEn":"This chapter covers the concept of time management as an important resource equivalent to money and equipment, discussing the importance of effective time management, its principles, the classification of time wasters into internal and external, and the role of the nurse manager in achieving productivity and improving performance.","textAr":"يُعد الوقت مورداً هاماً للغاية لا يقل أهمية عن المال والمعدات والsupplies (المستلزمات)، ولكنه يتطلب التخطيط المستمر، حيث تتطلب الإدارة الفعالة للوقت تحليل خصائص العمل وعادات العمل الفردية لأعضاء الفريق والتدخل عند العثور على استخدام غير منتج للوقت.\n\nتُعرف إدارة الوقت (Time Management) بأنها إدارة الوقت بفعالية بحيث يتم تخصيص الوقت المناسب للنشاط المناسب، وهي تعني أيضاً الاستفادة المثلى من الوقت المتاح لتحقيق أقصى قدر من الإنتاجية.\n\nتتعدد فوائد إدارة الوقت وأهميته لتشمل كون الوقت محدوداً، وتحقيق المزيد بجهد أقل، واتخاذ قرارات أفضل، وأن يكون الشخص أكثر نجاحاً، والتعلم بشكل أكبر، وتقليل التوتر، واكتساب ساعات إضافية منتجة، وزيادة الكفاءة والإنتاجية، والحصول على مزيد من التحكم في الحياة، وقضاء وقت إضافي للاستمتاع.\n\nتتضمن مبادئ إدارة الوقت (Principles of time management) وضوح الغرض (Clarity of purpose) لتحديد ما يحاول الشخص تحقيقه، وتقييم الاستخدام الحالي للتوجه نحو الأهداف وتجنب التسويف، وإنشاء خطة مكتوبة للأنشطة اليومية والأسبوعية، وترتيب الأولويات (Prioritizing) بحيث تحصل الأنشطة المرتبطة بالأهداف على الاهتمام أولاً، ووضع حدود لمضيعات الوقت (Place boundaries on your time wasters)، وتنفيذ مهمة واحدة في المرة الواحدة نظراً لأن تعدد المهام يمثل عبئاً معرفياً، بالإضافة إلى التفويض (Delegation) والتقييم (Evaluation) الأسبوعي الفعال.\n\nيُعرّف مضيع الوقت (Time waster) بأنه أي شيء يمنع الشخص من إنجاز الوظيفة أو تحقيق الهدف، وتصنف مضيعات الوقت إلى نوعين رئيسيين هما مضيعات الوقت الداخلية أو الشخصية (Internal time wasters) وتلك المتعلقة بالنفس وهي الأسهل في التحكم مثل نقص التخطيط والأولويات، والتسويف (Procrastination)، والتنظيم الضعيف (Disorganization)، والكمال المفرط (Perfectionism).\n\nالنوع الثاني هو مضيعات الوقت الخارجية (External time wasters) وهي الأمور التي يفتعلها الآخرون وتكون أكثر صعوبة في السيطرة عليها، وتشمل المكالمات الهاتفية (Telephone calls)، والزيارات المفاجئة (Drop in visitors)، ونظام حفظ الملفات الضعيف (Poor filing system)، والأوراق والوثائق المفرطة (Paper work).\n\nيتضمن دور مدير التمريض في إدارة الوقت (Nurse manager role in time management) أن يكون واعيًا بذاته تجاه المعوقات والعوائق الشخصية للوقت الفعال، والعمل كقدوة ودعم ومورد للمرؤوسين في تحديد الأولويات، ومساعدة العاملين في العمل تعاونياً لتعظيم الاستفادة من الوقت، وترتيب أولويات التخطيط اليومي للوصول للأهداف قصيرة وطويلة المدى، وبناء وقت مخصص للتخطيط في مكان العمل، وتحليل كيفية إدارة الوقت على مستوى الوحدة باستخدام تحليل الوظائف ودراسات الحركة والزمن.","textEn":"Time is an equally important resource such as money, equipment, and supplies, but this requires planning, where effective time management requires analysis of work characteristics, individual work habits, and interventions where nonproductive use of time is found.\n\nTime management is defined as managing time effectively so that the right time is allocated to the right activity, and it is making an optimal use of available time for maximum productivity.\n\nThe importance of time management includes that time is limited, accomplishing more with less effort, making better decisions, being more successful, learning more, reducing stress, gaining extra productive hours, increasing efficiency and productivity, having more control over life, and spending more time for enjoyment.\n\nPrinciples of time management include clarity of purpose to determine what to achieve, evaluating current use of time, creating a written plan for daily and weekly activities, prioritizing activities so goals-related actions receive attention first, placing boundaries on time wasters, doing one thing at a time since multitasking incurs cognitive and time costs, delegation, and weekly evaluation.\n\nA time waster is defined as something that prevents a person from accomplishing a job or achieving a goal, and they are classified into internal time wasters which are personal and easiest to control such as lack of planning, disorganization, procrastination, and perfectionism.\n\nThe second type is external time wasters which are things other people do to waste your time and are more difficult to control, including telephone calls, drop-in visitors, poor filing system, and paper work.\n\nThe nurse manager role in time management includes being self-aware regarding personal blocks, functioning as a role model and support person for subordinates in setting priorities, assisting followers in working cooperatively, appropriately prioritizing day-to-day planning, building time for planning into the workplace, and analyzing how time is managed on the unit level using job analysis and time motion studies.","terms":[["Time management","إدارة الوقت بفعالية بحيث يُخصص الوقت المناسب للنشاط المناسب، أو الاستفادة المثلى من الوقت المتاح لتحقيق أقصى قدر من الإنتاجية.","Managing time effectively so that the right time is allocated to the right activity, or making an optimal use of available time for maximum productivity."],["Time waster","هو أي شيء يمنع الشخص من إنجاز وظيفة أو تحقيق هدف ما.","It is something that prevents a person from accomplishing a job or achieving a goal."],["Internal time wasters","الأمور الشخصية التي يفعلها الفرد بنفسه لتضييع وقته وتعتبر الأسهل في السيطرة عليها مثل التسويف ونقص التخطيط.","The things that you do yourself to waste time and are the easiest to control."],["External time wasters","الأمور التي يفتعلها الآخرون وتؤدي إلى تضييع وقتك وتكون أكثر صعوبة في السيطرة عليها.","The things other people do to waste your time. This can be more difficult to control."],["Procrastination","تأجيل المهام الوشيكة إلى وقت لاحق، وأحياناً حتى اللحظة الأخيرة قبل الموعد النهائي.","Putting off impending tasks to a later time, sometimes to the 'last minute' before a deadline."],["Perfectionism","حالة يصبح فيها الشخص قلقاً للغاية بشأن إنجاز العمل بشكل مثالي لدرجة أنه قد لا يكمله أبداً.","Becoming so anxious about getting a job done perfectly that they never complete it."]],"questions":[{"ar":"تُنجز رئيسة التمريض مهامًا عاجلة طوال اليوم بينما تتأخر مراجعة الجداول. ما الإجراء الأفضل؟","en":"A head nurse handles urgent tasks all day while schedule review is delayed. What is the best action?","optionsAr":["إلغاء مراجعة الجداول","تصنيف المهام حسب الأهمية والإلحاح وتخصيص وقت محمي للمهام المهمة","العمل على كل المهام بالتوازي","تأجيل كل مهمة غير عاجلة إلى أجل غير محدد"],"optionsEn":["Cancel schedule review","Prioritize tasks by importance and urgency and protect time for important work","Work on all tasks simultaneously","Defer every non-urgent task indefinitely"],"correct":1,"whyAr":"إدارة الوقت تتطلب ترتيبًا مقصودًا لا الاستجابة المستمرة للمقاطعات.","whyEn":"Time management requires deliberate prioritization rather than constant interruption response."},{"ar":"أي مؤشر يكشف أن التفويض لم ينجح؟","en":"Which indicator suggests delegation has failed?","optionsAr":["تحديد نتيجة واضحة","غياب متابعة المهمة وعدم معرفة المسؤول عن النتيجة","توافق المهمة مع كفاءة الموظف","تحديد موعد نهائي"],"optionsEn":["A clear outcome was defined","No follow-up and no one knows who owns the result","The task matches staff competency","A deadline was set"],"correct":1,"whyAr":"غياب الملكية والمتابعة يجعل الإنجاز غير قابل للتحقق.","whyEn":"Lack of ownership and follow-up makes completion unverifiable."},{"ar":"تستهلك الاجتماعات وقتًا كبيرًا دون قرارات. ما التغيير الأكثر فاعلية؟","en":"Meetings consume substantial time without decisions. Which change is most effective?","optionsAr":["زيادة عدد الاجتماعات","تحديد هدف وجدول أعمال وقرارات مطلوبة ومسؤوليات ومواعيد","دعوة جميع العاملين لكل اجتماع","منع تدوين المحاضر"],"optionsEn":["Increase meeting frequency","Define an objective, agenda, decisions needed, owners, and deadlines","Invite all staff to every meeting","Prohibit minutes"],"correct":1,"whyAr":"الاجتماع المنظم ينتهي بقرارات ومسؤوليات قابلة للمتابعة.","whyEn":"A structured meeting ends with trackable decisions and responsibilities."},{"ar":"عند تقدير مدة مهمة جديدة، ما الممارسة الأكثر موثوقية؟","en":"When estimating the duration of a new task, which practice is most reliable?","optionsAr":["اختيار أقل مدة ممكنة لإرضاء الإدارة","استخدام بيانات سابقة وتقدير التعقيد وإضافة هامش واقعي","تجاهل وقت التوثيق","اعتماد مدة مهمة مختلفة تمامًا"],"optionsEn":["Choose the shortest duration to please management","Use prior data, assess complexity, and add a realistic buffer","Ignore documentation time","Use the duration of a completely different task"],"correct":1,"whyAr":"التقدير الواقعي يشمل تعقيد المهمة والخطوات التابعة لها.","whyEn":"Realistic estimation includes task complexity and dependent steps."}]},{"id":7,"ar":"التحفيز","en":"Motivation","pages":"96–109","summaryAr":"يتناول هذا الفصل مفهوم التحفيز كقوة دافعة وسلوك موجه نحو الأهداف، وأنواعه المختلفة (الخارجية والداخلية)، وعملية التحفيز وعناصرها، وتأثيره على بيئة العمل وظروفه، بالإضافة إلى الاستراتيجيات وطرق التحفيز المختلفة في إدارة التمريض.","summaryEn":"This chapter covers the concept of motivation as a driving force and goal-directed behavior, its different types (extrinsic and intrinsic), the motivation process and its elements, its effects on work conditions, and various motivational strategies and methods in nursing management.","textAr":"يُعرف التحفيز (Motivation) بأنه قوة دافعة داخل الأفراد يحاولون من خلالها تحقيق بعض الأهداف لتلبية بعض الاحتياجات أو التوقعات، وهو يمنز السلوك من خلال إثارته واستدامته وتوجيهه نحو تحقيق الأهداف بنجاح. تحفيز الآخرين يعني دفعهم للذهاب في الاتجاه المطلوب للوصول إلى نتيجة، بينما التحفيز الذاتي هو تحديد الاتجاه بشكل مستقل ثم إنشاء خطة عمل للتأكد من الوصول إلى هناك.\n\nتتعدد أسباب التحفيز وغاياته لتشمل دفع الأفراد للإنجاز، ومساعدة الأفراد على العمل بكفاءة أكبر، وبناء الروح المعنوية، ومساعدة الأفراد على إنتاج نتائج أفضل. كما تكمن qualities (خصائص) التحفيز في تنشيط السلوك، وتوجيه السلوك، وتمكين المثابرة نحو الهدف.\n\nيُعد التحفيز عملية يتم من خلالها تنشيط وتوجيه واستدامة جهود الشخص نحو تحقيق الهدف، وتتضمن عملية التحفيز جوانب مثل الشدة أو الجهد (Intensity or Energy) وهي مدى محاولة الشخص وبذل الجهد في مكان العمل، والمثابرة (Persistence) وهي رغبة الفرد في الاستمرار في المهمة حتى اكتمالها، والاتجاه (Direction) وهو توجيه الجهد بما يتسق مع أهداف المنظمة.\n\nتتنوع أنواع التحفيز (Types of motivations) إلى تحفيز خارجي (Extrinsic) ويشمل المكافآت مثل العلاوات (Bonuses)، واستخدام سيارة الشركة، وشهادات الهدايا، وفرص التدريب، وتحفيز داخلي (Intrinsic) وهو خاص بالفرد ويشمل الرضا الشخصي والعوامل الثقافية والدينية.\n\nتؤثر ظروف العمل بشكل مباشر على التحفيز والرضا الوظيفي، وتشمل ظروف العمل التي تعزز التحفيز أن توفر المهام شعراً بالمعنى، وأن يتحكم الموظفون في جزء من العمل، وتنوع المهام، ووضوح وقواعد الشركة المتسقة، والعلاقات الداعمة مع الرؤساء وزملاء العمل، وتلقي ملاحظات مفيدة، وفرص النمو.\n\nتتضمن طرق التحفيز (How to motivate?) تحديد نوع الفرد (خارجي أو داخلي)، وتمكينه للمشاركة في خطة المشروع وبناء الفريق، وتوصيل أهداف المشروع، وإسناد المسؤولية، وتقديم الحوافز مثل شهادات الهدايا وموظف الشهر وعبارات الشكر والثناء مثل 'عمل رائع' و'أحسنت'.\n\nتشمل استراتيجيات التحفيز (Motivation strategies) تطوير نظام المكافآت الإجمالي وعملية إدارة الأداء، وتصميم برامج التطوير القيادي والتحفيزي لخلق بيئة عمل وتطوير سياسات وممارسات تؤدي إلى مستويات أعلى من أداء الموظفين.","textEn":"Motivation is defined as a driving force within individuals by which they attempt to achieve some goal in order to fulfill some needs or expectation, giving impetus to behavior by arousing, sustaining, and directing it towards successful goal attainment. Motivating others means getting them to go in the desired direction to arrive at a result, while self-motivation is setting direction independently and creating an action plan.\n\nReasons to motivate include driving individuals to achieve, helping them work more efficiently, building morale, and helping them produce better results. The qualities of motivation are energizing behavior, directing behavior, and enabling persistence toward a goal.\n\nMotivation as a process involves a person's efforts being energized, directed, and sustained towards attaining the goal, encompassing intensity or energy as how hard a person tries, persistence as the desire to stay with a task until completed, and direction as effort channeled toward organizational goals.\n\nTypes of motivations include extrinsic motivation such as bonuses, use of company cars, gift certificates, and training opportunities, and intrinsic motivation which is specific to the individual, personal satisfaction, and cultural and religious factors.\n\nThe effects of motivation on work include working conditions that increase job involvement and satisfaction, such as work providing meaningfulness, employee control over work, varied tasks, clear rules, supportive relationships, useful feedback, and growth opportunities.\n\nMethods of how to motivate include identifying the individual's type, empowering participation in project plans, communicating goals, assigning responsibility, and perks like gift certificates, 'employee of the month', and saying 'great job' or 'well done'.\n\nMotivation strategies include developing the total reward system, performance management processes, and designing motivational and leadership development programs to achieve higher employee performance.","terms":[["Motivation","القوة الدافعية داخل الأفراد التي تحاول تحقيق الأهداف لتلبية الاحتياجات أو التوقعات، وتنشيط وتوجيه واستدامة السلوك.","The driving force within individuals by which they attempt to achieve some goal in order to fulfill some needs or expectation."],["Extrinsic motivation","التحفيز الخارجي الذي يشمل المكافآت المادية مثل العلاوات والهدايا واستخدام سيارة الشركة وفرص التدريب.","External motivation including bonuses, use of company car, gift certificates, and training opportunities."],["Intrinsic motivation","التحفيز الداخلي المرتبط بالفرد نفسه ويشمل الرضا الشخصي والعوامل الثقافية والدينية.","Motivation specific to the individual, personal satisfaction, and cultural and religious factors."],["Intensity","مقدار الجهد أو الشدة التي يبذلها الشخص في مكان العمل.","How hard a person tries or a measure of intensity or drive."],["Persistence","مثابرة الفرد ورغبته في الاستمرار في المهمة حتى اكتمالها.","The individual's desire to stay with a task until it is completed."],["Direction","توجيه الجهد وتصريفه ليكون متسقاً مع أهداف المنظمة.","Effort that is channeled toward, and consistent with, organizational goals."]],"questions":[{"ar":"ممرض متمكن تراجع حماسه بسبب غياب فرص التطور. ما الاستجابة الأقرب لتحفيز مستدام؟","en":"A competent nurse loses motivation because growth opportunities are absent. Which response best supports sustained motivation?","optionsAr":["مكافأة مالية مرة واحدة فقط","مناقشة أهدافه وتوفير تطوير مهني ومسؤوليات مناسبة مع تقدير عادل","زيادة الرقابة الدقيقة","مقارنته بزملائه علنًا"],"optionsEn":["A one-time financial reward only","Discuss goals and provide professional development, suitable responsibility, and fair recognition","Increase micromanagement","Publicly compare the nurse with peers"],"correct":1,"whyAr":"الدافعية قد تتطلب فرص نمو وتقديرًا واستقلالية مناسبة، لا حافزًا واحدًا فقط.","whyEn":"Motivation may require growth, recognition, and appropriate autonomy rather than a single incentive."},{"ar":"ما التصرف الذي قد يضعف الدافعية رغم أن نية المدير جيدة؟","en":"Which action may reduce motivation despite good managerial intentions?","optionsAr":["توضيح التوقعات","تقديم تغذية راجعة محددة","منح مسؤولية دون صلاحية أو موارد كافية","الاعتراف بإنجاز موثق"],"optionsEn":["Clarifying expectations","Providing specific feedback","Assigning responsibility without sufficient authority or resources","Recognizing a documented achievement"],"correct":2,"whyAr":"المسؤولية غير المدعومة تجعل الموظف مسؤولًا عن نتائج لا يملك أدواتها.","whyEn":"Unsupported responsibility makes staff accountable for outcomes without the tools to achieve them."},{"ar":"موظفان يستجيبان لحوافز مختلفة. ما الاستنتاج الإداري الأفضل؟","en":"Two employees respond to different incentives. What is the best managerial conclusion?","optionsAr":["يجب استخدام حافز واحد للجميع دائمًا","تُفهم احتياجات الأفراد مع الحفاظ على العدالة والاتساق","تُلغى الحوافز","يُفترض أن المال هو الدافع الوحيد"],"optionsEn":["One incentive must always be used for everyone","Understand individual needs while maintaining fairness and consistency","Eliminate incentives","Assume money is the only motivator"],"correct":1,"whyAr":"التحفيز الفعال يراعي الفروق الفردية دون الإخلال بالعدالة.","whyEn":"Effective motivation considers individual differences without compromising fairness."},{"ar":"كيف تميز بين مشكلة مهارة ومشكلة دافعية؟","en":"How can a manager distinguish a skill problem from a motivation problem?","optionsAr":["افتراض أن كل ضعف أداء سببه الكسل","مراجعة التدريب والكفاءة والموارد والوضوح والتغذية الراجعة قبل الاستنتاج","تطبيق عقوبة مباشرة","مقارنة الموظف بزميله فقط"],"optionsEn":["Assume all poor performance is laziness","Review training, competence, resources, clarity, and feedback before concluding","Apply immediate punishment","Only compare the employee with a colleague"],"correct":1,"whyAr":"تشخيص السبب يمنع اختيار تدخل غير مناسب.","whyEn":"Diagnosing the cause prevents choosing an inappropriate intervention."}]},{"id":8,"ar":"الهيكل التنظيمي","en":"Organizational Structure","pages":"110–138","summaryAr":"يتناول هذا الفصل مفهوم الهيكل التنظيمي (Organizational Structure) وأنواعه المختلفة، مثل الهيكل الرسمي وغير الرسمي، والخرائط التنظيمية بأنواعها (العمودية، والأفقية، والدائرية)، بالإضافة إلى المبادئ التنظيمية الأساسية كالمركزية واللامركزية، وتفويض السلطة، ونطاق الإشراف، وتقسيم العمل والأقسام.","summaryEn":"This chapter covers the concept of organizational structure and its various types, such as formal and informal structures, organizational charts (vertical, horizontal, and circular), as well as core organizational principles like centralization and decentralization, delegation of authority, span of control, division of work, and departmentation.","textAr":"يُشير الهيكل التنظيمي (Organizational Structure) إلى تجميع الوظائف اللازمة لكي تحقق المنظمة أهدافها، ويمكن الكشف عن الهيكل التنظيمي من خلال خريطة توضح الوظائف المختلفة في المنظمة وعلاقة هذه الوظائف ببعضها البعض.\n\nينقسم الهيكل التنظيمي إلى نوعين رئيسيين هما الهيكل التنظيمي الرسمي (The formal organizational structure) الذي يصف الوظائف والمهام والمسؤوليات وخطوط السلطة والعلاقات بين الأفراد في مواضعهم المختلفة ويظهر في شكل تخطيطي يسمى الخريطة التنظيمية، والهيكل التنظيمي غير الرسمي (The informal organizational structure) الذي يتكون من علاقات شخصية واجتماعية لا تظهر على الخريطة التنظيمية وتستند إلى العلاقات الشخصية بدلاً من احترام السلطة الرسمية.\n\nتُعرف الخريطة التنظيمية (Organizational Chart) بأنها مخطط يوضح الوظائف والأقسام المختلفة والعلاقات فيما بينها، وتستخدم لتوضيح علاقات التنظيم الرسمية، ومناطق المسؤولية، والأشخاص الذين يُحاسب أمامهم الفرد، وقنوات الاتصال. وتوجد ثلاثة أنواع رئيسية للخرائط التنظيمية وهي الخرائط العمودية (Vertical charts)، والخرائط الأفقية من اليسار إلى اليمين (Horizontal charts)، والخرائط الدائرية (Circular charts).\n\nتتضمن المبادئ التنظيمية (Organizational principles) عدة عناصر أساسية منها مبدأ التكافؤ أو التساوي (Parity principle) الذي ينص على أن الموظفين يجب أن يمتلكوا قدراً متساوياً من السلطة والمسؤولية، ومبدأ وحدة القيادة (Unity of command) بحيث يكون لكل موظف رئيس واحد فقط، وسلسلة القيادة (Chain of command) التي تتدفق فيها السلطة من مستوى إداري لأخر من القمة إلى القاع.\n\nتشير المركزية واللامركزية (Centralization and Decentralization) إلى المستوى الذي تتم عنده معظم القرارات داخل المنظمة، حيث تعني المركزية نظام إدارة تُتخذ فيه جميع القرارات بواسطة الإدارة العليا، بينما اللامركزية هي نظام تتركز فيه سلطة اتخاذ القرار لدى الإدارة على المستوى الأدنى حيث يتم أداء العمل.\n\nتُعرف السلطة (Authority) بأنها الحق في اتخاذ القرارات النهائية، أو التصرف، أو الأمر بأفعال الآخرين وتتحرك في اتجاه هبوطي، وتشمل أنواعها السلطة المطلقة، والسلطة القانونية، والسلطة الفنية، والسلطة التشغيلية. بينما تشير المسؤولية (Responsibility) إلى الالتزام المرتبط بقبول التكليف ولا يمكن تفويضها، والمساءلة (Accountability) تعني أن يكون المرؤوسون مسؤولين ومحاسبين عن أداء واجباتهم بشكل صحيح وتتحرك في اتجاه صاعد.\n\nيتعامل نطاق الإشراف أو الإدارة (Span of control/ supervision) مع عدد المرؤوسين الذين يمكن الإشراف عليهم بكفاءة بواسطة مشرف واحد، وينقسم إلى نطاق إشراف ضيق (Narrow span of control) ونطاق إشراف واسع (Wide span of control). كما يعني تقسيم العمل أو الخدمة (Division of work/ service / labour) تقسيم الأنشطة الكبيرة لتوزيعها على عدة أفراد لتحقيق التخصص والمهارة القصوى.\n\nيُعرّف التقسيم الإداري (Departmentation) بأنه عملية تجميع الأنشطة في وحدات إدارية، وتتضمن أنواعه التقسيم حسب الوظيفة، وحسب الوقت، وحسب تجميع الأعداد، وحسب المنتج، وحسب المواقع أو المناطق الجغرافية، وحسب العميل.","textEn":"Organizational structure refers to the grouping of positions necessary for the organization to accomplish its objectives, and it may be revealed by a chart indicating the various positions and their relationships to each other.\n\nOrganizational structure includes the formal organizational structure which describes positions, tasks, responsibilities, lines of authority, and relationships presented in a diagram called an organizational chart, and the informal organizational structure which consists of personal and social relationships not appearing on the organizational chart based on personal relationships.\n\nAn organizational chart is a diagram showing the different positions and departments and the relationships among them, used to show formal relationships, areas of responsibility, accountability, and communication channels. The three types of organizational charts are vertical charts, left-to-right (horizontal) charts, and circular charts.\n\nOrganizational principles include the parity principle stating that personnel must have an equal amount of authority and responsibility, unity of command where each employee has only one boss, and the chain of command where authority flows from the top of the organization to the bottom.\n\nCentralization and decentralization refer to the level at which most decisions are made within the organization, where centralization is a system where all decisions are made by top-level managers, and decentralization is a system where a great deal of decision-making authority rests at lower-level managers.\n\nAuthority is the right to take final decisions, to act or to command action moving in a downward direction, including ultimate, legal, technical, and operational authority. Responsibility refers to the obligation involved when accepting an assignment which cannot be delegated, and accountability means subordinates must be held answerable moving in an upward direction.\n\nSpan of control/supervision deals with the number of subordinates that can be adequately supervised by one supervisor, divided into narrow and wide spans of control. Division of work means dividing large activities to be distributed among several people to achieve maximum skill and specialization.\n\nDepartmentation is the process of grouping activities into administrative units, including types such as departmentation by function, time, numbers, product, location, and client.","terms":[["Organizational structure","تجميع الوظائف اللازمة لكي تتمكن المنظمة من تحقيق أهدافها.","The grouping of positions which are necessary for the organization to accomplish its objectives."],["Organizational Chart","رسم توضيحي يوضح الوظائف والأقسام المختلفة والعلاقات والروابط فيما بينها.","A diagram showing the different positions and departments, and the relationships among them."],["Parity principle","مبدأ ينص على أن الموظفين يجب أن يمتلكوا قدراً متساوياً من السلطة والمسؤولية.","The principle that personnel must have an equal amount of authority and responsibility."],["Unity of command","مبدأ يقضي بأن يكون لكل موظف رئيس مباشر واحد فقط مسؤول أمامه.","The principle that each employee should have only one boss."],["Centralization","نظام إدارة تتركز فيه جميع اتخاذ القرارات بواسطة الإدارة العليا.","A system of management in which all decisions are made by top level manager."],["Decentralization","نظام إدارة يرتكز فيه جزء كبير من سلطة اتخاذ القرار لدى الإدارة في المستويات الأدنى حيث يؤدى العمل.","A system of management in which a great deal of decision-making authority rests at lower-level manager."],["Span of control","عدد المرؤوسين الذين يمكن الإشراف عليهم بكفاءة بواسطة مشرف واحد.","The number of subordinates that can be adequately supervised by one supervisor."],["Departmentation","عملية تجميع الأنشطة وتصنيفها في وحدات إدارية.","The process of grouping activities into administrative units."]],"questions":[{"ar":"تحتاج وحدة إلى اتخاذ قرارات سريعة محلية، لكن كل قرار صغير يتطلب موافقة الإدارة العليا. ما التعديل المحتمل؟","en":"A unit needs quick local decisions, but every minor decision requires top approval. What adjustment may help?","optionsAr":["زيادة المركزية","تفويض صلاحيات محددة مع ضوابط ومساءلة واضحة","إلغاء السياسات","إزالة جميع المستويات الإدارية"],"optionsEn":["Increase centralization","Delegate defined authority with clear controls and accountability","Eliminate policies","Remove all management levels"],"correct":1,"whyAr":"التفويض المنضبط قد يسرّع القرارات القريبة من العمل.","whyEn":"Controlled delegation can speed decisions close to the work."},{"ar":"ما الخطر الأوضح في هيكل تنظيمي لا يحدد خطوط الإبلاغ؟","en":"What is the clearest risk of an organizational structure with no reporting lines?","optionsAr":["سهولة معرفة المسؤول","التباس الصلاحيات وتأخر التصعيد وتكرار العمل","زيادة وضوح المساءلة","تقليل تضارب التعليمات"],"optionsEn":["Easy identification of accountability","Authority confusion, delayed escalation, and duplicated work","Greater accountability clarity","Reduced conflicting instructions"],"correct":1,"whyAr":"خطوط الإبلاغ توضح المسؤولية ومسار التصعيد.","whyEn":"Reporting lines clarify responsibility and escalation."},{"ar":"متى تكون اللامركزية غير مناسبة إذا طُبقت بلا ضوابط؟","en":"When is decentralization unsuitable if applied without controls?","optionsAr":["عندما تتطلب القرارات معرفة محلية","عندما تؤدي إلى قرارات متعارضة تمس معايير سلامة موحدة","عندما تكون الصلاحيات محددة","عندما توجد مراجعة دورية"],"optionsEn":["When decisions require local knowledge","When it leads to conflicting decisions affecting uniform safety standards","When authority is defined","When periodic review exists"],"correct":1,"whyAr":"القرارات المحلية تحتاج حدودًا ومعايير مشتركة في مسائل السلامة.","whyEn":"Local decisions need boundaries and common standards for safety issues."},{"ar":"ما الغرض من الوصف الوظيفي في دعم الهيكل؟","en":"How does a job description support the organizational structure?","optionsAr":["استبدال التدريب والتقييم","تحديد المهام والمسؤوليات والعلاقات والصلاحيات المتوقعة","ضمان عدم حدوث أي خطأ","تحديد الراتب فقط"],"optionsEn":["Replace training and evaluation","Define expected duties, responsibilities, relationships, and authority","Guarantee no errors occur","Set salary only"],"correct":1,"whyAr":"الوصف الوظيفي يوضح التوقعات لكنه لا يغني عن التدريب والمتابعة.","whyEn":"A job description clarifies expectations but does not replace training or supervision."}]},{"id":9,"ar":"التوظيف","en":"Staffing","pages":"139–155","summaryAr":"يتناول هذا الفصل عملية التوظيف (Staffing) وأهدافها والعوامل المؤثرة عليها، وطرق حساب التوظيف، وتخطيط القوى العاملة (Manpower planning)، وفلسفة التوظيف العامة وفي مجال التمريض، بالإضافة إلى مبادئ جمعية التمريض الأمريكية (ANA) للتوظيف.","summaryEn":"This chapter covers the concept and goals of staffing, factors affecting staffing, methods of calculating staffing, manpower planning, philosophies of staffing in general and in nursing, and ANA principles of nursing staffing.","textAr":"يُعرف التوظيف (Staffing) بأنه عملية التأكد من توفر أعداد كافية ومزيج مناسب من الموظفين لتلبية احتياجات الوحدة اليومية وأهداف المنظمة، وهو عملية تحديد وتعيين الأفراد المناسبين ذوي المؤهلات المناسبة في الوظيفة المناسبة في الوقت المناسب لتحقيق أغراض المنظمة.\n\nتشمل أهداف التوظيف (Goals of staffing) توفير أعداد ومزيج مناسب من طاقم التمريض، وتقديم رعاية تمريضية فعالة وفعالة من حيث الكفاءة، وزيادة الإنتاجية، وتجنب ارتباك الأدوار ومشاكل الاتصال وضياع الوقت، والحفاظ على الاستقرار في العمل الجماعي، وتزويد كل وحدة تمريضية بالعدد المناسب من كل فئة من العمال لتقديم الرعاية والراحة للمرضى.\n\nتتأثر عملية التوظيف بمجموعة من العوامل تشمل عوامل المرضى مثل نوع المريض (العمر، الجنس، التشخيص) وتقلبات القبول وطول الإقامة وشدة التعقيد، وعوامل الموظفين مثل سياسات شؤون الموظفين ومستويات التعليم والخبرة والوصف الوظيفي والمنافسة في السوق، وعوامل البيئة مثل عدد أسرة المرضى وتوفر الإمدادات والمعدات والهيكل التنظيمي.\n\nتتعدد طرق حساب التوظيف (Methods of calculating staffing) لتشمل نظام تصنيف المرضى (Patient classification system) لتحديد احتياجات عبء العمل موضوعياً، والمجموعات المرتبطة تشخيصياً (Diagnostic related groups)، وشدة وتعقيد الرعاية لتوقع ساعات الرعاية التمريضية المطلوبة، وصيغ التوظيف (Staffing formulas) التي تأخذ في الاعتبار الإجازات والعطلات والغياب ووقت تطوير الموظفين.\n\nيُعرف تخطيط القوى العاملة (Manpower planning) بأنه إستراتيجية للحصول على الموارد البشرية للمنظمة واستخدامها وتحسينها والحفاظ عليها، وتتضمن أهدافه الرئيسية ضمان الاستخدام الأقصى للأفراد، وتقييم المتطلبات المستقبلية، وتحديد مصادر التوظيف، وتوقع الاحتياجات من السجلات السابقة، وتحديد متطلبات التدريب، بينما تشمل الأنشطة الرئيسية التنبؤ بالمتطلبات المستقبلية وحصر الموارد الحالية.\n\nتتنوع فلسفات التوظيف بين المنظور التنظيمي الذي يرى أن تنظيم الوظائف بالشكل المناسب يولد الهيكل والاتجاهات المواتية، والمهندس الصناعي الذي يرى الفرد موجهاً ميكانيكياً ومحفزاً اقتصادياً، وعالم السلوك الذي يركز على مشاعر المجموعة واتجاهاتها والمناخ النفسي والاجتماعي. أما فلسفة التوظيف في التمريض فتؤكد على مطابقة معرفة الموظفين ومهاراتهم لاحتياجات الرعاية، وتطوير خطة توظيف رئيسية مركزياً بواسطة رؤساء التمريض والموظفين.\n\nتحدد أهداف التوظيف في التمريض توفير طاقم تمريض مهني بالكامل في وحدات العناية الحرجة وغرف العمليات والولادة والطوارئ، وتحقيق نسبة ممرض إلى مريض 1:1 في العناية الحرجة، ونسبة 2:1 بين المهني والعملي في الأقسام العامة، ونسبة 1:5 في وردتي النهار والمساء و1:10 في وردة الليل بالأقسام العامة، مع نشر الجداول قبل ثمانية أسابيع على الأقل.\n\nتتوزع مبادئ جمعية التمريض الأمريكية (ANA) لتوفير طاقم التمريض على ثلاثة جوانب رئيسية تتعلق بوحدة رعاية المرضى مثل تحليل الاحتياجات الفردية، والجانب المتعلق بالموظفين مثل الكفاءات السريرية والدعم القيادي، والجانب المتعلق بالمؤسسة والمنظمة مثل سياسات العمل التي تقدر الممرضين كأصول استراتيجية.","textEn":"Staffing is defined as the process of ascertaining that adequate numbers and an appropriate mix of personnel are available to meet daily unit needs and organizational goals, and determining and assigning the right personnel with the right qualifications to the job at the right time.\n\nGoals of staffing include appropriate numbers and mix of nursing staff, delivery of effective and efficient nursing care, increase productivity, avoid role confusion and time waste, maintain stability in teamwork, and provide each nursing unit with appropriate workers to give care and comfort to patients.\n\nFactors affecting staffing include patient factors such as patient type, admission fluctuations, length of stay, and complexity of care; staff factors such as personnel policies, educational and experiential levels, and job descriptions; and environmental factors such as number of beds, availability of supplies, and organizational structure.\n\nMethods of calculating staffing include the patient classification system, diagnostic related groups, acuity and complexity of care to estimate nursing care hours needed, and staffing formulas that consider coverage requirements, vacations, holidays, absenteeism, and staff development time.\n\nManpower planning is defined as a strategy for the acquisition, utilization, improvement, and preservation of an organization's human resources, with main objectives including maximum utilization, assessing future requirements, determining recruitment sources, anticipating problems, and determining training requirements.\n\nStaffing philosophies include the organizational theorist view focusing on proper job organization, the industrial engineer view seeing indivi
