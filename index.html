ludes building trust, establishing stronger working relationships, reducing misinformation, helping employees understand the company mission, and improving efficiency.\n\nTypes of organizational communications include vertical communication up and down, horizontal communication, internal, external, oral, and written communication.\n\nElements of effective organizational communication include empathy, clarity, positive communication, assertiveness, and self-reflection.\n\nManaging organizational communication efficiently involves linking the plan to the strategic plan, understanding audiences, engaging employees in two-way conversations, distributing content, and measuring outcomes.\n\nThe importance of effective communication in healthcare includes ensuring continuity of care and enhancing safety using tools like closed-loop communication, SBAR, Five Ps, I PASS the BATON, and read-back technique.","terms":[["Communication","عملية يتم من خلالها تبادل المعلومات بين الأفراد من خلال نظام مشترك من الرموز أو الإشارات.","A process by which information is exchanged between individuals through a common system of symbols or signs."],["Formal communication","خط الاتصال الرسمي لنقل الرسائل والمعلومات الرسمية داخل أو خارج المنظمة.","A line of communication for the transmission of official message and information within or outside the organization."],["Informal communication","التواصل المبني على العلاقات الاجتماعية والروابط الشخصية بين أعضاء المنظمة والمعروف بالشبكة غير الرسمية.","Communication built around the social relationship of the members of the organization, also known as grapevine."],["Organizational communication","المكون الإداري الذي يضم خطط التواصل الاستراتيجية والممارسات لتوجيه وإدارة المعلومات داخلياً وخارجياً.","An important component of management that includes strategic communication plans, documents and practices to channel and manage information."],["Empathy","محاولة تقمص شخصية الآخر لفهم مشاعره وأفكاره ووجهات نظره.","Stepping into the shoes of the other, to comprehend their feelings, thoughts and perspectives."],["Assertiveness","طريقة فعالة للتعبير عن الأفكار والمشاعر بوضوح ومباشرة وباحترام دون إصدار أحكام.","An effective way to express thoughts and feelings clearly and directly without judging others."],["SBAR","أداة تواصل مستخدمة في الرعاية الصحية وتتكون من الموقف، والخلفية، والتقييم، والتوصية.","A healthcare communication tool standing for situation, background, assessment, recommendation."]],"questions":[{"ar":"ما هو الأصل اللاتيني لكلمة تواصل وماذا تعني؟","en":"What is the Latin origin of the word communication and what does it mean?","optionsAr":["كلمة manager وتعني الإدارة.","كلمة communis وتعني المشاركة.","كلمة organiso وتعني التنظيم.","كلمة motivo وتعني التحفيز."],"optionsEn":["The word manager, meaning management.","The word communis, meaning to share.","The word organiso, meaning to organize.","The word motivo, meaning to motivate."],"correct":1,"whyAr":"ينص الكتاب على أن كلمة التواصل مشتقة من الكلمة اللاتينية communis والتي تعني المشاركة.","whyEn":"The book states that communication is derived from the Latin word communis, meaning to share."},{"ar":"ما هو الاسم الآخر المعروف للتواصل غير الرسمي داخل المنظمات؟","en":"What is the other well-known name for informal communication within organizations?","optionsAr":["تواصل الكروم أو القيل والقال","الاتصال الهرمي التصاعدي","الاتصال الاستراتيجي المكتوب","التواصل الخارجي للعملاء"],"optionsEn":["Grapevine communication","Upward hierarchical communication","Written strategic communication","External customer communication"],"correct":0,"whyAr":"يُذكر في الكتاب أن التواصل غير الرسمي يُعرف أيضاً بتواصل الشبكة غير الرسمية أو القيل والقال.","whyEn":"The book mentions that informal communication is also known as the grapevine communication."},{"ar":"أي من أنواع التواصل التنظيمي يتميز بأنه لا يتبع التسلسل الهرمي وغالباً ما يكون شائعاً في الشركات الناشئة؟","en":"Which type of organizational communication is characterized by not following the hierarchy and is common in startups?","optionsAr":["التواصل العمودي","التواصل الهبوطي الصارم","التواصل الأفقي","التواصل الخارجي الرسمي"],"optionsEn":["Vertical communication","Strict downward communication","Horizontal communication","Formal external communication"],"correct":2,"whyAr":"يوضح الكتاب أن التواصل الأفقي هو الأكثر شيوعاً في الشركات الناشئة حيث لا يُحافظ على التسلسل الهرمي.","whyEn":"The book explains that horizontal communication is most common in startup companies where hierarchy is not maintained."},{"ar":"ما هو العنصر من عناصر التواصل الفعال الذي يعني محاولة وضع النفس مكان الآخر لفهم مشاعره وأفكاره؟","en":"What element of effective communication means trying to put oneself in another's shoes to understand their feelings and thoughts?","optionsAr":["التأمل الذاتي","التواصل الإيجابي","الوضوح","التعاطف"],"optionsEn":["Self-reflection","Positive communication","Clarity","Empathy"],"correct":3,"whyAr":"يُعرّف الكتاب التعاطف بأنه خطو خطوات شخص آخر لفهم مشاعره وأفكاره ومنظوره.","whyEn":"The book defines empathy as stepping into the shoes of the other to comprehend their feelings, thoughts, and perspectives."},{"ar":"ما هي الفائدة الأساسية لتخصيص وقت قصير للتأمل الذاتي للمدير؟","en":"What is the primary benefit of devoting time to self-reflection for a manager?","optionsAr":["زيادة عدد المرضى في الأقسام الداخلية.","إعداد التقارير المالية السنوية للمستشفى.","تهدئة العقل والجسم وتقليل المشتتات وتصفية المساحة العقلية.","سرعة الرد على المكالمات الهاتفية الطارئة."],"optionsEn":["Increasing the number of patients in inpatient units.","Preparing the hospital's annual financial reports.","Calming mind and body, reducing distractions, and clearing mental space.","Quickly answering emergency phone calls."],"correct":2,"whyAr":"ينص الكتاب على أن التأمل الذاتي يساعد في تهدئة العقل والجسم، تقليل المشتتات، وتصفية المساحة العقلية.","whyEn":"The book states that self-reflection helps calm the mind and body, reduce distractions, and clear mental space."},{"ar":"ممرضة رئيسية تريد إبلاغ طاقم التمريض بتعليمات جديدة وصاغت العبارة بإيجابية لتعزيز التركيز على المرضى. أي عنصر استخدمت؟","en":"A head nurse wants to inform staff of new instructions positively to enhance focus on patients. Which element did she use?","optionsAr":["التواصل الإيجابي","الغموض الهيكلي","التواصل غير الرسمي السلبي","العدوانية المباشرة"],"optionsEn":["Positive communication","Structural ambiguity","Negative informal communication","Direct aggression"],"correct":0,"whyAr":"هذا مثال على التواصل الإيجابي المذكور في الكتاب الذي يعزز الانفتاح وتقبل الملاحظات.","whyEn":"This is an example of positive communication mentioned in the book which promotes openness and feedback."},{"ar":"مدير تمريض يواجه مشكلة عدم تناسق المعلومات المرسلة للموظفين. ما هي الخطوة الأولى الصحيحة لإدارة التواصل بكفاءة؟","en":"A nurse manager faces inconsistent communication to employees. What is the correct first step to manage communication efficiently?","optionsAr":["ربط خطة التواصل التنظيمي بالخطة الاستراتيجية للمنظمة.","الاعتماد الكامل على الشائعات غير الرسمية.","إلغاء جميع أجهزة الحاسوب والإنترنت في القسم.","منع الموظفين من تقديم أي نوع من الملاحظات."],"optionsEn":["Linking the organizational communication plan to the strategic plan.","Relying entirely on informal rumors.","Eliminating all computers and internet in the department.","Preventing employees from giving any feedback."],"correct":0,"whyAr":"يشير الكتاب إلى أن إدارة التواصل بكفاءة تبدأ بربط الاتصال بالخطة الاستراتيجية للمنظمة.","whyEn":"The book indicates that managing communication efficiently begins by linking communication to the organization's strategic plan."},{"ar":"أرادت ممرضة في العناية المركزة نقل تقرير حالة مريض حرج بطريقة منظمة تشمل الموقف والخلفية والتقييم والتوصية. ما هي الأداة الموصى بها؟","en":"An ICU nurse wanted to handover a critical patient's condition covering situation, background, assessment, and recommendation. What tool is recommended?","optionsAr":["أداة الجداول الدائرية التنظيمية","نظام تقييم الأداء السنوي","الميزانية الرأسمالية للقسم","أداة SBAR"],"optionsEn":["Circular organizational chart","Annual performance appraisal system","Departmental capital budget","SBAR tool"],"correct":3,"whyAr":"تُعرف أداة SBAR في الكتاب بأنها أداة تواصل تتكون من الموقف، الخلفية، التقييم، والتوصية.","whyEn":"The SBAR tool is defined in the book as a communication tool consisting of situation, background, assessment, and recommendation."},{"ar":"عندما يقوم المدير بالتعبير عن أفكاره ومشاعره بوضوح ومباشرة وباحترام دون إصدار أحكام على الآخرين، ماذا يُسمى هذا السلوك؟","en":"When a manager expresses thoughts and feelings clearly, directly, and respectfully without judging others, what is this behavior called?","optionsAr":["العدوانية المفرطة","التوكيد أو الحزم","التواصل العشوائي","الكمال المطلق"],"optionsEn":["Excessive aggressiveness","Assertiveness","Random communication","Absolute perfection"],"correct":1,"whyAr":"يُعرّف الكتاب الحزم بأنه طريقة فعالة للتعبير عن الأفكار والمشاعر بوضوح ومباشرة وباحترام دون إصدار أحكام.","whyEn":"The book defines assertiveness as an effective way to express thoughts and feelings clearly and directly without judging others."},{"ar":"لماذا يُعتبر التواصل ثنائي الاتجاه في بيئة العمل أمراً بالغ الأهمية؟","en":"Why is two-way communication in the work environment considered crucial?","optionsAr":["لإشراك جميع الموظفين في محادثات ثنائية الاتجاه كجزء من الإدارة الفعالة.","لأنه يلغي الحاجة للمقابلات الفردية.","لأنه يقتصر على إرسال الأوامر العليا دون رد.","لأنه يمنع أي نقاش أو تساؤل من قِبل المرؤوسين."],"optionsEn":["Engaging all employees in two-way conversations.","Because it eliminates the need for one-on-one interviews.","Because it is restricted to sending top orders without response.","Because it prevents any discussion or questioning by subordinates."],"correct":0,"whyAr":"يؤكد الكتاب على أهمية إشراك جميع الموظفين في محادثات ثنائية الاتجاه ضمن إدارة التواصل.","whyEn":"The book emphasizes engaging all employees in two-way conversations as part of managing communication."},{"ar":"أي من الأدوات التالية يُستخدم في الرعاية الصحية لضمان وضوح الأوامر من خلال كتابتها وقراءتها والتحقق منها؟","en":"Which of the following tools is used in healthcare to ensure order clarity by writing them down, reading them back, and verifying them?","optionsAr":["نظام الحفظ الضعيف للملفات","تقنية الكتابة والقراءة والتحقق","خرائط السلاسل الزمنية للوقت","تقنية تحليل باريتو للأخطاء"],"optionsEn":["Poor file storage system","Write down, read back, and verify technique","Time series charts","Pareto error analysis technique"],"correct":1,"whyAr":"يذكر الكتاب تقنية الكتابة والقراءة والتحقق كأحد الأدوات والاستراتيجيات في الرعاية الصحية.","whyEn":"The book mentions the write down, read back, and verify technique as a healthcare strategy."},{"ar":"ما هو التأثير السلبي لعدم قيام المنظمات بقياس نتائج خطط التواصل الخاصة بها؟","en":"What is the negative effect of organizations failing to measure their communication plans' outcomes?","optionsAr":["عدم القدرة على قياس النتائج واستخدام البيانات للتحسين.","زيادة الميزانية المالية للمستشفى تلقائياً.","انخفاض عدد المرضى الراغبين في العلاج.","القضاء على كافة الأخطاء التمريضية بشكل سحري."],"optionsEn":["Inability to measure outcomes and use data for improvement.","Automatic increase in the hospital's financial budget.","Decrease in patients wishing to be treated.","Magical elimination of all nursing errors."],"correct":0,"whyAr":"يشير الكتاب إلى أهمية قياس النتائج واستخدام البيانات للتحسين، مما يعني أن عدم قياسها يعيق ذلك.","whyEn":"The book points to the importance of measuring outcomes and using data for improvement."},{"ar":"إذا أردت كمدير تمريض توزيع المحتوى عبر القنوات المناسبة بناءً على البيانات، فماذا تتبع؟","en":"If you want to distribute content through appropriate channels based on data, what do you follow?","optionsAr":["إيقاف جميع أشكال التكنولوجيا والاعتماد على الورق فقط.","منع الموظفين من مشاهدة أي مقاطع فيديو.","الاعتماد حصراً على الخطابات البريدية المكتوبة بخط اليد.","توزيع المحتوى عبر القنوات المناسبة وتطبيق التكنولوجيا الملائمة."],"optionsEn":["Stop all forms of technology and rely solely on paper.","Prevent employees from watching any videos.","Rely exclusively on handwritten postal letters.","Distributing content through right channels and implementing communication technology."],"correct":3,"whyAr":"يوضح الكتاب ضرورة توزيع المحتوى عبر القنوات المناسبة وتنفيذ تكنولوجيا التواصل الملائمة.","whyEn":"The book clarifies the need to distribute content through right channels and implement appropriate communication technology."},{"ar":"ما هو الغرض من استخدام أدوات مثل تقنية آي باس الباتون في الرعاية الصحية؟","en":"What is the purpose of using tools like I PASS the BATON in healthcare?","optionsAr":["تنظيم مواعيد الإجازات السنوية للممرضين.","إدارة الميزانية الرأسمالية للمستشفى.","تحديد أجور الموظفين والبدلات الشهرية.","تعزيز جودة الرعاية الصحية وسلامة المرضى ضمن الاستراتيجيات المخدمة."],"optionsEn":["Organizing annual vacation schedules for nurses.","Managing the hospital's capital budget.","Determining employee wages and monthly allowances.","Enhancing healthcare quality and patient safety."],"correct":3,"whyAr":"تُصنف التقنية في الكتاب ضمن الأدوات والاستراتيجيات المستخدمة لتعزيز جودة الرعاية الصحية وسلامة المرضى.","whyEn":"The technique is classified in the book among tools and strategies used to enhance healthcare quality and patient safety."},{"ar":"أي من العبارات الآتية تصف دور التواصل الفعال في تقليل الأخطاء في بيئة العمل التمريضية؟","en":"Which of the following describes the role of effective communication in reducing errors in nursing?","optionsAr":["يؤدي إلى زيادة الأوراق المعاملاتية وتأخير اتخاذ القرار.","يلغي تماماً حاجة الموظفين لحضور الاجتماعات.","تقليل سوء الفهم والمعلومات الخاطئة وتحسين الكفاءة وتقليل الأخطاء المكلفة.","زيادة احتمالية حدوث نزاعات مستمرة بين الأقسام."],"optionsEn":["It leads to increased transactional paperwork and delayed decision-making.","It completely eliminates the need for employees to attend meetings.","Reducing misinformation and misunderstanding, improving efficiency and reducing costly errors.","It increases the likelihood of continuous interdepartmental conflicts."],"correct":2,"whyAr":"يذكر الكتاب أن التواصل الفعال يقلل سوء الفهم والمعلومات الخاطئة ويحسن الكفاءة ويقلل الأخطاء المكلفة.","whyEn":"The book mentions that effective communication reduces misinformation and misunderstanding, improving efficiency and reducing costly errors."}]},{"id":11,"ar":"التوجيه","en":"Directing","pages":"178–193","summaryAr":"يتناول هذا الفصل مفهوم التوجيه (Directing) كأحد الوظائف الإدارية الرئيسية التي تضمن وضع الخطط التنظيمية موضع التنفيذ من خلال توجيه عمل المرؤوسين، وعناصر التوجيه المختلفة كالرقابة والإشراف والقيادة والتحفيز والتواصل والإدارة بالأهداف، ودور مدير التمريض في تطبيق التوجيه بفعالية.","summaryEn":"This chapter covers directing as a core management function that ensures organizational plans are put into action through directing subordinates' work, its various elements such as supervision, leadership, motivation, communication, and management by objectives, and the nurse manager's role in applying directing effectively.","textAr":"يُعد التوجيه (Directing) وظيفة إدارية تلعب دوراً محورياً في ضمان وضع الخطط التنظيمية موضع التنفيذ من خلال توجيه عمل المرؤوسين بواسطة المديرين، وهو يشجع تقنيات القيادة والتحفيز والتواصل ويؤكد على الجوانب الإنسانية لإدارة الأفراد الفرق لتنفيذ المهام والأنشطة بما يتوافق مع الاستراتيجية الشاملة للمنظمة.\n\nيُعرّف التوجيه بأنه المكون الحاسم في عملية الإدارة الخاصة بتوجيه والإشراف والتأثير على الموظفين والموارد داخل المنظمة لتحقيق أهداف وغايات بفعالية وكفاءة، ويتمثل غرضه في توجيه سلوك جميع العاملين لإنجاز رسالة وأهداف المنظمة بالتزامن مع مساعدتهم في تحقيق أهدافهم المهنية الخاصة.\n\nتتعدد أهمية التوجيه لتشمل زيادة مساهمات المرؤوسين في تحقيق أهداف إدارة التمريض، وخلق انسجام بين أهداف إدارة التمريض وأهداف العاملين فيها، والعمل كمهدد وموجه وميسر من قِبل مدير التمريض.\n\nتشمل عناصر التوجيه (Elements of directing) خمسة عناصر رئيسية هي الإشراف (Supervision) لتوفير التوجيه والإرشاد للعمل، والقيادة (Leadership) للتأثير في الآخرين، والتحفيز (Motivation) لإلهام الأفراد لزيادة رغبتهم في بذل أقصى طاقاتهم، والتواصل (Communication) لتبادل المعلومات والوصول لفهم مشترك، والإدارة بالأهداف (Management by Objectives) كإطار منهجي لتقييم الأداء ووضع الأهداف.\n\nيستطيع المدير الإشراف والتوجيه عبر تقنيات تشمل الملاحظة، والتفويض، وخلق بيئة محفزة، وتطوير الموظفين، والإدارة بالأهداف. كما يمكن للمدير القيادة وتوجيه المرؤوسين عبر خلق رؤية قوية، وتوضيح مسار واضح، وممارسة التواصل الشخصي الممتاز، واكتساب القناعة، والحفاظ على الرؤية، وخلق وحدة الغرض ومواءمتها مع الثقافة التنظيمية.\n\nتعتمد الإدارة بالأهداف (Management by Objectives) التي اشتهر بها بيتر دراكر على مبادئ تشمل وضع الأهداف، والعملية التشاركية، وتقييم الأداء، وتقييم الأداء والمكافآت، والتغذية الراجعة والتواصل، والمرونة، والالتزام.\n\nيتلخص دور وتطبيق مدير التمريض للتوجيه بحسب نطاق إشرافه في قيادة أفراد التمريض باستخدام نمط قيادي مناسب، والعمل كقدوة حسنة، وتفويض السلطة، والإشراف على العاملين، وخلق بيئة عمل مواتية، واستخدام طريقة التوزيع الملائمة لأعداد المرضى ومستوى حدتهم، والإشراف على تدفق الاتصالات، وحل النزاعات.","textEn":"Directing is a management function which plays a pivotal role in ensuring that organizational plans are put into action through directing the work of subordinates by managers, encouraging leadership, motivation, and communication techniques.\n\nDirecting is defined as a crucial component of the management process of guiding, supervising, and influencing employees and resources within an organization to achieve its goals effectively and efficiently, aiming to channel personnel behavior to accomplish the mission and objectives.\n\nThe importance of directing includes increasing subordinates' contributions to goals, creating harmony between nursing management and worker goals, and acting as a facilitator and coach.\n\nElements of directing include supervision to provide guidance, leadership to influence others, motivation to inspire willingness to use capabilities, communication to reach common understanding, and management by objectives as a systematic performance framework.\n\nA manager supervises and directs subordinates through techniques such as observation, delegation, creating a motivating environment, staff development, and MBO, and leads through creating a strong vision, articulating a clear course, practicing communication, and earning conviction.\n\nManagement by Objectives (MBO) principles include goal setting, participative process, performance evaluation, performance appraisal, feedback and communication, flexibility, and commitment.\n\nThe role and application of directing by the nurse manager include leading nursing personnel using a suitable leadership style, acting as a role model, delegating authority, supervising personnel, creating a conducive environment, using appropriate assignment methods, supervising communication flow, and resolving conflicts.","terms":[["Directing","وظيفة إدارية تضمن وضع الخطط موضع التنفيذ من خلال توجيه عمل المرؤوسين وتشجيع القيادة والتحفيز والتواصل.","A management function which plays a pivotal role in ensuring that organizational plans are put into action through directing the work of subordinates."],["Supervision","تقديم التوجيه والإرشاد للعمل من أجل تحقيق غرض معين باستخدام الملاحظة والتفويض.","Involves providing guidance and direction to the work in order to achieve a certain purpose."],["Leadership","التأثير في الآخرين وجعلهم يفهمون ويؤمنون برؤية القائد للعمل معه لتحقيق الأهداف.","Refer to influence others in a manner to do what the leader wants them to do and getting people to understand and believe in the leader vision."],["Motivation","القوى التي تلهم الشخص في العمل على تكثيف رغبته في استخدام أفضل قدراته لتحقيق أهداف محددة.","Forces that inspire a person at work to intensify his willingness to use the best of his capability for achievement of specific objectives."],["Management by Objectives","فلسفة إدارية وإطار لتقييم الأداء يؤكد على وضع الأهداف، والمشاركة، وتقييم الأداء، والتغذية الراجعة المنتظمة.","A management philosophy and performance management framework that emphasizes goal setting, participation, performance evaluation, and regular feedback."]],"questions":[{"ar":"ما هو التعريف الدقيق لوظيفة 'التوجيه' (Directing) كما ورد في الكتاب؟","en":"What is the exact definition of 'directing' as stated in the book?","optionsAr":["عملية تسجيل الحضور والانصراف للعاملين في المستشفى.","المكون الحاسم في عملية الإدارة الخاصة بتوجيه والإشراف والتأثير على الموظفين والموارد لتحقيق الأهداف بفعالية.","وضع القواعد القانونية للوزارة.","تحديد تكلفة المستلزمات الطبية والمالية للوحدة."],"optionsEn":["The process of recording attendance and departure for hospital workers.","A crucial component of the management process of guiding, supervising, and influencing employees and resources within an organization to achieve its goals effectively and efficiently.","Establishing the legal rules of the ministry.","Determining the cost of medical and financial supplies for the unit."],"correct":1,"whyAr":"يُعرف الكتاب التوجيه بأنه المكون الحاسم في عملية الإدارة الخاصة بتوجيه والإشراف والتأثير على الموظفين والموارد داخل المنظمة لتحقيق أهدافها بفعالية وكفاءة.","whyEn":"The book defines directing as a crucial component of the management process of guiding, supervising, and influencing employees and resources within an organization to achieve its goals effectively and efficiently."},{"ar":"ما هي العناصر الأساسية لوظيفة التوجيه (Elements of directing) المذكورة في الفصل؟","en":"What are the core elements of directing mentioned in the chapter?","optionsAr":["التقسيم الإداري، التفويض، التخصص، المركزية، اللامركزية.","التخطيط، التنظيم، التوظيف، الميزانية، الرقابة.","التحفيز الخارجي، التسويف، الكمال، زيارات الزوار، التقارير.","الإشراف، القيادة، التحفيز، التواصل، الإدارة بالأهداف."],"optionsEn":["Departmentation, Delegation, Specialization, Centralization, Decentralization.","Planning, Organizing, Staffing, Budgeting, Controlling.","Extrinsic motivation, procrastination, perfectionism, visitors, reports.","Supervision, Leadership, Motivation, Communication, Management by Objectives."],"correct":3,"whyAr":"يذكر الكتاب أن عناصر التوجيه تتكون من: الإشراف، القيادة، التحفيز، التواصل، والإدارة بالأهداف.","whyEn":"The book states that the elements of directing consist of supervision, leadership, motivation, communication, and management by objectives."},{"ar":"من هو الشخص الذي اشتهر بترويج مفهوم 'الإدارة بالأهداف' (MBO) في كتابه عام 1954؟","en":"Who popularized the concept of Management by Objectives (MBO) in his 1954 book?","optionsAr":["بيتر دراكر (Peter Drucker)","دوايت أيزنهاور (Dwight D. Eisenhower)","جورج تيري (George Terry)","بروس توكمان (Bruce Tuckman)"],"optionsEn":["Peter Drucker","Dwight D. Eisenhower","George Terry","Bruce Tuckman"],"correct":0,"whyAr":"يشير الكتاب صراحةً إلى أن الإدارة بالأهداف (MBO) هي فلسفة إدارية تم تعميمها بواسطة خبير الإدارة بيتر دراكر في كتابه الصادر عام 1954.","whyEn":"The book explicitly states that Management by Objectives (MBO) was popularized by management guru Peter Drucker in his 1954 book."},{"ar":"أي من الخيارات التالية يُعد غرضاً أساسياً لعملية التوجيه في المنظمات الصحية؟","en":"Which of the following is considered a primary purpose of directing in healthcare organizations?","optionsAr":["خفض أجور الموظفين للحد الأدنى لتوفير ميزانية المستشفى.","منع الموظفين من المشاركة في وضع خطط الأقسام.","إلغاء الحاجة لوجود قنوات اتصال رسمية.","توجيه سلوك جميع العاملين لإنجاز رسالة وأهداف المنظمة بالتزامن مع مساعدتهم في تحقيق أهدافهم المهنية."],"optionsEn":["Reducing employee wages to the minimum to save the hospital budget.","Preventing employees from participating in departmental plans.","Eliminating the need for formal communication channels.","To channel the behavior of all personnel to accomplish the organization's mission and objectives while helping them accomplish their own career objectives."],"correct":3,"whyAr":"يوضح الكتاب أن الغرض من التوجيه هو توجيه سلوك جميع العاملين لإنجاز رسالة وأهداف المنظمة بالتزامن مع مساعدتهم في تحقيق أهدافهم المهنية.","whyEn":"The book explains that the purpose of directing is to channel the behavior of all personnel to accomplish the organization's mission and objectives while simultaneously helping them accomplish their own career objectives."},{"ar":"كيف يُعرّف الكتاب 'القيادة' (Leadership) كعنصر من عناصر التوجيه؟","en":"How does the book define 'leadership' as an element of directing?","optionsAr":["التركيز الحصري على مراجعة الفواتير المالية.","التأثير في الآخرين بطريقة تجعلهم يفعلون ما يريد القائد فعله وجعلهم يؤمنون برؤيته.","إصدار عقوبات مالية صارمة عند حدوث أي خطأ في الوحدة.","مراقبة حضور الموظفين عبر كاميرات المراقبة."],"optionsEn":["Focusing exclusively on reviewing financial invoices.","Referring to influence others in a manner to do what the leader wants them to do and getting people to understand and believe in the leader's vision.","Issuing strict financial penalties when any error occurs in the unit.","Monitoring employee attendance via surveillance cameras."],"correct":1,"whyAr":"يُعرّف الكتاب القيادة بأنها التأثير في الآخرين بطريقة تجعلهم يفعلون ما يريد القائد، وهي تتعلق بجعل الناس يفهمون ويؤمنون برؤية القائد للعمل معه.","whyEn":"The book defines leadership as referring to influencing others in a manner to do what the leader wants them to do, getting people to understand and believe in the leader's vision."},{"ar":"مديرة تمريض لاحظت وجود تباين وفجوة بين أهداف إدارة التمريض وأهداف العاملين في القسم، مما أثر سلباً على الأداء. أي من فوائد التوجيه الفعال يمكن أن يحل هذه المشكلة؟","en":"A nurse manager noticed a gap between nursing management goals and staff goals, negatively affecting performance. Which benefit of effective directing can solve this problem?","optionsAr":["إلغاء نظام تقييم الأداء السنوي.","تقليص عدد العاملين في الوردية الليلية.","إصدار قرارات فصل إدارية بحق الموظفين غير الملتزمين.","خلق انسجام وتوافق بين أهداف إدارة التمريض وأهداف العاملين (Harmony between goals)."],"optionsEn":["Canceling the annual performance evaluation system.","Reducing the number of workers on the night shift.","Issuing administrative dismissal decisions against non-compliant employees.","Creating harmony between nursing management goals and nursing workers' goals."],"correct":3,"whyAr":"يذكر الكتاب ضمن أهمية التوجيه أن التوجيه الفعال يخلق انسجاماً وتوافقاً بين أهداف إدارة التمريض وأهداف العاملين.","whyEn":"The book mentions among the importance of directing that effective directing creates harmony between nursing management goals and nursing workers' goals."},{"ar":"أراد مدير تمريض استخدام التقنيات الصحيحة للإشراف على مرؤوسيه في الوحدة وفقاً لما ورد في الفصل. أي من الآتي يمثل إحدى تقنيات الإشراف المذكورة؟","en":"A nurse manager wanted to use the correct techniques to supervise subordinates in the unit according to the chapter. Which of the following represents one of the mentioned supervision techniques?","optionsAr":["الاعتماد على التقارير الخارجية فقط وتجنب النزول للقسم.","الملاحظة والتفويض وخلق بيئة محفزة وتطوير الموظفين.","التجاهل التام لأخطاء العاملين وعدم التدخل.","فرض جداول مناوبات عشوائية دون استشارة."],"optionsEn":["Relying solely on external reports and avoiding visiting the unit.","Observation, delegation, creating a motivating environment, and staff development.","Completely ignoring workers' mistakes and not interfering.","Imposing random shift schedules without consultation."],"correct":1,"whyAr":"يوضح الكتاب أن تقنيات الإشراف تشمل: الملاحظة، التفويض، خلق بيئة محفزة، تطوير الموظفين، والإدارة بالأهداف.","whyEn":"The book explains that supervision techniques include observation, delegation, creating a motivating environment, staff development, and management by objectives."},{"ar":"ممرضة رئيسية تريد تطبيق مبادئ الإدارة بالأهداف (MBO) في قسمها، فما هي أول خطوة أساسية يجب عليها البدء بها مع مرؤوسيها؟","en":"A head nurse wants to apply Management by Objectives (MBO) principles in her department. What is the first essential step she must start with her subordinates?","optionsAr":["وضع الأهداف (Goal Setting) وتحديد أهداف واضحة ومحددة للقسم والأفراد.","توقيع جزاءات مالية فورية عند التأخير.","إغلاق قسم التمريض وإعادة هيكلته بالكامل.","منح إجازات مفتوحة دون تحديد أهداف."],"optionsEn":["Goal Setting (establishment of clear and specific objectives for the organization, departments, and employees).","Imposing immediate financial penalties for tardiness.","Closing the nursing department and completely restructuring it.","Granting open leaves without setting objectives."],"correct":0,"whyAr":"تتضمن مبادئ الإدارة بالأهداف (MBO) كخطوة أولى أساسية وضع الأهداف (Goal Setting) وتأسيس أهداف واضحة ومحددة.","whyEn":"MBO principles include goal setting (establishment of clear and specific objectives for the organization, its departments, and individual employees) as the first foundational component."},{"ar":"كيف يمارس مدير التمريض 'التواصل' الفعال لتوجيه المرؤوسين بشكل صحيح عند إعطاء التوجيهات؟","en":"How does a nurse manager practice effective 'communication' to direct subordinates properly when giving instructions?","optionsAr":["الاعتماد على إرسال الإشارات المبهمة وغير المباشرة.","التحدث طوال الوردية دون السماح للممرضات بالحديث.","تجنب التواصل البصري نهائياً أثناء الاجتماعات.","قول الخلاصة باختصار، معرفة متلقي الرسالة، والاستماع الجيد مع إظهار علامات الإنصات."],"optionsEn":["Relying on sending vague and indirect signals.","Talking throughout the shift without allowing nurses to speak.","Avoiding eye contact completely during meetings.","Speaking the gist concisely, knowing message recipients, and listening well with listening gestures."],"correct":3,"whyAr":"يشير الكتاب إلى أن المدير يوجه عبر التواصل من خلال قول الخلاصة باختصار، معرفة متلقي الرسالة، والاستماع الفعال مع إظهار إيماءات الإنصات والتواصل البصري.","whyEn":"The book indicates that managers communicate and direct by speaking the gist concisely, knowing recipients, listening, and showing gestures like nodding and eye contact."},{"ar":"ممرضة تعمل مشرفة وتواجه مشكلات متكررة وصراعات بين طاقم التمريض في الوردية الصباحية. وفقاً لدور مدير التمريض في التوجيه، كيف يجب أن تتعامل مع هذا الموقف؟","en":"A nurse working as a supervisor faces frequent problems and conflicts among the nursing staff on the day shift. According to the nurse manager's role in directing, how should she handle this situation?","optionsAr":["فصل جميع الموظفين المتورطين في النزاع فوراً.","حل نزاعات الممرضات باستخدام الآلية المناسبة.","تجاهل النزاع تماماً وتركه يتفاقم بين الموظفين.","الانسحاب من القسم وتجنب الحضور صباحاً."],"optionsEn":["Immediately dismissing all employees involved in the conflict.","Resolving nurses' conflicts through using appropriate mechanisms.","Completely ignoring the conflict and letting it worsen among employees.","Withdrawing from the department and avoiding morning presence."],"correct":1,"whyAr":"ينص الكتاب ضمن تطبيق التوجيه من قِبل مدير التمريض على حل نزاعات الممرضات باستخدام الآلية المناسبة.","whyEn":"The book states under the application of directing by the nurse manager to resolve nurses' conflicts through using appropriate mechanisms."},{"ar":"أي من الخيارات التالية يمثل إحدى الطرق التي يتبعها المدير لكسب 'القناعة' (Earn conviction) وتوجيه مرؤوسيه قيادياً؟","en":"Which of the following represents a way a manager earns conviction and leads subordinates?","optionsAr":["إجبارهم على طاعة الأوامر بالقوة الجبرية.","اكتساب ثقة واعتقاد المرؤوسين (Gain the trust and belief of subordinates).","حرمانهم من حقوق الإجازات السنوية.","رفض الاستماع لأي مقترحات تطويرية."],"optionsEn":["Forcing them to obey orders by coercive power.","Gain the trust and belief of subordinates.","Depriving them of annual leave rights.","Refusing to listen to any developmental proposals."],"correct":1,"whyAr":"يُبين الكتاب أن كسب القناعة (Earn conviction) يعني كسب ثقة واعتقاد المرؤوسين كإحدى طرق القيادة وتوجيه المرؤوسين.","whyEn":"The book shows that earning conviction means gaining the trust and belief of subordinates as a way of leading and directing."},{"ar":"عندما يقوم مدير التمريض بتوفير تجارب تعلم تساعد في تحسين أداء الممرضات، فهذا يندرج تحت أي من مهامه في التوجيه؟","en":"When a nurse manager provides learning experiences to help improve nurses' performance, this falls under which of their directing duties?","optionsAr":["خلق التجربة التعليمية التي تساعد على تحسين أداء الممرض (Create the learning experience that helps to improve the nurse performance).","مراقبة شراء الأجهزة الطبية الباهظة.","إعداد الميزانية الرأسمالية السنوية للمستشفى.","تحديد أعداد الأسرة المطلوبة في الطوارئ."],"optionsEn":["Creating the learning experience that helps to improve the nurse performance.","Monitoring the purchase of expensive medical devices.","Preparing the hospital's annual capital budget.","Determining the number of required beds in emergency."],"correct":0,"whyAr":"يُدرج الكتاب خلق التجربة التعليمية التي تحسن أداء الممرض ضمن التطبيق العملي لوظيفة التوجيه من قِبل مدير التمريض.","whyEn":"The book lists creating the learning experience that helps to improve the nurse performance under the practical application of directing by the nurse manager."},{"ar":"كيف يحقق مدير التمريض 'وحدة الغرض' (Unity of purpose) بين أعضاء الفريق التمريضي أثناء عملية التوجيه؟","en":"How does a nurse manager achieve 'unity of purpose' among nursing team members during the directing process?","optionsAr":["من خلال إعطاء كل ممرض مهام تعارض مهام الزميل الآخر.","من خلال خلق هدف موحد بين أعضاء الفريق.","منع التواصل الجماعي تماماً في القسم.","عبر تشجيع المنافسة السلبية والعداء الشخصي."],"optionsEn":["Through giving each nurse tasks conflicting with colleagues.","Through creating a unified goal among team members.","Completely preventing group communication in the unit.","By encouraging negative competition and personal hostility."],"correct":1,"whyAr":"يُعرّف الكتاب وحدة الغرض (Unity of Purpose) بأنها خلق هدف موحد بين أعضاء الفريق.","whyEn":"The book defines unity of purpose as creating a unified goal among team members."},{"ar":"أي من الخيارات التالية يُعد شرطاً أساسياً لنجاح نظام الإدارة بالأهداف (MBO) في تقييم أداء العاملين وتوجيههم؟","en":"Which of the following is considered an essential prerequisite for the success of MBO in evaluating and directing employee performance?","optionsAr":["ربط الأهداف بالعقوبات الجزائية فقط.","تجاهل التغذية الراجعة الدورية نهائياً.","العملية التشاركية (Participative Process) وإشراك الموظفين في وضع الأهداف.","فرض الأهداف من الإدارة العليا دون أي نقاش."],"optionsEn":["Linking objectives solely to punitive sanctions.","Completely ignoring regular feedback.","Participative Process (involving employees in the goal-setting process).","Imposing goals from top management without any discussion."],"correct":2,"whyAr":"تُعد العملية التشاركية (إشراك الموظفين في وضع الأهداف) أحد المبادئ الأساسية لنجاح نظام الإدارة بالأهداف وتوجيههم بفعالية.","whyEn":"The participative process (involving employees in the goal-setting process) is one of the essential principles for the success of MBO and effective direction."},{"ar":"ممرضة رئيسية تحاول توجيه العاملين في قسمها عبر إرسال رسالة واضحة تربط رؤية القسم بالثقافة التنظيمية للمستشفى. ماذا يُسمى هذا المبدأ القيادي في التوجيه؟","en":"A head nurse tries to direct workers in her department by sending a clear message linking the department's vision to the hospital's organizational culture. What is this leadership principle in directing called?","optionsAr":["التسويف الإداري المستمر.","مواءمة الرؤية والثقافة (Harmonize Vision / Align the vision with the organizational culture).","المركزية المطلقة في إصدار القرارات.","الابتعاد عن التواصل الشخصي مع الموظفين."],"optionsEn":["Continuous administrative procrastination.","Harmonize Vision (Align the vision with the organizational culture).","Absolute centralization in decision making.","Avoiding personal communication with employees."],"correct":1,"whyAr":"يُطلق على مطابقة الرؤية مع الثقافة التنظيمية اسم (Harmonize Vision) ضمن الطرق التي يقود بها المدير ويوجه مرؤوسيه.","whyEn":"Aligning the vision with the organizational culture is termed 'Harmonize Vision' among the ways a manager leads and directs subordinates."}]},{"id":12,"ar":"بناء فرق العمل","en":"Team Building","pages":"194–216","summaryAr":"يتناول هذا الفصل مفهوم الفريق وعملية بناء فرق العمل، والفروق بين المجموعة وفريق العمل، ومراحل تطور الفريق وفق نموذج بروس توكمان، واستراتيجيات بناء الفريق، والأدوار داخله، وأنواع الفرق المختلفة.","summaryEn":"This chapter covers the concept of a team and team building, the differences between a group and a team, stages of team development according to Bruce Tuckman's model, team building strategies, various team roles, and different types of teams.","textAr":"يُعرّف الفريق بأنه مجموعة من الأفراد الذين يجتمعون للتعاون والعمل بشكل جماعي نحو هدف أو غاية مشتركة[span_0](start_span)[span_0](end_span). يمتلك أعضاء الفريق مهارات وأدواراً متكاملة مع صفات مثل التماسك والثقة[span_1](start_span)[span_1](end_span).\n\nتُعرف عملية بناء الفريق بأنها عملية جمع الأشخاص المناسبين وجعلهم يعملون معاً لصالح المشروع[span_2](start_span)[span_2](end_span). تبرز أهمية بناء الفريق في تحسين التعاون، وحل المشكلات، وزيادة الإنتاجية، ورفع الروح المعنوية، وبناء الثقة[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span).\n\nتوجد فروق بين المجموعة والفريق؛ فالمجموعة تفتقر للترابط الجماعي المتبادل ومخرجاتها فردية، بينما الفريق يتميز بالاعتماد المتبادل ومخرجاته جماعية[span_5](start_span)[span_5](end_span).\n\nتتضمن مراحل تطور الفريق نموذج بروس توكمان: التكوين، والعصف، والتطبيع أو التشكيل، والأداء، والإنهاء[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span)[span_8](start_span)[span_8](end_span)[span_9](start_span)[span_9](end_span)[span_10](start_span)[span_10](end_span)[span_11](start_span)[span_11](end_span).\n\nتتنوع استراتيجيات بناء الفريق لتشمل استخدام أنشطة كسر الجليد، وتحديات حل المشكلات، والسلامة النفسية، وإدارة النزاعات، وتطوير ميثاق الفريق[span_12](start_span)[span_12](end_span)[span_13](start_span)[span_13](end_span)[span_14](start_span)[span_14](end_span).\n\nتتعدد الأدوار اللازمة لعمل الفريق لتشمل قائد الفريق، وميسر الفريق، ومسجل الفريق، ومراقب الوقت، والأعضاء[span_15](start_span)[span_15](end_span)[span_16](start_span)[span_16](end_span).\n\nتتنوع أنواع الفرق لتشمل الفرق التقليدية، والفرق ذاتية التوجيه، والفرق الوظيفية، والفرق متعددة الوظائف، وفرق المشاريع، والفرق الافتراضية، وفرق تحسين الجودة[span_17](start_span)[span_17](end_span)[span_18](start_span)[span_18](end_span)[span_19](start_span)[span_19](end_span).","textEn":"A team is a group of individuals who come together to collaborate toward a common goal, typically having complementary skills and cohesion[span_20](start_span)[span_20](end_span).\n\nTeam building is the process of gathering the right people to work together for a project's benefit, improving collaboration, problem-solving, productivity, and morale[span_21](start_span)[span_21](end_span)[span_22](start_span)[span_22](end_span)[span_23](start_span)[span_23](end_span).\n\nThe difference between a group and a team lies in interdependence and collective work products versus individual ones[span_24](start_span)[span_24](end_span).\n\nStages of team development follow Bruce W. Tuckman's model: forming, storming, norming, performing, and adjourning[span_25](start_span)[span_25](end_span)[span_26](start_span)[span_26](end_span)[span_27](start_span)[span_27](end_span)[span_28](start_span)[span_28](end_span)[span_29](start_span)[span_29](end_span)[span_30](start_span)[span_30](end_span).\n\nTeam building strategies include icebreakers, problem-solving challenges, psychological safety, conflict management, and developing a team charter[span_31](start_span)[span_31](end_span)[span_32](start_span)[span_32](end_span)[span_33](start_span)[span_33](end_span).\n\nRoles that keep a team operating smoothly include the team leader, facilitator, recorder, timekeeper, and members[span_34](start_span)[span_34](end_span)[span_35](start_span)[span_35](end_span).\n\nTypes of teams include traditional, self-directed, functional, cross-functional, project, virtual, and quality improvement teams[span_36](start_span)[span_36](end_span)[span_37](start_span)[span_37](end_span)[span_38](start_span)[span_38](end_span).","terms":[["Team building","عملية جمع الأشخاص المناسبين وجعلهم يعملون معاً لصالح المشروع.","The process of gathering the right people and getting them to work together for the benefit of a project."],["Forming","مرحلة التكوين التي يتعرف فيها أعضاء الفريق على بعضهم وتكون تفاعلاتهم حذرة.","The initial stage where team members get to know each other and are cautious in interactions."],["Storming","مرحلة العصف التي تتسم بالصراع والتوتيرات بين أعضاء الفريق.","The stage marked by conflict and tension as team members express opinions and preferences."],["Norming","مرحلة التطبيع التي يبدأ فيها الأعضاء بحل الخلافات وبناء الثقة وتطوير معايير السلوك.","The stage where team members resolve differences, build trust, and develop norms."],["Performing","مرحلة الأداء التي يعمل فيها الفريق بسلاسة وكفاءة عالية وبشكل ذاتي نحو الأهداف.","The stage where high-performing teams work seamlessly and efficiently to achieve goals."],["Adjourning","مرحلة الإنهاء التي ينحل فيها الفريق أو يكمل مشروعه.","The final stage where the team disbands or completes its project."],["Team charter","مستند يحدد هدف الفريق، وأهدافه، وقيمه، والسلوكيات المتوقعة.","A document that outlines the team's purpose, goals, values, and expected behaviors."]],"questions":[{"ar":"ما هو التعريف الدقيق لعملية بناء الفريق كما ورد في الكتاب؟","en":"What is the exact definition of team building as stated in the book?","optionsAr":["تقييم الأداء الفردي للممرضات في نهاية العام.","توزيع الميزانية المالية السنوية للمستشفى على الأقسام.","وضع القواعد القانونية المنظمة لعمل الوزارة.","عملية جمع الأشخاص المناسبين وجعلهم يعملون معاً لصالح المشروع[span_39](start_span)[span_39](end_span)."],"optionsEn":["Evaluating nurses' individual performance at the end of the year.","Distributing the hospital's annual financial budget to departments.","Establishing legal rules organizing ministry work.","The process of gathering the right people and getting them to work together for the
