م إدارة الوقت كما ورد في الكتاب؟","en":"Which of the following is the correct explanation of time management as stated in the book?","optionsAr":["الاستفادة المثلى من الوقت المتاح لتحقيق أقصى قدر من الإنتاجية.","العمل المستمر دون أخذ أي فترات راحة طوال اليوم.","التركيز على المهام الشخصية وترك مهام التمريض للمرؤوسين.","إلغاء الاجتماعات وجداول المناوبات تماماً."],"optionsEn":["Making an optimal use of available time for maximum productivity.","Working continuously without taking any breaks throughout the day.","Focusing on personal tasks and leaving nursing tasks to subordinates.","Completely canceling meetings and shift schedules."],"correct":0,"whyAr":"ينص الكتاب على أن إدارة الوقت هي إدارة الوقت بفعالية بحيث يخصص الوقت المناسب للنشاط المناسب أو الاستفادة المثلى من الوقت المتاح لزيادة الإنتاجية.","whyEn":"The book states that time management is managing time effectively so that the right time is allocated to the right activity, or making optimal use of available time for maximum productivity."},{"ar":"ماذا يُقصد بمفهوم 'مضيع الوقت' (Time waster) وفقاً لتعريف الفصل؟","en":"What is meant by the concept of a 'time waster' according to the chapter's definition?","optionsAr":["توزيع المهام بين أعضاء هيئة التمريض.","شيء يمنع الشخص من إنجاز وظيفة أو تحقيق هدف.","أي نشاط رسمي يتم إجراؤه في الصباح الباكر.","الأجهزة والمعدات الطبية القديمة في المستشفى."],"optionsEn":["Distributing tasks among nursing staff members.","Something that prevents a person from accomplishing a job or achieving a goal.","Any formal activity performed early in the morning.","Old medical devices and equipment in the hospital."],"correct":1,"whyAr":"يعرف الكتاب مضيع الوقت بأنه أي شيء يمنع الشخص من إنجاز عمل أو تحقيق هدف.","whyEn":"The book defines a time waster as something that prevents a person from accomplishing a job or achieving a goal."},{"ar":"إلى أي نوع من مضيعات الوقت ينتمي 'التسويف' (Procrastination) وتأجيل المهام؟","en":"To which type of time wasters does 'procrastination' and putting off tasks belong?","optionsAr":["مضيعات الوقت التقنية","مضيعات الوقت الخارجية (External time wasters)","مضيعات الوقت المرتبطة بالمؤسسة فقط","مضيعات الوقت الداخلية أو الشخصية (Internal time wasters)"],"optionsEn":["Technical time wasters","External time wasters","Institution-related time wasters only","Internal time wasters"],"correct":3,"whyAr":"يصنف الكتاب التسويف ونقص التخطيط والكمال تحت مضيعات الوقت الداخلية (الخصائص الشخصية والذاتية).","whyEn":"The book classifies procrastination, lack of planning, and perfectionism under internal time wasters (personal and self-related)."},{"ar":"أي من الأمور التالية يُعتبر مثالاً واضحاً على مضيعات الوقت الخارجية (External time wasters)؟","en":"Which of the following is considered a clear example of external time wasters?","optionsAr":["الكمال المفرط والقلق الزائد","التسويف المستمر وإرجاء الأعمال للموعد النهائي","نقص التخطيط الشخصي للعمل","الزيارات المفاجئة من الأشخاص (Drop in visitors)"],"optionsEn":["Excessive perfectionism and anxiety","Continuous procrastination and postponing tasks to the deadline","Lack of personal work planning","Drop in visitors"],"correct":3,"whyAr":"يذكر الكتاب الزيارات المفاجئة والمكالمات الهاتفية والأوراق كأمثلة على مضيعات الوقت الخارجية التي يحدثها الآخرون.","whyEn":"The book lists drop-in visitors, telephone calls, and paperwork as examples of external time wasters caused by other people."},{"ar":"لماذا يُعتبر تعدد المهام (Multitasking) أمراً غير كفء وفقاً لمبادئ إدارة الوقت في الكتاب؟","en":"Why is multitasking considered inefficient according to the book's time management principles?","optionsAr":["لأنه يلغي الحاجة إلى وضع خطط أسبوعية.","لأنه يسبب تكلفة معرفية وتكلفة زمنية بسبب التبديل المستمر بين المهام.","لأنه يزيد من سرعة إنجاز الأعمال بشكل مبالغ فيه.","لأنه يقلل من تفاعل المدير مع المرؤوسين."],"optionsEn":["Because it eliminates the need to make weekly plans.","Because it incurs a cognitive cost and a time cost due to constant switching between tasks.","Because it excessively increases the speed of task completion.","Because it reduces the manager's interaction with subordinates."],"correct":1,"whyAr":"يوضح الكتاب أن تعدد المهام خرافة وأننا نقوم بالتبديل بين المهام وندفع تكلفة معرفية وزمنية مع كل تبديل مما يجعلنا أقل كفاءة.","whyEn":"The book explains that multitasking is a myth and we switch back and forth, paying a cognitive and time cost with each switch, making us less efficient."},{"ar":"ممرضة رئيسية تقضي أوقاتاً طويلة في البحث عن ملفات ضائعة بسبب عدم ترتيب مكتبها وأوراقها. ما هو مضيع الوقت المسؤول عن هذه المشكلة؟","en":"A head nurse spends a long time searching for lost files due to not organizing her desk and papers. What is the time waster responsible for this problem?","optionsAr":["الكمال المفرط (Perfectionism)","الزيارات المفاجئة (Drop in visitors)","التسويف (Procrastination)","التنظيم الضعيف أو عدم التنظيم (Disorganization)"],"optionsEn":["Perfectionism","Drop in visitors","Procrastination","Disorganization"],"correct":3,"whyAr":"يشير الكتاب إلى أن الأشخاص غير المنظمين (Disorganization) يضيعون وقتاً طويلاً في البحث عن العناصر المفقودة.","whyEn":"The book indicates that disorganized people spend too much time looking for lost items."},{"ar":"مديرة تمريض تشعر بقلق شديد يمنعها من إكمال أي تقرير إداري بالوقت المناسب بسبب رغبتها في أن تكون كل كلمة مثالية تماماً. ما هو هذا السلوك المعيق للوقت؟","en":"A nurse manager feels intense anxiety preventing her from completing any administrative report on time due to her desire for every word to be completely perfect. What is this time-hindering behavior?","optionsAr":["التفويض المفرط للسلطة","الزيارات المفاجئة للقسم","التسويف الناتج عن كثرة الاجتماعات","الكمال أو السعي للكمال المفرط (Perfectionism)"],"optionsEn":["Excessive delegation of authority","Drop-in visits to the unit","Procrastination resulting from numerous meetings","Perfectionism"],"correct":3,"whyAr":"يعرف الكتاب هذه الحالة بالكمال المفرط (Perfectionism)، حيث يصبح الشخص قلقاً للغاية بشأن إنجاز العمل بشكل مثالي لدرجة أنه لا يكمله أبداً.","whyEn":"The book defines this condition as perfectionism, where people become so anxious about getting a job done perfectly that they never complete it."},{"ar":"أرادت رئيسة التمريض تقليل وقت الزيارات المفاجئة (Drop in visitors) في مكتبها بطريقة فعالة ومباشرة. ما هي الطريقة الموصى بها في الكتاب؟","en":"A head nurse wanted to reduce the time of drop-in visitors in her office in an effective and direct way. What is the method recommended in the book?","optionsAr":["تجاهل الزائر تماماً وعدم الرد عليه.","مغادرة المكتب فور دخول أي شخص.","الجلوس بعيداً وإغلاق الباب بالمفتاح طوال الدوام.","الوقوف لتحية الزائر والبقاء واقفاً لتشجيع زيارة قصيرة."],"optionsEn":["Completely ignoring the visitor and not responding.","Leaving the office as soon as anyone enters.","Sitting far away and locking the door with a key throughout the shift.","Standing up to greet the visitor and remaining standing to encourage a short visit."],"correct":3,"whyAr":"يوصي الكتاب بالوقوف لتحية الزائر والبقاء واقفاً لأن ذلك يشجع على قصر وقت الزيارة.","whyEn":"The book recommends standing up to greet the visitor and remaining standing to encourage a short visit."},{"ar":"إذا أرادت ممرضة رئيسية التغلب على مشكلة 'التسويف' في إنجاز المهام الثقيلة التي تكره القيام بها، فما هي الاستراتيجية الصحيحة المذكورة في الكتاب؟","en":"If a head nurse wants to overcome the problem of 'procrastination' in completing heavy tasks she dislikes, what is the correct strategy mentioned in the book?","optionsAr":["تأجيل المهمة حتى نهاية العام المالي.","الاعتماد على الآخرين كلياً دون متابعة.","تجنب وضع أي خطط مكتوبة.","تقسيم المهمة الكبيرة إلى مهام أصغر حتى اكتمالها وتحديد موعد نهائي."],"optionsEn":["Postponing the task until the end of the fiscal year.","Depending totally on others without follow-up.","Avoiding any written plans.","Breaking a large job into smaller tasks until completed and setting a deadline."],"correct":3,"whyAr":"يحدد الكتاب طرق التعامل مع التسويف بوضع موعد نهائي، التخطيط لمكافأة، وتقسيم العمل الكبير إلى مهام أصغر.","whyEn":"The book specifies dealing with procrastination by setting a deadline, planning a reward, and breaking a large job into smaller tasks."},{"ar":"ما هي الفائدة الرئيسية من إنشاء خطة مكتوبة للأنشطة اليومية والأسبوعية للمدير؟","en":"What is the primary benefit of creating a written plan for a manager's daily and weekly activities?","optionsAr":["زيادة عدد ساعات العمل الرسمية في اليوم الواحد.","التعامل مع جميع العناصر الواردة فيها دون تشتيت من أعمال جديدة تضاف.","منع حدوث أي مكالمات هاتفية نهائياً.","إلغاء الحاجة لوجود مرؤوسين في القسم."],"optionsEn":["Increasing the number of official working hours in a day.","Dealing with all items on it without the distraction of new work being added.","Preventing any telephone calls completely.","Eliminating the need for subordinates in the department."],"correct":1,"whyAr":"يوضح الكتاب أن إنشاء خطة مكتوبة للأنشطة يمكن المدير من التعامل مع جميع العناصر الموجودة فيها دون تشتيت بسبب عمل جديد يضاف.","whyEn":"The book explains that creating a written plan enables dealing with all items on it without the distraction of new work being added."},{"ar":"ممرضة تعمل مديرة للتمريض ولاحظت كثرة المكالمات الهاتفية التي تعطل عملها اليومي. ما هو الإجراء الصحيح الذي يجب عليها اتباعه وفقاً للكتاب؟","en":"A nurse manager noticed frequent phone calls disrupting her daily work. What is the correct action she should follow according to the book?","optionsAr":["فصل خطوط الهاتف نهائياً.","ترك الهاتف يتردد دون إجابة.","تخطيط المكالمات عبر كتابة المواضيع لمناقشتها قبل الاتصال وتقليل التحدث الاجتماعي.","الرد على المكالمات فقط بعد انتهاء الدوام الرسمي."],"optionsEn":["Disconnecting telephone lines permanently.","Leaving the phone ringing without answering.","Planning calls by writing down topics before calling and minimizing socialization.","Answering calls only after official working hours."],"correct":2,"whyAr":"يشير الكتاب إلى ضرورة التخطيط للمكالمات بكتابة المواضيع قبل إجرائها، وتحديد وقت للاتصال، وتقليل التحدث الاجتماعي.","whyEn":"The book indicates the necessity of planning calls by writing down topics before making the call, setting a time, and minimizing socialization."},{"ar":"كيف يجب على مدير التمريض التعامل مع الأوراق والوثائق الكثيرة (Paper work) لتجنب تضييع الوقت؟","en":"How should a nurse manager handle paperwork to avoid wasting time?","optionsAr":["حفظها حسب تاريخ إنجازها أو التخلص منها، والبراعة في استخدام الكمبيوتر.","الاحتفاظ بنسخ ورقية لكل شيء للأبد دون مراجعة.","تركها تتراكم على المكتب حتى نهاية الشهر.","الطلب من المرضى تعبئة جميع النماذج بأنفسهم."],"optionsEn":["Filing them according to the date to be completed or thrown away, and being proficient in using the computer.","Keeping paper copies for everything forever without review.","Letting them accumulate on the desk until the end of the month.","Asking patients to fill out all forms themselves."],"correct":0,"whyAr":"يذكر الكتاب أن مدير التمريض يتعامل مع الأوراق بحفظها حسب تاريخ الإنجاز أو التخلص منها، والاحتراف في استخدام الكمبيوتر لإنشاء الرسائل والمذكرات.","whyEn":"The book mentions that the nurse manager handles paperwork by filing it according to the completion date or throwing it away, and being proficient in using the computer."},{"ar":"عندما يقوم مدير التمريض بتقييم كيفية استخدام الوقت على مستوى الوحدة، ما هي الأدوات التي ينصح باستخدامها في الكتاب؟","en":"When a nurse manager evaluates how time is used at the unit level, what tools are recommended in the book?","optionsAr":["تقارير الحضور والانصراف اليومية للموظفين.","استطلاعات الرأي العام للمرضى فقط.","تحليل الوظائف ودراسات الحركة والزمن (Job analysis and time motion studies).","الميزانية الرأسمالية السنوية."],"optionsEn":["Daily attendance and departure reports for employees.","Public opinion surveys of patients only.","Job analysis and time motion studies.","Annual capital budget."],"correct":2,"whyAr":"ينص الكتاب ضمن دور مدير التمريض على تحليل كيفية إدارة الوقت على مستوى الوحدة باستخدام تحليل الوظائف ودراسات الحركة والزمن.","whyEn":"The book states as part of the nurse manager's role analyzing how time is managed on the unit level using job analysis and time motion studies."},{"ar":"أي من المبادئ التالية يُعد أساسياً لضمان توجيه الوقت نحو الأهداف الأكثر أهمية في العمل؟","en":"Which of the following principles is essential to ensure time is directed toward the most important work goals?","optionsAr":["التركيز على المهام الهامشية أولاً","ترتيب الأولويات (Prioritizing)","زيادة الاجتماعات الصباحية الطويلة","تجنب وضع أي جداول زمنية"],"optionsEn":["Focusing on marginal tasks first","Prioritizing","Increasing long morning meetings","Avoiding any schedules"],"correct":1,"whyAr":"يوضح مبدأ ترتيب الأولويات في الكتاب ضرورة التأكد من تقييم الأولويات بدقة وأن الأنشطة المرتبطة بتحقيق الأهداف يجب أن تحصل على الاهتمام أولاً.","whyEn":"The priority-setting principle in the book explains the necessity of accurately assessing top priorities and ensuring goal-related activities receive attention first."},{"ar":"ما هو الدور الذي يلعبه مدير التمريض تجاه المرؤوسين فيما يتعلق بإدارة الوقت؟","en":"What role does the nurse manager play toward subordinates regarding time management?","optionsAr":["تركهم يحددون ساعات العمل بأنفسهم دون رقابة.","العمل كقدوة ودعم ومورد لمساعدتهم في تحديد الأولويات.","فرض عقوبات مالية فورية عند تأخر أي موظف.","منعهم من التواصل مع الإدارة العليا."],"optionsEn":["Letting them determine working hours themselves without supervision.","Functioning as a role model, support, and resource person in setting priorities.","Imposing immediate financial penalties for any employee delay.","Preventing them from communicating with top management."],"correct":1,"whyAr":"يؤكد الكتاب أن دور مدير التمريض يتضمن العمل كقدوة ودعم ومورد للمرؤوسين في تحديد الأولويات ومساعدتهم في العمل تعاونياً لتعظيم الاستفادة من الوقت.","whyEn":"The book confirms that the nurse manager's role includes functioning as a role model, support, and resource person to subordinates in setting priorities and assisting them in working cooperatively."}]},{"id":7,"ar":"التحفيز","en":"Motivation","pages":"96–109","summaryAr":"يتناول هذا الفصل مفهوم التحفيز كقوة دافعة وسلوك موجه نحو الأهداف، وأنواعه المختلفة (الخارجية والداخلية)، وعملية التحفيز وعناصرها، وتأثيره على بيئة العمل وظروفه، بالإضافة إلى الاستراتيجيات وطرق التحفيز المختلفة في إدارة التمريض.","summaryEn":"This chapter covers the concept of motivation as a driving force and goal-directed behavior, its different types (extrinsic and intrinsic), the motivation process and its elements, its effects on work conditions, and various motivational strategies and methods in nursing management.","textAr":"يُعرف التحفيز (Motivation) بأنه قوة دافعة داخل الأفراد يحاولون من خلالها تحقيق بعض الأهداف لتلبية بعض الاحتياجات أو التوقعات، وهو يمنز السلوك من خلال إثارته واستدامته وتوجيهه نحو تحقيق الأهداف بنجاح. تحفيز الآخرين يعني دفعهم للذهاب في الاتجاه المطلوب للوصول إلى نتيجة، بينما التحفيز الذاتي هو تحديد الاتجاه بشكل مستقل ثم إنشاء خطة عمل للتأكد من الوصول إلى هناك.\n\nتتعدد أسباب التحفيز وغاياته لتشمل دفع الأفراد للإنجاز، ومساعدة الأفراد على العمل بكفاءة أكبر، وبناء الروح المعنوية، ومساعدة الأفراد على إنتاج نتائج أفضل. كما تكمن qualities (خصائص) التحفيز في تنشيط السلوك، وتوجيه السلوك، وتمكين المثابرة نحو الهدف.\n\nيُعد التحفيز عملية يتم من خلالها تنشيط وتوجيه واستدامة جهود الشخص نحو تحقيق الهدف، وتتضمن عملية التحفيز جوانب مثل الشدة أو الجهد (Intensity or Energy) وهي مدى محاولة الشخص وبذل الجهد في مكان العمل، والمثابرة (Persistence) وهي رغبة الفرد في الاستمرار في المهمة حتى اكتمالها، والاتجاه (Direction) وهو توجيه الجهد بما يتسق مع أهداف المنظمة.\n\nتتنوع أنواع التحفيز (Types of motivations) إلى تحفيز خارجي (Extrinsic) ويشمل المكافآت مثل العلاوات (Bonuses)، واستخدام سيارة الشركة، وشهادات الهدايا، وفرص التدريب، وتحفيز داخلي (Intrinsic) وهو خاص بالفرد ويشمل الرضا الشخصي والعوامل الثقافية والدينية.\n\nتؤثر ظروف العمل بشكل مباشر على التحفيز والرضا الوظيفي، وتشمل ظروف العمل التي تعزز التحفيز أن توفر المهام شعراً بالمعنى، وأن يتحكم الموظفون في جزء من العمل، وتنوع المهام، ووضوح وقواعد الشركة المتسقة، والعلاقات الداعمة مع الرؤساء وزملاء العمل، وتلقي ملاحظات مفيدة، وفرص النمو.\n\nتتضمن طرق التحفيز (How to motivate?) تحديد نوع الفرد (خارجي أو داخلي)، وتمكينه للمشاركة في خطة المشروع وبناء الفريق، وتوصيل أهداف المشروع، وإسناد المسؤولية، وتقديم الحوافز مثل شهادات الهدايا وموظف الشهر وعبارات الشكر والثناء مثل 'عمل رائع' و'أحسنت'.\n\nتشمل استراتيجيات التحفيز (Motivation strategies) تطوير نظام المكافآت الإجمالي وعملية إدارة الأداء، وتصميم برامج التطوير القيادي والتحفيزي لخلق بيئة عمل وتطوير سياسات وممارسات تؤدي إلى مستويات أعلى من أداء الموظفين.","textEn":"Motivation is defined as a driving force within individuals by which they attempt to achieve some goal in order to fulfill some needs or expectation, giving impetus to behavior by arousing, sustaining, and directing it towards successful goal attainment. Motivating others means getting them to go in the desired direction to arrive at a result, while self-motivation is setting direction independently and creating an action plan.\n\nReasons to motivate include driving individuals to achieve, helping them work more efficiently, building morale, and helping them produce better results. The qualities of motivation are energizing behavior, directing behavior, and enabling persistence toward a goal.\n\nMotivation as a process involves a person's efforts being energized, directed, and sustained towards attaining the goal, encompassing intensity or energy as how hard a person tries, persistence as the desire to stay with a task until completed, and direction as effort channeled toward organizational goals.\n\nTypes of motivations include extrinsic motivation such as bonuses, use of company cars, gift certificates, and training opportunities, and intrinsic motivation which is specific to the individual, personal satisfaction, and cultural and religious factors.\n\nThe effects of motivation on work include working conditions that increase job involvement and satisfaction, such as work providing meaningfulness, employee control over work, varied tasks, clear rules, supportive relationships, useful feedback, and growth opportunities.\n\nMethods of how to motivate include identifying the individual's type, empowering participation in project plans, communicating goals, assigning responsibility, and perks like gift certificates, 'employee of the month', and saying 'great job' or 'well done'.\n\nMotivation strategies include developing the total reward system, performance management processes, and designing motivational and leadership development programs to achieve higher employee performance.","terms":[["Motivation","القوة الدافعية داخل الأفراد التي تحاول تحقيق الأهداف لتلبية الاحتياجات أو التوقعات، وتنشيط وتوجيه واستدامة السلوك.","The driving force within individuals by which they attempt to achieve some goal in order to fulfill some needs or expectation."],["Extrinsic motivation","التحفيز الخارجي الذي يشمل المكافآت المادية مثل العلاوات والهدايا واستخدام سيارة الشركة وفرص التدريب.","External motivation including bonuses, use of company car, gift certificates, and training opportunities."],["Intrinsic motivation","التحفيز الداخلي المرتبط بالفرد نفسه ويشمل الرضا الشخصي والعوامل الثقافية والدينية.","Motivation specific to the individual, personal satisfaction, and cultural and religious factors."],["Intensity","مقدار الجهد أو الشدة التي يبذلها الشخص في مكان العمل.","How hard a person tries or a measure of intensity or drive."],["Persistence","مثابرة الفرد ورغبته في الاستمرار في المهمة حتى اكتمالها.","The individual's desire to stay with a task until it is completed."],["Direction","توجيه الجهد وتصريفه ليكون متسقاً مع أهداف المنظمة.","Effort that is channeled toward, and consistent with, organizational goals."]],"questions":[{"ar":"ما هو التفسير الأدق لمفهوم التحفيز (Motivation) كما ورد في الفصل؟","en":"What is the most accurate explanation of motivation as stated in the chapter?","optionsAr":["عملية تسجيل الملاحظات الإدارية اليومية للموظفين.","القوة الدافعية داخل الأفراد لتحقيق الأهداف وتلبية الاحتياجات والتوقعات.","توزيع المهام الروتينية على الممرضات الجدد.","مراقبة حضور والانصراف العاملين في المستشفى."],"optionsEn":["The process of recording daily administrative notes for employees.","The driving force within individuals to achieve goals and fulfill needs or expectations.","Distributing routine tasks to new nurses.","Monitoring hospital employees' attendance and departure."],"correct":1,"whyAr":"ينص الكتاب على أن التحفيز هو القوة الدافعية داخل الأفراد التي يحاولون من خلالها تحقيق بعض الأهداف لتلبية بعض الاحتياجات أو التوقعات.","whyEn":"The book states that motivation is the driving force within individuals by which they attempt to achieve some goal in order to fulfill some needs or expectation."},{"ar":"أي مما يلي يُعد مثالاً على التحفيز الخارجي (Extrinsic motivation)؟","en":"Which of the following is an example of extrinsic motivation?","optionsAr":["العلاوات وفرص التدريب وشهادات الهدايا","الرضا الشخصي البحت","المعتقدات الثقافية والدينية الخاصة بالفرد","الدافع الذاتي البحت للإنجاز"],"optionsEn":["Bonuses, training opportunities, and gift certificates","Pure personal satisfaction","The individual's cultural and religious beliefs","Pure self-drive for achievement"],"correct":0,"whyAr":"يحدد الكتاب أنواع التحفيز الخارجي لتشمل العلاوات (Bonuses)، واستخدام سيارة الشركة، وشهادات الهدايا، وفرص التدريب.","whyEn":"The book specifies types of extrinsic motivation to include bonuses, use of company car, gift certificates, and training opportunities."},{"ar":"ماذا يُقصد بمفهوم 'المثابرة' (Persistence) كأحد عناصر عملية التحفيز؟","en":"What is meant by 'persistence' as an element of the motivation process?","optionsAr":["تقييم الأداء المالي للمنظمة","توجيه الجهد ليتسق مع الأهداف التنظيمية","رغبة الفرد في البقاء مع المهمة حتى اكتمالها","مدى محاولة الشخص بذل الجهد في العمل"],"optionsEn":["Evaluating the organization's financial performance","Channeling effort to be consistent with organizational goals","The individual's desire to stay with a task until it is completed","How hard a person tries at work"],"correct":2,"whyAr":"يُعرف الكتاب المثابرة بأنها رغبة الفرد في البقاء مع المهمة حتى اكتمالها ومدى قدرته على الحفاظ على الجهد.","whyEn":"The book defines persistence as the individual's desire to stay with a task until it is completed."},{"ar":"أي من الخيارات الآتية يمثل خصائص التحفيز (Qualities of motivation) المذكورة في الفصل؟","en":"Which of the following represents the qualities of motivation mentioned in the chapter?","optionsAr":["تنشيط السلوك، توجيه السلوك، وتمكين المثابرة نحو الهدف","تحديد الأجور، التوظيف، وجدولة المناوبات","التخطيط المالي، التنظيم، والرقابة الصارمة","حل النزاعات، الاتصال، وبناء الهيكل التنظيمي"],"optionsEn":["Energizing behavior, directing behavior, and enabling persistence toward a goal","Wage determination, staffing, and shift scheduling","Financial planning, organizing, and strict control","Conflict resolution, communication, and building organizational structure"],"correct":0,"whyAr":"ينص الكتاب صراحةً على أن خصائص التحفيز هي: تنشيط السلوك، توجيه السلوك، وتمكين المثابرة نحو الهدف.","whyEn":"The book explicitly states that the qualities of motivation are energizing behavior, directing behavior, and enabling persistence toward a goal."},{"ar":"ما هو التحفيز الداخلي (Intrinsic motivation) كما ورد في الكتاب؟","en":"What is intrinsic motivation as stated in the book?","optionsAr":["العلاوات السنوية وفرص السفر للتدريب الخارجي.","عوامل خاصة بالفرد نفسه مثل الرضا الشخصي والعوامل الثقافية والدينية.","حوافز مرتبطة بالشركة وسياساتها الرسمية.","مكافآت نقدية شهرية تمنحها إدارة المستشفى للموظفين المتميزين."],"optionsEn":["Annual bonuses and travel opportunities for external training.","Factors specific to the individual such as personal satisfaction and cultural and religious factors.","Incentives associated with the company and its official policies.","Monthly cash rewards granted by hospital management to distinguished employees."],"correct":1,"whyAr":"يشير الكتاب إلى أن التحفيز الداخلي يكون خاصاً بالفرد ويشمل الرضا الشخصي والعوامل الثقافية والدينية.","whyEn":"The book indicates that intrinsic motivation is specific to the individual, including personal satisfaction and cultural and religious factors."},{"ar":"ممرضة تعمل بجهد كبير في القسم ليس طمعاً في مال بل لشعورها العميق بالرضا المتبادل ورغبتها في مساعدة المرضى. ما هو نوع التحفيز الذي يدفعها هنا؟","en":"A nurse works very hard in the department not for money but due to her deep feeling of mutual satisfaction and desire to help patients. What type of motivation drives her here?","optionsAr":["تحفيز إلزامي تقني","تحفيز مالي بحت","تحفيز داخلي (Intrinsic motivation)","تحفيز خارجي (Extrinsic motivation)"],"optionsEn":["Technical compulsory motivation","Pure financial motivation","Intrinsic motivation","Extrinsic motivation"],"correct":2,"whyAr":"الرضا الشخصي والشعور الداخلي يندرج تحت التحفيز الداخلي (Intrinsic) الذي يكون خاصاً بالفرد.","whyEn":"Personal satisfaction and internal feelings fall under intrinsic motivation, which is specific to the individual."},{"ar":"أرادت رئيسة التمريض زيادة دافعية العاملات في الوحدة فقامت بمنهن شهادة 'موظف الشهر' مع هدية رمزية وعبارات شكر مثل 'عمل رائع'. أي طريقة من طرق التحفيز استخدمت؟","en":"A head nurse wanted to increase motivation among workers in the unit by granting them an 'employee of the month' certificate with a token gift and praise like 'great job'. Which motivation method did she use?","optionsAr":["تطبيق العقوبات الصارمة لتقليل الأخطاء.","تقديم الحوافز المعنوية والمادية البسيطة وعبارات التقدير مثل موظف الشهر.","إلغاء سياسات الوحدة وترك العمل بلا قيود.","تغيير الهيكل التنظيمي للمستشفى بالكامل."],"optionsEn":["Applying strict punishments to reduce errors.","Providing perks, tokens of appreciation, and phrases like employee of the month.","Canceling unit policies and leaving work unrestricted.","Completely changing the hospital's organizational structure."],"correct":1,"whyAr":"يوضح الكتاب أن من طرق التحفيز استخدام الحوافز مثل شهادات الهدايا و'موظف الشهر' و'عمل رائع' و'أحسنت'.","whyEn":"The book explains that motivation methods include perks such as gift certificates, 'employee of the month', 'great job', and 'well done'."},{"ar":"ممرضة تبدأ مهامها دون وضوح في الاتجاه وتوزع جهدها على أنشطة لا علاقة لها بأهداف القسم. أي من أبعاد عملية التحفيز يحتاج إلى تعديل لديها؟","en":"A nurse starts tasks without clarity of direction and scatters her effort on activities unrelated to department goals. Which dimension of the motivation process needs adjustment for her?","optionsAr":["الراتب الأساسي الشهري","الاتجاه (Direction)","المكافآت الخارجية فقط","عدد ساعات الراحة الإلزامية"],"optionsEn":["Monthly basic salary","Direction","External rewards only","Number of mandatory rest hours"],"correct":1,"whyAr":"يعرف الكتاب الاتجاه (Direction) بأنه الجهد الموجه نحو الأهداف التنظيمية والمتسق معها.","whyEn":"The book defines direction as effort that is channeled toward, and consistent with, organizational goals."},{"ar":"عندما يلاحظ مدير التمريض أن ظروف العمل في القسم توفر للموظفين شعراً بمعنى العمل، واستقلالية التحكم في جزء منه، وتنوع المهام، فما هو التوقع الأرجح لتأثير ذلك على العاملين؟","en":"When a nurse manager notices that working conditions provide employees with a sense of meaningfulness, control over work, and varied tasks, what is the most likely effect on workers?","optionsAr":["انخفاض جودة رعاية المرضى بشكل ملحوظ.","زيادة معدل دوران العمل والاستقالات.","فقدان الانضباط وقواعد العمل.","زيادة الانخراط الوظيفي والتحفيز والرضا."],"optionsEn":["Significant decrease in patient care quality.","Increased turnover and resignation rates.","Loss of discipline and work rules.","Increased job involvement, motivation, and satisfaction."],"correct":3,"whyAr":"يذكر الكتاب أن ظروف العمل التي توفر المعنى والتحكم والتنوع تزيد من الانخراط الوظيفي والتحفيز والرضا.","whyEn":"The book mentions that working conditions providing meaningfulness, control, and variety increase job involvement, motivation, and satisfaction."},{"ar":"قامت إدارة المستشفى بصرف مكافأة مالية وعلاوة تشجيعية (Bonus) لمجموعة من الممرضات اللاتي أظهرن تفوقاً في العمل. هذا النوع من الإجراء يمثل:","en":"Hospital management distributed a financial bonus and incentive to a group of nurses who excelled in work. This type of action represents:","optionsAr":["تحفيزاً خارجيـاً (Extrinsic motivation)","تحفيزاً داخلياً بحتاً","عقوبة إدارية غير مباشرة","شكلاً من أشكال الانعزال الوظيفي"],"optionsEn":["Extrinsic motivation","Pure internal motivation","An indirect administrative penalty","A form of job isolation"],"correct":0,"whyAr":"تُصنف العلاوات والمكافآت النقدية في الكتاب ضمن أنواع التحفيز الخارجي (Extrinsic).","whyEn":"Bonuses and financial rewards are classified in the book under types of extrinsic motivation."},{"ar":"أي من الأهداف الآتية يُعد الغرض الأساسي من تحفيز الأفراد في بيئة العمل حسب ما ورد في الفصل؟","en":"Which of the following is considered the primary purpose of motivating individuals in the work environment as stated in the chapter?","optionsAr":["تقليص أعداد الموظفين لخفض تكاليف التشغيل.","دفع الأفراد للإنجاز ومساعدة الموظفين على العمل بكفاءة وبناء الروح المعنوية وإنتاج نتائج أفضل.","زيادة عدد الساعات المكتبية غير المنتج.","منع الموظفين من التواصل نهائياً فيما بينهم."],"optionsEn":["Reducing the number of employees to lower operational costs.","Driving individuals to achieve, helping them work more efficiently, building morale, and producing better results.","Increasing the number of non-productive office hours.","Preventing employees from communicating with each other completely."],"correct":1,"whyAr":"يحدد الكتاب أسباب التحفيز في: دفع الأفراد للإنجاز، مساعدة الأفراد على العمل بكفاءة أكبر، بناء الروح المعنوية، ومساعدة الأفراد على إنتاج نتائج أفضل.","whyEn":"The book lists the reasons to motivate as driving individuals to achieve, helping individuals work more efficiently, building morale, and helping them produce better results."},{"ar":"ممرضة رئيسية تريد تطبيق استراتيجيات تحفيزية طويلة المدى لرفع أداء طاقم التمريض. على أي أساس يجب أن تركز هذه الاستراتيجيات وفقاً للكتاب؟","en":"A head nurse wants to apply long-term motivational strategies to raise nursing staff performance. What should these strategies focus on according to the book?","optionsAr":["الاعتماد على الأوامر الشفوية اليومية دون نظم واضحة.","فرض العقوبات الجزائية الصارمة في كل وردية عمل.","تقليص برامج التدريب واختصار ساعات العمل.","تطوير نظام المكافآت الإجمالي وعملية إدارة الأداء وبرامج التطوير القيادي."],"optionsEn":["Relying on daily verbal orders without clear systems.","Imposing strict punitive measures in every work shift.","Reducing training programs and shortening working hours.","Developing the total reward system, performance management process, and leadership development programs."],"correct":3,"whyAr":"يذكر الكتاب أن استراتيجيات التحفيز تشمل نمو نظام المكافآت الإجمالي وعملية إدارة الأداء وتصميم برامج التطوير القيادي والتحفيزي.","whyEn":"The book mentions that motivation strategies include the growth of the total reward system, performance management process, and designing motivational and leadership development programs."},{"ar":"ما هو التأثير الناتج عن غياب فرص التطور والعدالة أو عدم منح الفرد فرصة حقيقية للنجاح في عمله؟","en":"What is the resulting effect of a lack of developmental opportunities and fairness, or not giving an individual a fair chance to succeed in their work?","optionsAr":["قد يكون الشخص أقل نجاحاً.","يؤدي ذلك بالضرورة إلى ترقية فورية للموظف.","ينعدم وجود أي أخطاء في القسم.","تتضاعف كفاءة الموظف الإنتاجية تلقائياً."],"optionsEn":["The person may be less than successful.","This necessarily leads to an immediate promotion for the employee.","The existence of any errors in the department is eliminated.","The employee's productive efficiency doubles automatically."],"correct":0,"whyAr":"ينص الكتاب تحت تأثير فرص الإنجاز على أنه عندما يفتقر الشخص إلى فرصة عادلة للنجاح (fair chance to make it)، فقد يكون أقل نجاحاً.","whyEn":"The book states under opportunities to achieve that when a person lacks a fair chance to make it, he or she may be less than successful."},{"ar":"أي من الخيارات التالية يوضح كيف تتفاعل 'الشدة أو الجهد' (Intensity) في عملية التحفيز بالمكان العمل؟","en":"Which of the following illustrates how 'intensity' interacts in the motivation process at the workplace?","optionsAr":["مدى محاولة الشخص وبذل الجهد ومدى ملاءمته لملاحقة الأهداف.","عدد الزوار الذين يدخلون القسم يومياً.","مقدار الراتب الثابت بغض النظر عن الأداء.","المدة الزمنية التي يستقيل بعدها الموظف من العمل."],"optionsEn":["How hard a person tries and its suitability for pursuing goals.","The number of visitors entering the department daily.","The amount of fixed salary regardless of performance.","The time period after which an employee resigns from work."],"correct":0,"whyAr":"يُعرف الكتاب الشدة أو الجهد بأنها مدى محاولة الشخص وبذل الجهد في العمل، وتحديد ذلك فيما يتعلق بملاءمته لملاحقة الأهداف.","whyEn":"The book defines intensity or effort as how hard a person tries and determining it in relation to its suitability for pursuing goals."},{"ar":"عندما يسعى مدير التمريض لرفع دافعية العاملين، ما هي أول خطوة عملية مقترحة للتعرف على احتياجاتهم التحفيزية في القسم؟","en":"When a nurse manager seeks to raise staff motivation, what is the first suggested practical step to identify their motivational needs in the department?","optionsAr":["منح إجازات مفتوحة لجميع العاملين فوراً.","تغيير مهام التمريض الطبية بشكل عشوائي.","تحديد نوع الفرد (خارجي أو داخلي) وتفضيلاته.","تجاهل الفروق الفردية ومعاملة الجميع بقالب واحد."],"optionsEn":["Granting open leaves to all workers immediately.","Changing medical nursing tasks randomly.","Identifying the individual's type (extrinsic, intrinsic).","Ignoring individual differences and treating everyone uniformly."],"correct":2,"whyAr":"تُظهر قائمة كيفية التحفيز (How to motivate?) في الكتاب أن الخطوة الأولى هي تحديد نوع الفرد (خارجي، داخلي).","whyEn":"The list on how to motivate in the book shows that the first step is to identify individual's type (extrinsic, intrinsic)."}]},{"id":8,"ar":"الهيكل التنظيمي","en":"Organizational Structure","pages":"110–138","summaryAr":"يتناول هذا الفصل مفهوم الهيكل التنظيمي (Organizational Structure) وأنواعه المختلفة، مثل الهيكل الرسمي وغير الرسمي، والخرائط التنظيمية بأنواعها (العمودية، والأفقية، والدائرية)، بالإضافة إلى المبادئ التنظيمية الأساسية كالمركزية واللامركزية، وتفويض السلطة، ونطاق الإشراف، وتقسيم العمل والأقسام.","summaryEn":"This chapter covers the concept of organizational structure and its various types, such as formal and informal structures, organizational charts (vertical, horizontal, and circular), as well as core organizational principles like centralization and decentralization, delegation of authority, span of control, division of work, and departmentation.","textAr":"يُشير الهيكل التنظيمي (Organizational Structure) إلى تجميع الوظائف اللازمة لكي تحقق المنظمة أهدافها، ويمكن الكشف عن الهيكل التنظيمي من خلال خريطة توضح الوظائف المختلفة في المنظمة وعلاقة هذه الوظائف ببعضها البعض.\n\nينقسم الهيكل التنظيمي إلى نوعين رئيسيين هما الهيكل التنظيمي الرسمي (The formal organizational structure) الذي يصف الوظائف والمهام والمسؤوليات وخطوط السلطة والعلاقات بين الأفراد في مواضعهم المختلفة ويظهر في شكل تخطيطي يسمى الخريطة التنظيمية، والهيكل التنظيمي غير الرسمي (The informal organizational structure) الذي يتكون من علاقات شخصية واجتماعية لا تظهر على الخريطة التنظيمية وتستند إلى العلاقات الشخصية بدلاً من احترام السلطة الرسمية.\n\nتُعرف الخريطة التنظيمية (Organizational Chart) بأنها مخطط يوضح الوظائف والأقسام المختلفة والعلاقات فيما بينها، وتستخدم لتوضيح علاقات التنظيم الرسمية، ومناطق المسؤولية، والأشخاص الذين يُحاسب أمامهم الفرد، وقنوات الاتصال. وتوجد ثلاثة أنواع رئيسية للخرائط التنظيمية وهي الخرائط العمودية (Vertical charts)، والخرائط الأفقية من اليسار إلى اليمين (Horizontal charts)، والخرائط الدائرية (Circular charts).\n\nتتضمن المبادئ التنظيمية (Organizational principles) عدة عناصر أساسية منها مبدأ التكافؤ أو التساوي (Parity principle) الذي ينص على أن الموظفين يجب أن يمتلكوا قدراً متساوياً من السلطة والمسؤولية، ومبدأ وحدة القيادة (Unity of command) بحيث يكون لكل موظف رئيس واحد فقط، وسلسلة القيادة (Chain of command) التي تتدفق فيها السلطة من مستوى إداري لأخر من القمة إلى القاع.\n\nتشير المركزية واللامركزية (Centralization and Decentralization) إلى المستوى الذي تتم عنده معظم القرارات داخل المنظمة، حيث تعني المركزية نظام إدارة تُتخذ فيه جميع القرارات بواسطة الإدارة العليا، بينما اللامركزية هي نظام تتركز فيه سلطة اتخاذ القرار لدى الإدارة على المستوى الأدنى حيث يتم أداء العمل.\n\nتُعرف السلطة (Authority) بأنها الحق في اتخاذ القرارات النهائية، أو التصرف، أو الأمر بأفعال الآخرين وتتحرك في اتجاه هبوطي، وتشمل أنواعها السلطة المطلقة، والسلطة القانونية، والسلطة الفنية، والسلطة التشغيلية. بينما تشير المسؤولية (Responsibility) إلى الالتزام المرتبط بقبول التكليف ولا يمكن تفويضها، والمساءلة (Accountability) تعني أن يكون المرؤوسون مسؤولين ومحاسبين عن أداء واجباتهم بشكل صحيح وتتحرك في اتجاه صاعد.\n\nيتعامل نطاق الإشراف أو الإدارة (Span of control/ supervision) مع عدد المرؤوسين الذين يمكن الإشراف عليهم بكفاءة بواسطة مشرف واحد، وينقسم إلى نطاق إشراف ضيق (Narrow span of control) ونطاق إشراف واسع (Wide span of control). كما يعني تقسيم العمل أو الخدمة (Division of work/ service / labour) تقسيم الأنشطة الكبيرة لتوزيعها على عدة أفراد لتحقيق التخصص والمهارة القصوى.\n\nيُعرّف التقسيم الإداري (Departmentation) بأنه عملية تجميع الأنشطة في وحدات إدارية، وتتضمن أنواعه التقسيم حسب الوظيفة، وحسب الوقت، وحسب تجميع الأعداد، وحسب المنتج، وحسب المواقع أو المناطق الجغرافية، وحسب العميل.","textEn":"Organizational structure refers to the grouping of positions necessary for the organization to accomplish its objectives, and it may be revealed by a chart indicating the various positions and their relationships to each other.\n\nOrganizational structure includes the formal organizational structure which describes positions, tasks, responsibilities, lines of authority, and relationships presented in a diagram called an organizational chart, and the informal organizational structure which consists of personal and social relationships not appearing on the organizational chart based on personal relationships.\n\nAn organizational chart is a diagram showing the different positions and departments and the relationships among them, used to show formal relationships, areas of responsibility, accountability, and communication channels. The three types of organizational charts are vertical charts, left-to-right (horizontal) charts, and circular charts.\n\nOrganizational principles include the parity principle stating that personnel must have an equal amount of authority and responsibility, unity of command where each employee has only one boss, and the chain of command where authority flows from the top of the organization to the bottom.\n\nCentralization and decentralization refer to the level at which most decisions are made within the organization, where centralization is a system where all decisions are made by top-level managers, and decentralization is a system where a great deal of decision-making authority rests at lower-level managers.\n\nAuthority is the right to take final decisions, to act or to command action moving in a downward direction, including ultimate, legal, technical, and operational authority. Responsibility refers to the obligation involved when accepting an assignment which cannot be delegated, and accountability means subordinates must be held answerable moving in an upward direction.\n\nSpan of control/supervision deals with the number of subordinates that can be adequately supervised by one supervisor, divided into narrow and wide spans of control. Division of work means dividing large activities to be distributed among several people to achieve maximum skill and specialization.\n\nDepartmentation is the process of grouping activities into administrative units, including types such as departmentation by function, time, numbers, product, location, and client.","terms":[["Organizational structure","تجميع الوظائف اللازمة لكي تتمكن المنظمة من تحقيق أهدافها.","The grouping of positions which are necessary for the organization to accomplish its objectives."],["Organizational Chart","رسم توضيحي يوضح الوظائف والأقسام المختلفة والعلاقات والروابط فيما بينها.","A diagram showing the different positions and departments, and the relationships among them."],["Parity principle","مبدأ ينص على أن الموظفين يجب أن يمتلكوا قدراً متساوياً من السلطة والمسؤولية.","The principle that personnel must have an equal amount of authority and responsibility."],["Unity of command","مبدأ يقضي بأن يكون لكل موظف رئيس مباشر واحد فقط مسؤول أمامه.","The principle that each employee should have only one boss."],["Centralization","نظام إدارة تتركز فيه جميع اتخاذ القرارات بواسطة الإدارة العليا.","A system of management in which all decisions are made by top level manager."],["Decentralization","نظام إدارة يرتكز فيه جزء كبير من سلطة اتخاذ القرار لدى الإدارة في المستويات الأدنى حيث يؤدى العمل.","A system of management in which a great deal of decision-making authority rests at lower-level manager."],["Span of control","عدد المرؤوسين الذين يمكن الإشراف عليهم بكفاءة بواسطة مشرف واحد.","The number of subordinates that can be adequately supervised by one supervisor."],["Departmentation","عملية تجميع الأنشطة وتصنيفها في وحدات إدارية.","The process of grouping activities into administrative units."]],"questions":[{"ar":"ما هو التعريف الدقيق للهيكل التنظيمي (Organizational structure) كما ورد في الكتاب؟","en":"What is the exact definition of organizational structure as stated in the book?","optionsAr":["الخطة المالية السنوية لشراء المستلزمات الطبية.","طريقة تقييم أداء الممرضات في الأقسام الحرجة.","مجموعة العلاقات الشخصية البحتة بين العاملين.","تجميع الوظائف التي تجعل المنظمة قادرة على تحقيق أهدافها."],"optionsEn":["The annual financial plan for purchasing medical supplies.","The method of evaluating nurses' performance in critical units.","The set of purely personal relationships among employees.","The grouping of positions which are necessary for the organization to accomplish its objectives."],"correct":3,"whyAr":"يُعرف الكتاب الهيكل التنظيمي بأنه تجميع الوظائف الضرورية لكي تحقق المنظمة أهدافها.","whyEn":"The book defines organizational structure as the grouping of positions which are necessary for the organization to accomplish its objectives."},{"ar":"أي من أنواع الخرائط التنظيمية يوضح الإدارة العليا في المركز والوظائف المتتالية في دوائر خارجية محيطة؟","en":"Which type of organizational charts shows high-level management in the center with successive positions in surrounding circles?","optionsAr":["الخريطة الخطية المباشرة","الخريطة العمودية (Vertical chart)","الخريطة الدائرية (Circular chart)","الخريطة الأفقية (Horizontal chart)"],"optionsEn":["Direct linear chart","Vertical chart","Circular chart","Horizontal chart"],"correct":2,"whyAr":"يوضح الكتاب أن الخرائط الدائرية تعرض الإدارة العليا في المركز مع المواضع المتعاقبة في الدوائر لتقليل الآثار المرتبطة بالوضع والمكانة.","whyEn":"The book states that circular charts show high-level management in the center with successive positions in circles, reducing status implications."},{"ar":"ماذا ينص مبدأ التكافؤ (Parity principle) في الهيكل التنظيمي؟","en":"What does the parity principle state in organizational structure?","optionsAr":["ضرورة تساوى أجور العاملين بغض النظر عن الخبرة.","يجب أن يتساوى عدد المديرين مع عدد الممرضات في كل قسم.","يجب أن يمتلك العاملون قدراً متساوياً ومتعادلاً من السلطة والمسؤولية.","يجب توحيد زي العمل لجميع الفئات التمريضية."],"optionsEn":["Employee wages must be equal regardless of experience.","The number of managers must equal the number of nurses in each department.","Personnel must have an equal amount of authority and responsibility.","Work uniforms must be standardized for all nursing categories."],"correct":2,"whyAr":"ينص مبدأ التكافؤ في الكتاب على أن الأفراد يجب أن يمتلكوا قدراً متساوياً من السلطة والمسؤولية عند قبول المسؤولية.","whyEn":"The parity principle states in the book that personnel must have an equal amount of authority and responsibility when accepting responsibility."},{"ar":"كيف تُعرف المركزية (Centralization) في نظم الإدارة والقرارات؟","en":"How is centralization defined in management and decision systems?","optionsAr":["إلغاء خطوط السلطة الرسمية بين المستويات.","توزيع الأقسام على مواقع جغرافية متعددة.","نظام تفوض فيه كافة القرارات لرئاسة الأقسام الأولى.","نظام تتخذ فيه جميع القرارات من قبل الإدارة العليا."],"optionsEn":["Eliminating formal lines of authority between levels.","Distributing departments across multiple geographic locations.","A system where all decisions are delegated to first-line head nurses.","A system of management in which all decisions are made by top level manager."],"correct":3,"whyAr":"يُعرّف الكتاب المركزية بأنها نظام إدارة تُتخذ فيه جميع القرارات بواسطة مدير المستوى الأعلى.","whyEn":"The book defines centralization as a system of management in which all decisions are made by top-level managers."},{"ar":"ما هو الاتجاه الذي تتحرك فيه 'السلطة' (Authority) داخل التنظيم؟","en":"What is the direction in which 'authority' moves within the organization?","optionsAr":["تتحرك في اتجاه هبوطي (Downward direction).","تتحرك عشوائياً دون مسار محدد.","تتحرك في اتجاه صاعد حصراً.","تتحرك أفقياً فقط بين الزملاء."],"optionsEn":["It moves in a downward direction.","It moves randomly without a specific path.","It moves exclusively in an upward direction.","It moves horizontally only between peers."],"correct":0,"whyAr":"يُعرّف الكتاب السلطة بأنها الحق في اتخاذ القرارات النهائية وتتحرك في اتجاه هبوطي (downward direction).","whyEn":"The book defines authority as the right to take final decisions, acting or commanding others, moving in a downward direction."},{"ar":"مديرة تمريض في مستشفى كبير تركز اتخاذ كافة القرارات الاستراتيجية والتشغيلية بنفسها دون منح أي صلاحيات لرئیسات الأقسام. ما هو النظام الإداري المطبق هنا؟","en":"A nursing director in a large hospital concentrates making all strategic and operational decisions herself without granting any authority to head nurses. What management system is applied here?","optionsAr":["اللامركزية (Decentralization)","التنظيم غير الرسمي (Informal organization)","المركزية (Centralization)","نطاق الإشراف الواسع (Wide span of control)"],"optionsEn":["Decentralization","Informal organization","Centralization","Wide span of control"],"correct":2,"whyAr":"هذا يمثل نظام المركزية حيث تتخذ جميع القرارات بواسطة الإدارة العليا.","whyEn":"This represents centralization where all decisions are made by top-level management."},{"ar":"ممرضة رئيسية في قسم الجراحة لاحظت أن مرؤوسيها يتلقون تعليمات متضاربة من أكثر من مشرف في نفس الوقت، مما أدى لحدوث ارتباك واضطراب. أي من مبادئ التنظيم تم انتهاكه في هذا الموقف؟","en":"A head nurse in the surgical department noticed that her subordinates received conflicting instructions from more than one supervisor at the same time, causing confusion. Which organizational principle was violated in this situation?","optionsAr":["التخصص الوظيفي (Specialization)","نطاق الإشراف الضيق (Narrow span of control)","وحدة القيادة (Unity of command)","مبدأ التكافؤ (Parity principle)"],"optionsEn":["Specialization","Narrow span of control","Unity of command","Parity principle"],"correct":2,"whyAr":"مبدأ وحدة القيادة ينص على أن كل موظف يجب أن يكون له رئيس واحد فقط، وتلقي الأوامر من عدة أشخاص يسبب الارتباك.","whyEn":"The principle of unity of command states that each employee should have only one boss; receiving orders from several people leads to confusion."},{"ar":"أراد مدير مستشفى إظهار الهيكل التنظيمي بطريقة تبين الإدارة العليا على اليسار والمستويات الأدنى تتجه نحو اليمين. ما نوع الخريطة التنظيمية الملائمة لذلك؟","en":"A hospital manager wanted to show the organizational structure in a way that depicts high-level management on the left and lower positions extending to the right. What type of organizational chart is appropriate for this?","optionsAr":["الخريطة العمودية التقليدية","خريطة العلاقات غير الرسمية","الخريطة الأفقية أو من اليسار لليمين (Left-to-right / Horizontal chart)","الخريطة الدائرية (Circular chart)"],"optionsEn":["Traditional vertical chart","Informal relationship chart","Left-to-right (Horizontal) chart","Circular chart"],"correct":2,"whyAr":"يوضح الكتاب أن الخريطة الأفقية (Left-to-right chart) تظهر الإدارة العليا على اليسار والمواقع الأدنى إلى اليمين.","whyEn":"The book explains that the left-to-right (horizontal) chart shows high-level management at the left with lower positions to the right."},{"ar":"إذا قبلت إحدى رئيسات الأقسام تكليفاً رسمياً بإدارة مشروع جودة الرعاية في المستشفى، فماذا يُسمى الالتزام المترتب على قبول هذا التكاليف وفقاً للفصل؟","en":"If a head nurse accepts an official assignment to manage the hospital care quality project, what is the obligation resulting from accepting this assignment called according to the chapter?","optionsAr":["التخصص الإداري","اللامركزية المطلقة","المسؤولية (Responsibility)","السلطة القانونية (Legal authority)"],"optionsEn":["Administrative specialization","Absolute decentralization","Responsibility","Legal authority"],"correct":2,"whyAr":"يُعرّف الكتاب المسؤولية (Responsibility) بأنها الالتزام المرتبط عندما يقبل الشخص التكليف.","whyEn":"The book defines responsibility as the obligation involved when one accepts an assignment."},{"ar":"ممرضة في وحدة العناية المركزة تتمتع بخبرة استثنائية ومعرفة متقدمة جعلت زملائها يلجئون إليها دائماً للاستشارة الفنية بغض النظر عن موقعها الوظيفي. ماذا تُسمى هذه السلطة؟","en":"A nurse in the ICU has exceptional experience and advanced knowledge making her colleagues always turn to her for technical consultation regardless of her job position. What is this authority called?","optionsAr":["السلطة المطلقة (Ultimate authority)","السلطة القانونية (Legal authority)","السلطة التشغيلية (Operational authority)","السلطة الفنية (Technical authority)"],"optionsEn":["Ultimate authority","Legal authority","Operational authority","Technical authority"],"correct":3,"whyAr":"يُشير الكتاب إلى أن السلطة الفنية تتعلق بالشخص الذي يُعد خبيراً معترفاً به في مجال معين ولا يشترط أن تستمد من المنصب.","whyEn":"The book points out that technical authority refers to a person who is a recognized expert in some field and does not necessarily derive from a position."},{"ar":"أي من الخيارات التالية يُعتبر من عيوب نظام المركزية (Centralization) الإدارية؟","en":"Which of the following is considered a disadvantage of administrative centralization?","optionsAr":["ارتفاع تكاليف التشغيل بشكل مبالغ فيه نتيجة كثرة المديرين.","حرمان العاملين والإدارة الوسطى من التفكير النقدي ونموهم المهني.","صعوبة تحقيق أي توحيد في سياسات العمل.","ازدواجية الوظائف بشكل كبير في كل الوحدات."],"optionsEn":["Excessive increase in operating costs due to many managers.","Relieving employees and middle managers from critical thinking and preventing professional growth.","Difficulty in achieving any uniformity in work policies.","Major duplication of functions across all units."],"correct":1,"whyAr":"يذكر الكتاب ضمن عيوب المركزية أن التحكم في صنع القرار من قِبل الإدارة العليا يعفي الموظفين من التفكير النقدي ويصبحون سلبيين ويمنع نمو الإدارة الوسطى.","whyEn":"The book mentions among centralization disadvantages that control of decision-making by top management relieves employees from critical thinking and prevents middle managers' growth."},{"ar":"ما هو الغرض الرئيسي من عملية 'التقسيم الإداري' (Departmentation) في الهيكل التنظيمي؟","en":"What is the primary purpose of 'departmentation' in the organizational structure?","optionsAr":["زيادة حجم الصراعات غير الرسمية بين العاملين.","تأخير اتخاذ القرارات الطارئة لحين موافقة الوزارة.","إلغاء خطوط الاتصال الرسمية بين الأقسام المختلفة.","تجميع الأنشطة في وحدات إدارية لتمكين المدير من التخصص في نطاق محدود."],"optionsEn":["Increasing informal conflicts among employees.","Delaying emergency decision-making until ministry approval.","Eliminating formal communication lines between different departments.","Grouping activities into administrative units so a manager can specialize within a limited range of activity."],"correct":3,"whyAr":"يُبيّن الكتاب أن الغرض الأساسي للتقسيم الإداري هو تجزئة الهيكل التنظيمي لكي يستطيع المدير التخصص ضمن نطاق محدود من النشاط.","whyEn":"The book shows that the primary purpose of departmentation is to subdivide organizational structure so that a manager can specialize within a limited range of activity."},{"ar":"عندما يطلب المدير من المرؤوسين أن يكونوا مسؤولين ومحاسبين أمام الإدارة عن أداء واجباتهم بالطريقة الصحيحة، في أي اتجاه تتحرك هذه المساءلة (Accountability)؟","en":"When a manager asks subordinates to be answerable to management for performing their duties properly, in which direction does this accountability move?","optionsAr":["تتحرك أفقياً بين الأقسام المختلفة.","تتحرك بشكل عشوائي دون اتجاه.","تتحرك في اتجاه صاعد (Upward direction).","تتحرك في اتجاه هبوطي فقط."],"optionsEn":["It moves horizontally between different departments.","It moves randomly without direction.","It moves in an upward direction.","It moves exclusively in a downward direction."],"correct":2,"whyAr":"ينص الكتاب على أن المساءلة تعني أن المرؤوسين يجب أن يكونوا محاسبين عن أداء واجباتهم بشكل صحيح وتتحرك في اتجاه صاعد.","whyEn":"The book states that accountability means subordinates must be held answerable to properly carry out their duties, moving in an upward direction."},{"ar":"ما هي إحدى مزايا 'نطاق الإشراف الضيق' (Narrow span of control) وفقاً لما ورد في الفصل؟","en":"What is one of the advantages of a 'narrow span of control' according to the chapter?","optionsAr":["استقلالية تامة للمرؤوسين دون توجيه.","وجود إشراف دقيق ورقابة قريبة.","غياب أي تواصل مباشر بين الرئيس والمرؤوس.","قلة مستويات الإدارة وانخفاض التكاليف."],"optionsEn":["Complete independence of subordinates without guidance.","Close supervision and close control.","Absence of direct communication between superior and subordinate.","Few management levels and low costs."],"correct":1,"whyAr":"يذكر الكتاب من مزايا نطاق الإشراف الضيق: الإشراف القريب، الرقابة القريبة، وسرعة الاتصال بين المرؤوسين والرؤساء.","whyEn":"The book mentions advantages of a narrow span of control as close supervision, close control, and fast communication between subordinates and superiors."},{"ar":"ما الذي يعبر عنه الهيكل التنظيمي 'غير الرسمي' (Informal organizational structure) في بيئة العمل؟","en":"What does the 'informal' organizational structure express in the work environment?","optionsAr":["الجداول الزمنية الرسمية لتوزيع المناوبات.","القرارات الصادرة رسمياً عن مجلس إدارة المستشفى.","الخطوط الرسمية المعتمدة لتدفق الأوامر من الإدارة العليا.","العلاقات الشخصية والاجتماعية التي لا تظهر على الخريطة التنظيمية."],"optionsEn":["Official schedules for shift distribution.","Decisions officially issued by the hospital board of directors.","The official approved lines for flowing orders from top management.","Personal and social relationships that do not appear on the organizational chart."],"correct":3,"whyAr":"يُعرّف الكتاب الهيكل التنظيمي غير الرسمي بأنه العلاقات الشخصية والاجتماعية التي لا تظهر على الخريطة التنظيمية.","whyEn":"The book defines the informal organization as personal and social relationships that do not appear on the organizational chart."}]},{"id":9,"ar":"التوظيف","en":"Staffing","pages":"139–155","summaryAr":"يتناول هذا الفصل عملية التوظيف (Staffing) وأهدافها والعوامل المؤثرة عليها، وطرق حساب التوظيف، وتخطيط القوى العاملة (Manpower planning)، وفلسفة التوظيف العامة وفي مجال التمريض، بالإضافة إلى مبادئ جمعية التمريض الأمريكية (ANA) للتوظيف.","summaryEn":"This chapter covers the concept and goals of staffing, factors affecting staffing, methods of calculating staffing, manpower planning, philosophies of staffing in general and in nursing, and ANA principles of nursing staffing.","textAr":"يُعرف التوظيف (Staffing) بأنه عملية التأكد من توفر أعداد كافية ومزيج مناسب من الموظفين لتلبية احتياجات الوحدة اليومية وأهداف المنظمة، وهو عملية تحديد وتعيين الأفراد المناسبين ذوي المؤهلات المناسبة في الوظيفة المناسبة في الوقت المناسب لتحقيق أغراض المنظمة.\n\nتشمل أهداف التوظيف (Goals of staffing) توفير أعداد ومزيج مناسب من طاقم التمريض، وتقديم رعاية تمريضية فعالة وفعالة من حيث الكفاءة، وزيادة الإنتاجية، وتجنب ارتباك الأدوار ومشاكل الاتصال وضياع الوقت، والحفاظ على الاستقرار في العمل الجماعي، وتزويد كل وحدة تمريضية بالعدد المناسب من كل فئة من العمال لتقديم الرعاية والراحة للمرضى.\n\nتتأثر عملية التوظيف بمجموعة من العوامل تشمل عوامل المرضى مثل نوع المريض (العمر، الجنس، التشخيص) وتقلبات القبول وطول الإقامة وشدة التعقيد، وعوامل الموظفين مثل سياسات شؤون الموظفين ومستويات التعليم والخبرة والوصف الوظيفي والمنافسة في السوق، وعوامل البيئة مثل عدد أسرة المرضى وتوفر الإمدادات والمعدات والهيكل التنظيمي.\n\nتتعدد طرق حساب التوظيف (Methods of calculating staffing) لتشمل نظام تصنيف المرضى (Patient classification system) لتحديد احتياجات عبء العمل موضوعياً، والمجموعات المرتبطة تشخيصياً (Diagnostic related groups)، وشدة وتعقيد الرعاية لتوقع ساعات الرعاية التمريضية المطلوبة، وصيغ التوظيف (Staffing formulas) التي تأخذ في الاعتبار الإجازات والعطلات والغياب ووقت تطوير الموظفين.\n\nيُعرف تخطيط القوى العاملة (Manpower planning) بأنه إستراتيجية للحصول على الموارد البشرية للمنظمة واستخدامها وتحسينها والحفاظ عليها، وتتضمن أهدافه الرئيسية ضمان الاستخدام الأقصى للأفراد، وتقييم المتطلبات المستقبلية، وتحديد مصادر التوظيف، وتوقع الاحتياجات من السجلات السابقة، وتحديد متطلبات التدريب، بينما تشمل الأنشطة الرئيسية التنبؤ بالمتطلبات المستقبلية وحصر الموارد الحالية.\n\nتتنوع فلسفات التوظيف بين المنظور التنظيمي الذي يرى أن تنظيم الوظائف بالشكل المناسب يولد الهيكل والاتجاهات المواتية، والمهندس الصناعي الذي يرى الفرد موجهاً ميكانيكياً ومحفزاً اقتصادياً، وعالم السلوك الذي يركز على مشاعر المجموعة واتجاهاتها والمناخ النفسي والاجتماعي. أما فلسفة التوظيف في التمريض فتؤكد على مطابقة معرفة الموظفين ومهاراتهم لاحتياجات الرعاية، وتطوير خطة توظيف رئيسية مركزياً بواسطة رؤساء التمريض والموظفين.\n\nتحدد أهداف التوظيف في التمريض توفير طاقم تمريض مهني بالكامل في وحدات العناية الحرجة وغرف العمليات والولادة والطوارئ، وتحقيق نسبة ممرض إلى مريض 1:1 في العناية الحرجة، ونسبة 2:1 بين المهني والعملي في الأقسام العامة، ونسبة 1:5 في وردتي النهار والمساء و1:10 في وردة الليل بالأقسام العامة، مع نشر الجداول قبل ثمانية أسابيع على الأقل.\n\nتتوزع مبادئ جمعية التمريض الأمريكية (ANA) لتوفير طاقم التمريض على ثلاثة جوانب رئيسية تتعلق بوحدة رعاية المرضى مثل تحليل الاحتياجات الفردية، والجانب المتعلق بالموظفين مثل الكفاءات السريرية والدعم القيادي، والجانب المتعلق بالمؤسسة والمنظمة مثل سياسات العمل التي تقدر الممرضين كأصول استراتيجية.","textEn":"Staffing is defined as the process of ascertaining that adequate numbers and an appropriate mix of personnel are available to meet daily unit needs and organizational goals, and determining and assigning the right personnel with the right qualifications to the job at the right time.\n\nGoals of staffing include appropriate numbers and mix of nursing staff, delivery of effective and efficient nursing care, increase productivity, avoid role confusion and time waste, maintain stability in teamwork, and provide each nursing unit with appropriate workers to give care and comfort to patients.\n\nFactors affecting staffing include patient factors such as patient type, admission fluctuations, length of stay, and complexity of care; staff factors such as personnel policies, educational and experiential levels, and job descriptions; and environmental factors such as number of beds, availability of supplies, and organizational structure.\n\nMethods of calculating staffing include the patient classification system, diagnostic related groups, acuity and complexity of care to estimate nursing care hours needed, and staffing formulas that consider coverage requirements, vacations, holidays, absenteeism, and staff development time.\n\nManpower planning is defined as a strategy for the acquisition, utilization, improvement, and preservation of an organization's human resources, with main objectives including maximum utilization, assessing future requirements, determining recruitment sources, anticipating problems, and determining training requirements.\n\nStaffing philosophies include the organizational theorist view focusing on proper job organization, the industrial engineer view seeing individuals as mechanistically oriented, and the behavioral scientist focusing on group sentiments and psychological climate, while nursing staffing philosophy matches employee skills to patient care needs centrally.\n\nObjectives of staffing in nursing include providing all-professional nurse staff in critical care units, 1:1 nurse-patient ratio in critical units, 2:1 professional-practical ratio in general units, 1:5 ratio on day and afternoon shifts and 1:10 on night shift, and posting schedules eight weeks in advance.\n\nANA principles of nursing staffing cover patient care unit-related principles reflecting aggregate patient needs, staff-related principles addressing clinical competencies and management support, and institution/organization-related principles reflecting a climate that values registered nurses as strategic assets.","terms":[["Staffing","عملية التأكد من توفر أعداد كافية ومزيج مناسب من الموظفين لتلبية احتياجات الوحدة اليومية وأهداف المنظمة.","The process of ascertaining that adequate numbers and an appropriate mix of personnel are available to meet daily unit needs and organizational goals."],["Manpower planning","إستراتيجية للحصول على الموارد البشرية للمنظمة واستخدامها وتحسينها والحفاظ عليها.","A strategy for the acquisition, utilization, improvement and preservation of the human resources of an organization."],["Patient classification system","نظام تم تطويره لتحديد متطلبات عبء العمل واحتياجات التوظيف بموضوعية.","A system developed to objectively determine workload requirements and staffing needs."],["Diagnostic related groups","طريقة لحساب التوظيف بناءً على التشخيص الطبي للمرضى.","Methods of calculating staffing based on the medical diagnosis of the patients."],["Personnel policies","سياسات شؤون الموظفين المتعلقة بالإجازات والعمل الإضافي والجزئي وظروف العمل.","Policies regarding vacation, overtime, part time, and work."]],"questions":[{"ar":"ما هو التعريف الدقيق لعملية التوظيف (Staffing) كما ورد في الكتاب؟","en":"What is the exact definition of staffing as stated in the book?","optionsAr":["مراقبة الأداء اليومي للعاملين واتخاذ الإجراءات التصحيحية.","عملية التأكد من توفر أعداد كافية ومزيج مناسب من الموظفين لتلبية احتياجات الوحدة اليومية وأهداف المنظمة.","تقسيم الأنشطة إلى أقسام إدارية فرعية.","وضع خطط مالية طويلة الأجل لشراء الأجهزة الطبية."],"optionsEn":["Monitoring daily employee performance and taking corrective actions.","The process of ascertaining that adequate numbers and an appropriate mix of personnel are available to meet daily unit needs and organizational goals.","Dividing activities into sub-administrative departments.","Formulating long-term financial plans to purchase medical devices."],"correct":1,"whyAr":"يُعرف الكتاب التوظيف بأنه عملية التأكد من توفر أعداد كافية ومزيج مناسب من الموظفين لتلبية احتياجات الوحدة اليومية وأهداف المنظمة.","whyEn":"The book defines staffing as the process of ascertaining that adequate numbers and an appropriate mix of personnel are available to meet daily unit needs and organizational goals."},{"ar":"ما هي الفئات الثلاث الرئيسية للعوامل المؤثرة على التوظيف المذكورة في الفصل؟","en":"What are the three main categories of factors affecting staffing mentioned in the chapter?","optionsAr":["عوامل الإدارة العليا، وعوامل التخطيط، وعوامل الرقابة.","العوامل المالية، والعوامل القانونية، والعوامل التكنولوجية.","عوامل المرضى، وعوامل الموظفين، وعوامل البيئة.","العوامل الجغرافية، وعوامل الطقس، وعوامل الهيكل التنظيمي."],"optionsEn":["Top management factors, planning factors, and control factors.","Financial factors, legal factors, and technological factors.","Patient factors, staff factors, and environmental factors.","Geographic factors, weather factors, and organizational structure factors."],"correct":2,"whyAr":"يذكر الكتاب أن العوامل المؤثرة على التوظيف تقسم إلى: عوامل المرضى، وعوامل الموظفين، وعوامل البيئة.","whyEn":"The book mentions that factors affecting staffing are divided into patient factors, staff factors, and environmental factors."},{"ar":"كيف يُعرف تخطيط القوى العاملة (Manpower planning) في الكتاب؟","en":"How is manpower planning defined in the book?","optionsAr":["إستراتيجية للحصول على الموارد البشرية للمنظمة واستخدامها وتحسينها والحفاظ عليها.","نظام إلكتروني لمراقبة حضور وانصراف الأطباء.","خطة مالية سنوية لتحديد أجور الموظفين والبدلات.","طريقة لجدولة الإجازات والعطلات الرسمية للعاملين."],"optionsEn":["A strategy for the acquisition, utilization, improvement and preservation of the human resources of an organization.","An electronic system to monitor doctors' attendance and departure.","An annual financial plan to determine employee salaries and allowances.","A method for scheduling vacations and official holidays for workers."],"correct":0,"whyAr":"يُعرّف الكتاب تخطيط القوى العاملة بأنه إستراتيجية للحصول على الموارد البشرية للمنظمة واستخدامها وتحسينها والحفاظ عليها.","whyEn":"The book defines manpower planning as a strategy for the acquisition, utilization, improvement and preservation of the human resources of an organization."},{"ar":"ما هي الفلسفات الثلاث العامة لإدارة الشؤون الشخصية والموظفين المذكورة في الكتاب؟","en":"What are the three general philosophies of personnel management mentioned in the book?","optionsAr":["الإدارة العلمية، والإدارة البيروقراطية، والإدارة التقليدية.","التحفيز الخارجي، والتحفيز الداخلي، والتحفيز المعنوي.","نظرية التنظيم، والمهندس الصناعي، وعالم السلوك.","المركزية، واللامركزية، والتفويض."],"optionsEn":["Scientific management, bureaucratic management, and traditional management.","Extrinsic motivation, intrinsic motivation, and moral motivation.","Organizational theorist, industrial engineer, and behavioral scientist.","Centralization, decentralization, and delegation."],"correct":2,"whyAr":"يؤكد الكتاب أن هناك ثلاث فلسفات عامة لإدارة الأفراد: نظري التنظيم، والمهندس الصناعي، وعالم السلوك.","whyEn":"The book confirms that there are three general philosophies of personnel management: organizational theorist, industrial engineer, and behavioral scientist."},{"ar":"كم عدد مبادئ جمعية التمريض الأمريكية (ANA) لتوفير طاقم التمريض المذكورة في الفصل؟","en":"How many ANA principles of nursing staffing are mentioned in the chapter?","optionsAr":["خمسة مبادئ.","سبعة مبادئ.","تسعة مبادئ (Nine principles).","اثنا عشر مبدأً."],"optionsEn":["Five principles.","Seven principles.","Nine principles.","Twelve principles."],"correct":2,"whyAr":"يذكر الفصل أن مبادئ جمعية التمريض الأمريكية لتوفير طاقم التمريض هي تسعة مبادئ.","whyEn":"The chapter mentions that the ANA principles of nursing staffing are nine principles."},{"ar":"ما هو الغرض الأساسي من استخدام 'نظام تصنيف المرضى' (Patient classification system) في حساب التوظيف؟","en":"What is the primary purpose of using a 'patient classification system' in calculating staffing?","optionsAr":["توزيع الغرف والأسرة على الأقسام الطبية بناءً على ألوانها.","تحديد متطلبات عبء العمل واحتياجات التوظيف بموضوعية.","تحديد تكلفة الأدوية المصروفة لكل مريض.","تصنيف المرضى حسب حالتهم الاجتماعية والمادية فقط."],"optionsEn":["To distribute rooms and beds to medical departments based on colors.","To objectively determine workload requirements and staffing needs.","To determine the cost of medications dispensed to each patient.","To classify patients based on their social and financial status only."],"correct":1,"whyAr":"ينص الكتاب على أن نظام تصنيف المرضى تم تطويره لتحديد متطلبات عبء العمل واحتياجات التوظيف بموضوعية.","whyEn":"The book states that the patient classification system is a system developed to objectively determine workload requirements and staffing needs."},{"ar":"كيف يرى 'المهندس الصناعي' (Industrial engineer) العامل البشري واحتياجاته في فلسفة التوظيف؟","en":"How does the 'industrial engineer' view the human worker and their needs in staffing philosophy?","optionsAr":["يرى الفرد موجهاً ميكانيكياً ومحفزاً اقتصادياً وتحتاج احتياجاته للتوافق مع العملية الأكثر كفاءة.","يرى أن الهيكل التنظيمي غير الرسمي هو الأساس في الإنتاج.","يرى أن احتياجات الإنسان غير متوقعة ومتغيرة تماماً بحسب المزاج.","يرى أن التركيز يجب أن ينصب بالكامل على المناخ النفسي والاجتماعي."],"optionsEn":["He sees the individual as mechanistically oriented and economically motivated, with needs best met by attuning to the efficient process.","He believes the informal organizational structure is the basis of production.","He views human needs as unpredictable and completely variable based on mood.","He believes the focus should entirely be on the psychological and social climate."],"correct":0,"whyAr":"يشرح الكتاب أن المهندس الصناعي يعتقد أن الإنسان موجه ميكانيكياً ومحفز اقتصادياً وتُلبي احتياجاته بتوافق الفرد مع عملية العمل الأكثر كفاءة.","whyEn":"The book explains that the industrial engineer believes man is mechanistically oriented and economically motivated, with needs best met by attuning the individual to the efficient work process."},{"ar":"ما هي الفكرة الأساسية التي يركز عليها 'عالم السلوك' (Behavioral scientist) في فلسفة إدارة شؤون الموظفين؟","en":"What is the core idea that the 'behavioral scientist' focuses on in personnel management philosophy?","optionsAr":["وضع القواعد والقوانين البيروقراطية الصارمة للتنظيم.","التركيز على مشاعر المجموعة واتجاهات الموظفين والمناخ النفسي والاجتماعي للمنظمة.","التركيز الحصري على الأرباح المالية وتقليل التكاليف.","التصميم الهندسي البحت لخطوط الإنتاج وآلات العمل."],"optionsEn":["Establishing strict bureaucratic rules and regulations for the organization.","Focusing on group sentiments, employee attitudes, and the organization's social and psychological climate.","Focusing exclusively on financial profits and cost reduction.","Pure engineering design of production lines and work machines."],"correct":1,"whyAr":"يوضح الكتاب أن عالم السلوك يركز على مشاعر المجموعة واتجاهات الموظفين الأفراد والمناخ الاجتماعي والنفسي للمنظمة.","whyEn":"The book shows that the behavioral scientist focuses on group sentiments, attitudes of individual employees, and the organization's social and psychological climate."},{"ar":"عندما تقوم إدارة التمريض بتقييم الأنشطة الرئيسية لتخطيط القوى العاملة، ما هو الإجراء المرتبط بـ 'حصر ومخزون الموارد البشرية الحالية' (Inventorying present manpower resources)?","en":"When nursing management evaluates major manpower planning activities, what action is associated with 'inventorying present manpower resources'?","optionsAr":["إلغاء الوظائف الشاغرة غير الضرورية فوراً.","التنبؤ بعدد الموظفين المطلوبين بعد عشر سنوات قادمة.","تحليل الدرجة التي يتم بها توظيف الموارد الحالية بشكل أمثل.","وضع ميزانية شراء الأجهزة الجديدة للوحدة."],"optionsEn":["Immediately eliminating unnecessary vacant positions.","Predicting the number of employees required ten years in the future.","Analyzing the degree to which present resources are employed optimally.","Establishing a budget to purchase new unit equipment."],"correct":2,"whyAr":"يذكر الكتاب أن الأنشطة الرئيسية لتخطيط القوى العاملة تشمل حصر موارد القوى العاملة الحالية وتحليل درجة توظيف هذه الموارد بشكل أمثل.","whyEn":"The book mentions that major activities of manpower planning include inventorying present manpower resources and analyzing the degree to which these resources are employed optimally."},{"ar":"ما هو الهدف من قيام مديري التمريض بتطوير 'خطة توظيف رئيسية مركزية' وفقاً لفلسفة التوظيف في التمريض؟","en":"What is the purpose of nurse managers developing a 'centralized master staffing plan' according to the nursing staffing philosophy?","optionsAr":["للتحكم في ميزانية أدوية المستشفى بالكامل.","لضمان مطابقة معرفة الموظفين ومهاراتهم لاحتياجات رعاية المرضى بشكل يحسن الرضا والجودة.","لإجبار جميع الموظفين على العمل في وردة الليل حصراً.","لتقليل عدد المرضى المقبولين في المستشفى."],"optionsEn":["To control the entire hospital pharmaceutical budget.","To ensure matching employees' knowledge and skills to patient care needs in a manner optimizing satisfaction and quality.","To force all employees to work exclusively on the night shift.","To reduce the number of patients admitted to the hospital."],"correct":1,"whyAr":"تؤكد فلسفة التوظيف في التمريض على مطابقة معرفة الموظفين ومهاراتهم لاحتياجات رعاية المرضى بطريقة تحسن الرضا الوظيفي وجودة الرعاية من خلال خطة مركزية.","whyEn":"The nursing staffing philosophy emphasizes matching employees' knowledge and skills to patient care needs in a manner that optimizes job satisfaction and care quality."},{"ar":"ممرضة رئيسية في وحدة العناية المركزة تطلب توفير طاقم تمريض مهني بالكامل في القسم مع تحقيق نسبة ممرض إلى مريض 1:1 لكل وردية. بناءً على أهداف التوظيف في التمريض، هل هذا الإجراء صحيح؟","en":"A head nurse in an ICU requests an all-professional nursing staff in the unit with a 1:1 nurse-patient ratio on every shift. Based on nursing staffing objectives, is this action correct?","optionsAr":["لا، لأن العناية الحرجة تتطلب ممرضين عمليين فقط بنسبة 2:1.","لا، لأن نسبة الممرضين في العناية الحرجة يجب أن تكون 1:10 دائماً.","نعم، لأن أهداف التوظيف في التمريض تنص على توفير طاقم مهني بالكامل ونسبة 1:1 في العناية الحرجة.","نعم، ولكن بشرط نشر الجداول قبل يومين فقط من بدء الشهر."],"optionsEn":["No, because critical care requires practical nurses only at a 2:1 ratio.","No, because the nurse ratio in critical care must always be 1:10.","Yes, because nursing staffing objectives state providing an all-professional nurse staff and 1:1 ratio in critical care.","Yes, but provided schedules are posted only two days before the month starts."],"correct":2,"whyAr":"تحدد أهداف التوظيف في التمريض توفير طاقم تمريض مهني بالكامل في وحدات العناية الحرجة، وتوفير نسبة 1:1 لكل وردية.","whyEn":"Nursing staffing objectives specify providing an all-professional nurse staff in critical care units and a 1:1 nurse-patient ratio for each shift in critical care units."},{"ar":"مستشفى عام يريد توظيف طاقم عمل لأقسام الجراحة والطب العام بحيث يحقق المعيار الموصى به لنسبة الممرضين المهنيين إلى العمليين (Professional-practical ratio). ما هي النسبة المستهدفة طبقاً للكتاب؟","en":"A general hospital wants to staff general medical and surgical units to achieve the recommended professional-practical nurse ratio. What is the target ratio according to the book?","optionsAr":["نسبة 2:1 (professional-practical ratio).","نسبة 5:5 متساوية تماماً.","نسبة 1:1 في جميع الأقسام العامة.","نسبة 1:10 بين المهني والعملي."],"optionsEn":["A 2:1 professional-practical ratio.","A completely equal 5:5 ratio.","A 1:1 in all general units.","A 1:10 ratio between professional and practical."],"correct":0,"whyAr":"تنص أهداف التوظيف في التمريض على staffing أقسام الجراحة والطب العام لتحقيق نسبة 2:1 بين الممرض المهني والممرض العملي.","whyEn":"Nursing staffing objectives state staffing general medical and surgical units to achieve a 2:1 professional-practical nurse ratio."},{"ar":"رئيسة تمريض مسؤولة عن إعداد الجداول الزمنية لوحدة العناية، ومتى يجب عليها نشر جداول العمل الزمنية لجميع الموظفين وفقاً لتوجيهات أهداف التوظيف في التمريض؟","en":"A head nurse is responsible for preparing schedules for the unit. When should she post time schedules for all personnel according to nursing staffing objectives?","optionsAr":["قبل يومين من بداية الأسبوع.","في نهاية كل شهر بأثر رجعي.","قبل ثمانية أسابيع على الأقل (at least eight weeks in advance).","قبل أربع وعشرين ساعة فقط."],"optionsEn":["Two days before the week begins.","At the end of each month retroactively.","At least eight weeks in advance.","Only twenty-four hours before."],"correct":2,"whyAr":"تحدد أهداف التوظيف في التمريض ضرورة نشر الجداول الزمنية لجميع الموظفين قبل ثمانية أسابيع على الأقل.","whyEn":"Nursing staffing objectives specify posting time schedules for all personnel at least eight weeks in advance."},{"ar":"أرادت ممرضة رئيسية في قسم الباطنة العامة معرفة نسبة الممرضين إلى المرضى الواجب توافرها في وردة الليل (Night shift) بناءً على أهداف التوظيف في التمريض. ما هي النسبة الصحيحة؟","en":"A head nurse in a general medical unit wanted to know the nurse-patient ratio required on the night shift based on nursing staffing objectives. What is the correct ratio?","optionsAr":["ممرض واحد لكل مريضين (1:2).","ممرض واحد لكل مريض واحد (1:1).","ممرض واحد لكل عشرة مرضى (1:10 nurse-patient ratio).","ممرض واحد لكل خمسة مرضى (1:5)."],"optionsEn":["1:2 nurse-patient ratio.","1:1 nurse-patient ratio.","1:10 nurse-patient ratio.","1:5 nurse-patient ratio."],"correct":2,"whyAr":"تحدد أهداف التوظيف في التمريض نسبة 1:5 في وردتي النهار والمساء، ونسبة 1:10 في وردة الليل بالأقسام العامة.","whyEn":"Nursing staffing objectives specify a 1:5 nurse-patient ratio on day and afternoon shifts and a 1:10 nurse-patient ratio on the night shift in general units."},{"ar":"مستشفى يقوم بتصنيف المرضى وتحديد عدد ساعات الرعاية التمريضية المطلوبة لكل وردية بالاعتماد على التشخيص الطبي للمريض. ماذا تُسمى هذه الطريقة لحساب التوظيف؟","en":"A hospital classifies patients and determines nursing care hours needed per shift based on the patient's medical diagnosis. What is this method of calculating staffing called?","optionsAr":["المجموعات المرتبطة تشخيصياً (Diagnostic related groups).","ميزانية رأس المال والإنفاق.","جدول الإجازات السنوية الإجبارية.","نظام تقييم الأداء السنوي."],"optionsEn":["Diagnostic related groups.","Capital and expenditure budget.","Mandatory annual leave schedule.","Annual performance appraisal system."],"correct":0,"whyAr":"يشير الكتاب إلى أن طريقة حساب التوظيف بناءً على التشخيص الطبي للمرضى تُعرف بالمجموعات المرتبطة تشخيصياً (Diagnostic related groups).","whyEn":"The book indicates that calculating staffing based on the medical diagnosis of patients is called diagnostic related groups."}]},{"id":10,"ar":"التواصل التنظيمي","en":"Organizational Communication","pages":"156–177","summaryAr":"يتناول هذا الفصل مفهوم التواصل التنظيمي وعناصره وأهميته في بناء الثقة وتقليل سوء الفهم، وأنواعه المختلفة مثل التواصل الرسمي وغير الرسمي والعمودي والأفقي، وأدواته واستراتيجياته في الرعاية الصحية مثل SBAR لتحسين سلامة المرضى.","summaryEn":"This chapter covers the concept of organizational communication, its elements and importance in building trust and reducing misunderstanding, its types such as formal, informal, vertical, and horizontal, and its tools and strategies in healthcare like SBAR to improve patient safety.","textAr":"يُشتق مصطلح التواصل من الكلمة اللاتينية communis وتعني المشاركة، وهو عملية تبادل المعلومات بين الأفراد من خلال نظام مشترك من الرموز أو الإشارات، ويحدث تفاعلياً بين مرسل ومستقبل مع تلقي رد الفعل.\n\nتنقسم أنواع التواصل إلى الاتصال الرسمي لنقل المعلومات الرسمية، والاتصال غير الرسمي المعروف بشبكة الكروم أو القيل والقال الناشئ عن العلاقات الشخصية.\n\nيُعرّف التواصل التنظيمي بأنه مكون إداري يضم خطط الاتصال الاستراتيجية والممارسات لتوجيه وإدارة المعلومات داخلياً وخارجياً.\n\nتكمن أهمية التواصل التنظيمي في بناء الثقة، وتأسيس علاقات عمل أقوى، وتقليل سوء الفهم والمعلومات الخاطئة، ومساعدة الموظفين على فهم رسالة الشركة، وتحسين الكفاءة وتقليل الأخطاء.\n\nتشمل أنواع التواصل التنظيمي التواصل العمودي بشقيه التصاعدي والهبوطي، والتواصل الأفقي الشائع في الشركات الناشئة، بالإضافة للاتصالات الداخلية والخارجية والشفهية والمكتوبة.\n\nتشتمل عناصر التواصل الفعال على التعاطف لفهم مشاعر الآخرين، والوضوح لإرسال رسائل محددة، والتواصل الإيجابي، والتوكيد أو الحزم للتعبير عن الأفكار باحترام، والتأمل الذاتي لتصفية الذهن.\n\nتتطلب إدارة التواصل بكفاءة ربطه بالخطة الاستراتيجية للمنظمة، وفهم الجمهور، وإشراك الموظفين بمحادثات ثنائية الاتجاه، وتوزيع المحتوى عبر القنوات المناسبة، وقياس النتائج.\n\nتكتسي أهمية التواصل الفعال في الرعاية الصحية أهمية بالغة لضمان استمرار الرعاية ورفع السلامة باستخدام أدوات مثل التواصل مغلق الحلقة، وأداة إس بار، والخصائص الخمس، وتقنية آي باس الباتون، وقراءة التحقق.","textEn":"Communication is derived from the Latin word communis, meaning to share, and is a process of exchanging information between individuals interactively between a sender and receiver with feedback.\n\nTypes of communication include formal communication for official messages and informal communication known as grapevine communication arising from personal relationships.\n\nOrganizational communication describes an important management component that includes strategic communication plans and practices to manage information internally and externally.\n\nThe importance of organizational communication inc
